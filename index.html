<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KarmSetu — AI Competency Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<!-- Client-side document parsing libraries (used to extract real text from
     learner-uploaded PDF / DOCX / PPTX / TXT files — see extractTextFromFile). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --ink:#12142B;
  --indigo-950:#161A3A;
  --indigo-900:#1E2260;
  --indigo-700:#33389B;
  --indigo-600:#4338CA;
  --indigo-500:#5B52E8;
  --sky:#1AA6D9;
  --amber:#E8A33D;
  --amber-deep:#C97F1B;
  --green:#12946B;
  --green-bg:#E4F6EE;
  --yellow:#B8860B;
  --yellow-bg:#FBF1DA;
  --orange:#C1631A;
  --orange-bg:#FBE9DA;
  --red:#C23B3B;
  --red-bg:#FBE4E4;
  --paper:#F6F5F1;
  --paper-dim:#EFEDE6;
  --card:#FFFFFF;
  --line:#E4E1D6;
  --line-strong:#D2CEBE;
  --text:#22243A;
  --text-dim:#5B5D74;
  --text-faint:#8C8DA0;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:26px;
  --shadow-card: 0 1px 2px rgba(18,20,43,0.04), 0 8px 24px -12px rgba(18,20,43,0.10);
  --shadow-pop: 0 12px 40px -12px rgba(30,34,96,0.28);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
h1,h2,h3,h4,.font-display{
  font-family:'Sora',system-ui,sans-serif;
  color:var(--ink);
  margin:0;
  letter-spacing:-0.01em;
}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--indigo-500);color:#fff;}
:focus-visible{outline:2.5px solid var(--indigo-500);outline-offset:2px;border-radius:6px;}

.app-shell{min-height:100vh;display:flex;flex-direction:column;}
.container{width:100%;max-width:1200px;margin:0 auto;padding:0 28px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 24px;border-radius:12px;font-weight:600;font-size:15px;
  border:1px solid transparent;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:linear-gradient(135deg,var(--indigo-600),var(--indigo-500));color:#fff;box-shadow:0 10px 24px -10px rgba(67,56,202,0.55);}
.btn-primary:hover{box-shadow:0 14px 30px -10px rgba(67,56,202,0.65);}
.btn-secondary{background:#fff;color:var(--indigo-700);border-color:var(--line-strong);}
.btn-secondary:hover{border-color:var(--indigo-500);color:var(--indigo-600);}
.btn-ghost{background:transparent;color:var(--text-dim);}
.btn-ghost:hover{color:var(--ink);background:var(--paper-dim);}
.btn-sm{padding:9px 16px;font-size:13.5px;border-radius:10px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow-card);}
.card-pad{padding:26px;}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:100px;font-size:12.5px;font-weight:600;}
.badge-ai{background:var(--indigo-950);color:#DCD9FF;}
.badge-ai .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px rgba(232,163,61,0.25);}
.badge-igot{background:#FFF3E2;color:var(--amber-deep);border:1px solid #F3D6A6;}
.badge-external{background:#E7F3FC;color:#12799E;border:1px solid #BEE3F3;}
.badge-guided{background:var(--paper-dim);color:var(--indigo-700);border:1px solid var(--line-strong);}
.badge-youtube{background:#ECEBFB;color:var(--indigo-700);border:1px solid #CFCBF2;}
.badge-status-green{background:var(--green-bg);color:var(--green);}
.badge-status-yellow{background:var(--yellow-bg);color:var(--yellow);}
.badge-status-orange{background:var(--orange-bg);color:var(--orange);}
.badge-status-red{background:var(--red-bg);color:var(--red);}
.badge-neutral{background:var(--paper-dim);color:var(--text-dim);}

/* ---------- Nav ---------- */
.topnav{position:sticky;top:0;z-index:40;background:rgba(246,245,241,0.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.topnav-inner{display:flex;align-items:center;justify-content:space-between;height:74px;}
.logo{display:flex;align-items:center;gap:10px;font-family:'Sora';font-weight:700;font-size:20px;color:var(--ink);}
.logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--indigo-600),var(--sky));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-links{display:flex;align-items:center;gap:2px;}
.nav-link{padding:9px 16px;border-radius:9px;font-size:14.5px;font-weight:500;color:var(--text-dim);}
.nav-link:hover{color:var(--ink);background:var(--paper-dim);}
.nav-link.active{color:var(--indigo-700);background:#EDEBFB;}

/* App shell with sidebar */
.workspace{display:flex;min-height:100vh;}
.sidebar{width:246px;flex-shrink:0;background:var(--indigo-950);color:#C9C8E8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:26px 22px 20px;font-family:'Sora';font-weight:700;color:#fff;font-size:18px;}
.sidebar-nav{flex:1;padding:8px 14px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.sidebar-link{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-size:14.5px;font-weight:500;color:#ADACD1;transition:background .15s;}
.sidebar-link:hover{background:rgba(255,255,255,0.06);color:#fff;}
.sidebar-link.active{background:linear-gradient(135deg,var(--indigo-600),var(--indigo-500));color:#fff;}
.sidebar-foot{padding:16px 22px 22px;border-top:1px solid rgba(255,255,255,0.08);}
.main-area{flex:1;min-width:0;}
.main-inner{padding:32px 36px 80px;max-width:1180px;}
.mobile-topbar{display:none;}
.mobile-bottomnav{display:none;}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;padding:64px 0 40px;background:
  radial-gradient(1100px 480px at 82% -10%, rgba(91,82,232,0.16), transparent 60%),
  radial-gradient(700px 400px at 0% 10%, rgba(26,166,217,0.10), transparent 60%);
}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr 0.95fr;gap:56px;align-items:center;}
.eyebrow-ai{margin-bottom:22px;}
.hero h1{font-size:50px;line-height:1.08;font-weight:700;max-width:600px;}
.hero-sub{margin-top:20px;font-size:17.5px;color:var(--text-dim);max-width:520px;line-height:1.65;}
.hero-cta-row{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap;}

/* Competency network background (hero) */
.hero-network{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0.55;}
.hero-network svg{width:100%;height:100%;}
.hn-link{stroke:var(--indigo-500);stroke-width:1;opacity:0.22;}
.hn-node{fill:var(--indigo-500);animation:hnPulse 5.5s ease-in-out infinite;}
.hn-node.alt{fill:var(--sky);}
.hn-node.amber{fill:var(--amber);}
.hn-float1{animation:hnFloat1 9s ease-in-out infinite;}
.hn-float2{animation:hnFloat2 11s ease-in-out infinite;}
.hn-float3{animation:hnFloat3 8s ease-in-out infinite;}
@keyframes hnPulse{0%,100%{opacity:0.55;}50%{opacity:1;}}
@keyframes hnFloat1{0%,100%{transform:translate(0,0);}50%{transform:translate(6px,-14px);}}
@keyframes hnFloat2{0%,100%{transform:translate(0,0);}50%{transform:translate(-10px,10px);}}
@keyframes hnFloat3{0%,100%{transform:translate(0,0);}50%{transform:translate(8px,8px);}}
@media (prefers-reduced-motion: reduce){
  .hn-node,.hn-float1,.hn-float2,.hn-float3{animation:none;}
}
@media (max-width:640px){ .hero-network{opacity:0.35;} }

/* Journey diagram */
.journey-diagram{display:flex;flex-direction:column;gap:0;}
.journey-node{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-card);}
.journey-node .num{font-family:'JetBrains Mono';font-size:12px;color:var(--text-faint);width:20px;}
.journey-node .icon-wrap{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.journey-connector{height:26px;width:2px;background:linear-gradient(var(--line-strong),var(--line-strong));margin-left:33px;background-image:repeating-linear-gradient(to bottom, var(--line-strong) 0, var(--line-strong) 4px, transparent 4px, transparent 8px);}

/* Steps / How it works */
.steps-rail{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.step-card{padding:24px;border-radius:18px;background:#fff;border:1px solid var(--line);position:relative;}
.step-num{font-family:'JetBrains Mono';font-size:13px;color:var(--indigo-500);font-weight:600;margin-bottom:14px;display:block;}
.step-card h3{font-size:17px;margin-bottom:8px;}
.step-card p{color:var(--text-dim);font-size:14.5px;}

/* Section wrapper */
.section{padding:76px 0;}
.section-head{max-width:620px;margin-bottom:44px;}
.section-tag{color:var(--indigo-600);font-weight:600;font-size:13.5px;margin-bottom:10px;display:block;}
.section-head h2{font-size:33px;font-weight:700;}
.section-head p{margin-top:12px;color:var(--text-dim);font-size:16px;}

/* Progress bar */
.pbar-track{height:9px;border-radius:100px;background:var(--paper-dim);overflow:hidden;}
.pbar-fill{height:100%;border-radius:100px;transition:width .7s cubic-bezier(.4,0,.2,1);}
.pbar-thin{height:6px;}

/* Competency row */
.comp-row{display:grid;grid-template-columns:1fr 190px 78px;gap:18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
.comp-row:last-child{border-bottom:none;}
.comp-name{font-weight:600;font-size:14.5px;}

/* KPI card */
.kpi-card{padding:22px 24px;border-radius:18px;background:#fff;border:1px solid var(--line);}
.kpi-label{font-size:13px;color:var(--text-dim);font-weight:500;display:flex;align-items:center;gap:8px;}
.kpi-value{font-family:'Sora';font-size:32px;font-weight:700;margin-top:10px;color:var(--ink);}
.kpi-sub{margin-top:6px;font-size:12.5px;color:var(--text-faint);}

/* Auth */
.auth-shell{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;}
.auth-side{background:linear-gradient(160deg,var(--indigo-950),var(--indigo-700) 130%);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:48px;position:relative;overflow:hidden;}
.auth-form-side{display:flex;align-items:center;justify-content:center;padding:48px;}
.auth-form-wrap{width:100%;max-width:440px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px;color:var(--text);}
.field input,.field select{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line-strong);font-size:14.5px;font-family:inherit;background:#fff;color:var(--text);}
.field input:focus,.field select:focus{border-color:var(--indigo-500);}
.chip-select{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:9px 15px;border-radius:100px;border:1.5px solid var(--line-strong);font-size:13.5px;font-weight:500;background:#fff;color:var(--text-dim);transition:all .12s;}
.chip.selected{background:var(--indigo-600);border-color:var(--indigo-600);color:#fff;}
.auth-tabs{display:flex;gap:4px;background:var(--paper-dim);padding:4px;border-radius:12px;margin-bottom:28px;}
.auth-tab{flex:1;text-align:center;padding:10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--text-dim);background:transparent;border:none;}
.auth-tab.active{background:#fff;color:var(--indigo-700);box-shadow:var(--shadow-card);}
.field-password-wrap{position:relative;}
.field-password-wrap input{padding-right:42px;}
.field-eye-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-faint);display:flex;align-items:center;justify-content:center;padding:6px;border-radius:8px;}
.field-eye-btn:hover{color:var(--text-dim);background:var(--paper-dim);}
.auth-error{background:var(--red-bg);color:var(--red);padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:16px;display:flex;align-items:flex-start;gap:8px;line-height:1.4;}
.sidebar-logout-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:9px;background:transparent;border:1px solid rgba(255,255,255,0.14);color:#C9C8E8;font-size:13px;font-weight:600;margin-top:14px;}
.sidebar-logout-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}

/* Onboarding */
.onb-shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:56px 20px;}
.onb-progress{display:flex;gap:8px;width:100%;max-width:520px;margin-bottom:40px;}
.onb-progress span{height:5px;flex:1;border-radius:100px;background:var(--paper-dim);}
.onb-progress span.done{background:var(--indigo-600);}
.onb-card{width:100%;max-width:520px;}

/* Upload zone */
.upload-zone{border:2px dashed var(--line-strong);border-radius:20px;padding:56px 24px;text-align:center;background:#fff;transition:all .15s;}
.upload-zone.drag{border-color:var(--indigo-500);background:#F2F1FD;}
.file-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:#fff;border:1px solid var(--line);}

/* Processing screen */
.proc-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;}
.proc-card{width:100%;max-width:560px;text-align:center;}
.proc-orb{width:96px;height:96px;border-radius:50%;margin:0 auto 28px;position:relative;background:conic-gradient(var(--indigo-500),var(--sky),var(--indigo-500));animation:spin 2.4s linear infinite;display:flex;align-items:center;justify-content:center;}
.proc-orb::after{content:'';position:absolute;inset:8px;border-radius:50%;background:#fff;}
.proc-orb svg{position:relative;z-index:2;}
@keyframes spin{to{transform:rotate(360deg);}}
.proc-stage{display:flex;align-items:center;gap:12px;padding:11px 4px;font-size:14.5px;color:var(--text-faint);text-align:left;}
.proc-stage.done{color:var(--text);}
.proc-stage .tick{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--paper-dim);}
.proc-stage.done .tick{background:var(--green);}
.proc-stage.active .tick{background:var(--indigo-500);}

/* Assessment */
.quiz-shell{max-width:720px;}
.quiz-option{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;border:1.5px solid var(--line-strong);margin-bottom:12px;background:#fff;font-size:15px;font-weight:500;transition:all .12s;}
.quiz-option:hover{border-color:var(--indigo-400,#8A83EE);}
.quiz-option.selected{border-color:var(--indigo-600);background:#F2F1FD;}
.option-letter{width:28px;height:28px;border-radius:50%;background:var(--paper-dim);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text-dim);flex-shrink:0;}
.quiz-option.selected .option-letter{background:var(--indigo-600);color:#fff;}

/* Heatmap */
.heatmap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;}
.heatmap-cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center;}
.heatmap-cell .val{font-family:'Sora';font-weight:700;font-size:16px;}
.heatmap-cell .lbl{font-size:9.5px;font-weight:600;line-height:1.15;}

/* Gap cards */
.gap-card{padding:20px 22px;border-radius:16px;border:1px solid var(--line);background:#fff;}
.gap-arrow-row{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono';font-size:13px;color:var(--text-dim);margin-top:10px;}

/* Recommendation card */
.rec-card{padding:22px;border-radius:18px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:14px;}
.rec-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--text-dim);}
.rec-meta span{display:flex;align-items:center;gap:5px;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(18,20,43,0.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-box{background:#fff;border-radius:20px;max-width:440px;width:100%;padding:26px;box-shadow:var(--shadow-pop);}

/* Toast */
.toast-wrap{position:fixed;bottom:26px;right:26px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--ink);color:#fff;padding:14px 18px;border-radius:12px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;box-shadow:var(--shadow-pop);min-width:260px;animation:toastin .25s ease;}
@keyframes toastin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* Loop diagram */
.loop-wrap{display:flex;justify-content:center;padding:20px 0;}

/* Utility layout */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.flex-row{display:flex;align-items:center;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.gap-8{gap:8px;} .gap-10{gap:10px;} .gap-12{gap:12px;} .gap-14{gap:14px;} .gap-16{gap:16px;} .gap-20{gap:20px;}
.mt-4{margin-top:4px;} .mt-8{margin-top:8px;} .mt-10{margin-top:10px;} .mt-12{margin-top:12px;} .mt-14{margin-top:14px;} .mt-16{margin-top:16px;} .mt-20{margin-top:20px;} .mt-24{margin-top:24px;} .mt-32{margin-top:32px;} .mt-40{margin-top:40px;}
.mb-8{margin-bottom:8px;}
.text-dim{color:var(--text-dim);} .text-faint{color:var(--text-faint);}
.fs-11{font-size:11px;} .fs-12{font-size:12px;} .fs-13{font-size:13px;} .fs-14{font-size:14px;} .fs-15{font-size:15px;}
.fw-600{font-weight:600;} .fw-700{font-weight:700;}
.section-title-sm{font-size:22px;font-weight:700;font-family:'Sora';}
.divider{height:1px;background:var(--line);margin:28px 0;}
.center{text-align:center;}
.pill-tab{display:flex;gap:4px;background:var(--paper-dim);padding:4px;border-radius:12px;}
.pill-tab button{padding:9px 18px;border-radius:9px;border:none;background:transparent;font-weight:600;font-size:13.5px;color:var(--text-dim);}
.pill-tab button.active{background:#fff;color:var(--indigo-700);box-shadow:var(--shadow-card);}

footer.site-footer{border-top:1px solid var(--line);padding:36px 0;color:var(--text-faint);font-size:13.5px;}

@media (max-width: 980px){
  .hero-grid{grid-template-columns:1fr;}
  .hero h1{font-size:36px;}
  .steps-rail{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr;}
  .grid-4{grid-template-columns:1fr 1fr;}
  .grid-2{grid-template-columns:1fr;}
  .auth-shell{grid-template-columns:1fr;}
  .auth-side{display:none;}
  .nav-links{display:none;}
  .sidebar{display:none;}
  .mobile-topbar{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 18px;position:sticky;top:0;background:rgba(246,245,241,0.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:40;}
  .mobile-bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;padding:8px 4px;justify-content:space-around;}
  .mobile-bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--text-faint);font-weight:600;padding:4px;}
  .mobile-bottomnav a.active{color:var(--indigo-600);}
  .main-inner{padding:20px 16px 90px;}

  function fatalLang(){
    try{
      var v = localStorage.getItem('karmsetu_language');

    showFatal((e && e.message) ? e.message : String(e));
  });
  window.addEventListener('unhandledrejection', function(e){

      var root = document.getElementById('root');

      }
    }, 4000);
  });

function loadLanguage(){
  try{
    const v = localStorage.getItem(LANGUAGE_STORAGE_KEY);
    return (v && TRANSLATIONS[v]) ? v : "en";
  }catch(e){ return "en"; }
}
function saveLanguage(lang){
  try{ localStorage.setItem(LANGUAGE_STORAGE_KEY, lang); }catch(e){}
}
// Reads a dot-path key ("dashboard.title") out of a translation object.
function getPath(obj, path){
  return path.split(".").reduce((acc,k)=> (acc && acc[k]!==undefined) ? acc[k] : undefined, obj);
}

const LanguageContext = React.createContext(null);

function LanguageProvider({children}){
  const [language, setLanguageState] = useState(loadLanguage);
  const setLanguage = useCallback((lang)=>{
    if(!TRANSLATIONS[lang]) return;
    setLanguageState(lang);
    saveLanguage(lang);
  },[]);
  // t(key, params?) — looks up `key` (e.g. "dashboard.title") in the active
  // language, falls back to English, then to the raw key so nothing ever
  // silently renders blank. params does simple {name}-style interpolation.
  const t = useCallback((key, params)=>{
    let str = getPath(TRANSLATIONS[language], key);
    if(str===undefined) str = getPath(TRANSLATIONS.en, key);
    if(str===undefined) return key;
    if(params){
      Object.keys(params).forEach(k=>{
        str = str.replace(new RegExp("\\{"+k+"\\}","g"), params[k]);
      });
    }
    return str;
  },[language]);
  const value = useMemo(()=>({language, setLanguage, t}), [language, setLanguage, t]);
  return <LanguageContext.Provider value={value}>{children}</LanguageContext.Provider>;
}
function useLanguage(){
  return React.useContext(LanguageContext);
}
// Shared helper for the closed Beginner/Intermediate/Advanced vocabulary —
// reuses the existing auth.* translations wherever a difficulty/level value
// is shown as a UI label. Falls back to the raw value for anything else.
function difficultyLabel(t, level){
  const key = {Beginner:"auth.beginner", Intermediate:"auth.intermediate", Advanced:"auth.advanced"}[level];
  return key ? t(key) : level;
}
// Shared helper for the closed set of learning-goal chips (GOAL_OPTIONS) —
// translates the displayed label only; the underlying stored goal value/ID
// passed around the app (LEARNER.goal, session.goal, etc.) is untouched.

    "Data Analysis":"common.goalDataAnalysis",
    "Artificial Intelligence":"common.goalArtificialIntelligence",
    "Project Management":"common.goalProjectManagement",
    "Cybersecurity":"common.goalCybersecurity",

// Shared helper for the closed resource "type" vocabulary (Course/Practice
// Module/Learning Resource/Micro-course) — translates the displayed label
// only; the underlying stored type value used by business logic is untouched.
function resourceTypeLabel(t, type){

    "Course":"common.resourceTypeCourse",
    "Practice Module":"common.resourceTypePracticeModule",
    "Learning Resource":"common.resourceTypeLearningResource",
    "Micro-course":"common.resourceTypeMicroCourse",
  }[type];

}
// Non-hook variant of resourceTypeLabel for plain (non-component) functions
// that only have a `language` string, not a bound t() — e.g.
// genericResourceContent(). Same closed vocabulary, same fallback rules.
function resourceTypeLabelForLang(language, type){
  const key = {
    "Course":"resourceTypeCourse",
    "Practice Module":"resourceTypePracticeModule",
    "Learning Resource":"resourceTypeLearningResource",
    "Micro-course":"resourceTypeMicroCourse",
  }[type];
  if(!key) return type;
  const dict = (TRANSLATIONS[language] && TRANSLATIONS[language].common) || TRANSLATIONS.en.common;
  return dict[key] !== undefined ? dict[key] : TRANSLATIONS.en.common[key];
}
// Shared helper for the 9 fixed LOOP_STAGES labels (Learning Goal, Learning

// Compact "🌐 English ▾" selector + popover, matching the existing premium
// design system (same badge/card/shadow tokens as the rest of the app).
// `compact` shows a short code (EN/HI) instead of the full native name so it
// fits the tight mobile top bar without overlapping other controls.
function LanguageSwitcher({compact}){
  const {language, setLanguage, t} = useLanguage();
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  const current = LANGUAGES.find(l=>l.code===language) || LANGUAGES[0];
  useEffect(()=>{
    if(!open) return;
    const onDoc = (e)=>{ if(wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    const onKey = (e)=>{ if(e.key==="Escape") setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return ()=>{ document.removeEventListener("mousedown", onDoc); document.removeEventListener("keydown", onKey); };
  },[open]);
  return (
    <div className="lang-switcher" ref={wrapRef}>
      <button
        type="button"
        className={"lang-switcher-btn"+(compact?" compact":"")}
        aria-label={t("common.changeLanguage")}
        aria-haspopup="listbox"
        aria-expanded={open}
        onClick={()=>setOpen(o=>!o)}
      >
        <IconGlobe size={14}/><span>{compact ? current.short : current.native}</span><IconChevronDown size={12}/>
      </button>
      {open && (
        <div className="lang-switcher-menu" role="listbox">
          {LANGUAGES.map(l=>(
            <button
              type="button"
              key={l.code}
              role="option"
              aria-selected={l.code===language}
              className={"lang-switcher-item"+(l.code===language?" active":"")}
              onClick={()=>{ setLanguage(l.code); setOpen(false); }}
            >
              <span>{l.native}</span>
              {l.code===language && <IconCheck size={13}/>}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}


/* ============================= SESSION / AUTH (LOCAL PROTOTYPE) =============================
   This is a client-side-only prototype session layer backed by localStorage.
   It is NOT secure storage — passwords are kept in plain text purely so this
   prototype can validate login locally without a backend. Do not reuse this
   pattern outside of a local demo/prototype context.
*/
const ACCOUNTS_KEY = "karmsetu_accounts";
const SESSION_KEY = "karmsetu_session";

function loadAccounts(){
  try{ const v = JSON.parse(localStorage.getItem(ACCOUNTS_KEY)); return Array.isArray(v) ? v : []; }
  catch(e){ return []; }
}
function saveAccounts(accounts){
  try{ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts)); }catch(e){}
}
function loadSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY)) || null; }
  catch(e){ return null; }
}
function saveSession(session){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){}
}
function clearStoredSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
function isSessionActive(session){
  return !!(session && (session.isAuthenticated || session.isDemo));
}
function initials(name){
  if(!name) return "U";
  const parts = name.trim().split(/\s+/);
  return ((parts[0] ? parts[0][0] : "") + (parts[1] ? parts[1][0] : "")).toUpperCase() || "U";
}

// these fields directly at render time, so applySessionToLearner() below keeps
// them in sync with whichever account/demo session is currently active.
const LEARNER = {
  ...DEMO_PROFILE,
  // A brand-new learner has done nothing yet — no fabricated streak, no
  // default file. These only get populated from real session data (a real
  // upload, real activity) or, for a session with isDemo===true, from the
  // demo fixtures below. See applySessionToLearner().
  streak: 0,
  activityDates: [],
  file: null,
  uploadedMaterial: null,
  extractedTopics: null,
  generatedQuestions: null,
  reassessQuestions: null,
  resourceDefs: [],
  assessmentCompleted: false,
  assessmentScore: null,
  topicScores: null,
  topicStats: null,
  competencyScores: null,
  learningHistory: {},
  reassessCompleted: false,
  reassessScore: null,
  reassessScores: null,
  reassessTopicStats: null,
  resourceEffectiveness: [],
  competency: {ready:false, list:[], overall:0, mode:"pending"},
};

// DEMO_BASELINE is ONLY used for "Launch Demo Journey" / "Continue in Demo
// Mode" sessions (session.isDemo === true), so a visitor exploring the demo
// journey sees a fully populated workspace without taking the assessment.
// Real learner accounts never read this — their competency data comes from
// computeCompetencyView(), which is driven entirely by session state written
// after the learner actually submits the baseline assessment.
const DEMO_BASELINE = [
  {name:"Python Fundamentals", before:82, after:91},
  {name:"Data Cleaning", before:68, after:84},
  {name:"Data Visualization", before:54, after:78},
  {name:"Statistics", before:41, after:71},
  {name:"Machine Learning Basics", before:29, after:63},
];
// The five competencies tracked by KarmSetu. In this prototype each baseline
// assessment question is tagged with exactly one of these names as its
// "topic", so topic-wise performance and competency-wise performance are
// computed from the same per-topic scores (documented where they're stored).
const COMPETENCY_NAMES = DEMO_BASELINE.map(b=>b.name);

// Turns raw session data into the shape every workspace page reads to render
// competency scores. Precedence:
//   1) A real, completed baseline assessment (session.assessmentCompleted +
//      session.competencyScores) — always wins once present, even in a demo
//      session that took the actual quiz.
//   2) A demo session that hasn't taken the assessment yet — falls back to
//      DEMO_BASELINE so "Launch Demo Journey" shows a populated workspace.
//   3) Anything else (real learner, no assessment yet) — "not ready".
// Which competency/topic names are "active" for the current learner: the
// fixed demo set for a demo session, or — for a real learner — the topics
// KarmSetu actually extracted from THEIR uploaded material (never a
// hardcoded Data Analysis list).
function activeCompetencyNames(session){
  if(session && !session.isDemo && Array.isArray(session.extractedTopics) && session.extractedTopics.length){
    return session.extractedTopics;
  }
  return COMPETENCY_NAMES;
}
function computeCompetencyView(session){
  if(session && session.assessmentCompleted && session.competencyScores){
    // Once a real re-assessment exists, every page that reads the "current"
    // competency (Gaps, Competencies, Recommendations, Dashboard) recalculates
    // from the NEW post-learning scores, not the original baseline — this is
    // what makes gap detection and recommendations recalc after re-assessment.
    const usingReassessment = !!(session.reassessCompleted && session.reassessScores);
    const currentScores = usingReassessment ? session.reassessScores : session.competencyScores;
    const list = activeCompetencyNames(session)
      .filter(name=> typeof currentScores[name] === "number")
      .map(name=>{
        const before = currentScores[name];
        const target = Math.min(95, before+45);
        return {name, before, after: target, target};
      });
    if(list.length){
      const overall = Math.round(list.reduce((a,b)=>a+b.before,0)/list.length);
      return {ready:true, list, overall, mode: session.isDemo ? "demo-real" : "real", cycle: usingReassessment ? 2 : 1};
    }
  }
  if(session && session.isDemo){
    const overall = Math.round(DEMO_BASELINE.reduce((a,b)=>a+b.before,0)/DEMO_BASELINE.length);
    return {ready:true, list:DEMO_BASELINE, overall, mode:"demo"};
  }
  return {ready:false, list:[], overall:0, mode:"pending"};
}

function applySessionToLearner(session){
  if(!session) return;
  LEARNER.name = session.name || DEMO_PROFILE.name;
  LEARNER.role = session.role || "";
  LEARNER.org = session.org || "";
  LEARNER.goal = session.goal || DEMO_PROFILE.goal;
  LEARNER.level = session.level || "Intermediate";
  LEARNER.email = session.email || "";
  LEARNER.isDemo = !!session.isDemo;
  LEARNER.assessmentCompleted = !!session.assessmentCompleted;
  LEARNER.assessmentScore = typeof session.assessmentScore === "number" ? session.assessmentScore : null;
  LEARNER.topicScores = session.topicScores || null;
  LEARNER.topicStats = session.topicStats || null;
  LEARNER.competencyScores = session.competencyScores || null;
  LEARNER.learningHistory = session.learningHistory || {};
  LEARNER.reassessCompleted = !!session.reassessCompleted;
  LEARNER.reassessScore = typeof session.reassessScore === "number" ? session.reassessScore : null;
  LEARNER.reassessScores = session.reassessScores || null;
  LEARNER.reassessTopicStats = session.reassessTopicStats || null;
  LEARNER.resourceEffectiveness = session.resourceEffectiveness || [];

  // Real uploaded-material state (NORMAL USER MODE). Never defaults to the
  // Data Analysis demo file — stays null until the learner actually uploads
  // something. A pure demo session (isDemo, no real upload yet) keeps the
  // illustrative demo file so "Launch Demo Journey" still reads naturally.
  LEARNER.uploadedMaterial = session.uploadedMaterial || null;
  LEARNER.extractedTopics = Array.isArray(session.extractedTopics) ? session.extractedTopics : null;
  LEARNER.generatedQuestions = Array.isArray(session.generatedQuestions) ? session.generatedQuestions : null;
  LEARNER.reassessQuestions = Array.isArray(session.reassessQuestions) ? session.reassessQuestions : null;
  // Generation diagnostics, persisted as plain fields (see UploadPage.analyze)
  // rather than read off array properties, which JSON storage would drop.
  LEARNER.assessmentDiagnostics = session.assessmentDiagnostics || null;
  LEARNER.reassessDiagnostics = session.reassessDiagnostics || null;
  if(session.uploadedMaterial){
    LEARNER.file = {name:session.uploadedMaterial.name, type:session.uploadedMaterial.type, size:session.uploadedMaterial.size};
  } else if(session.isDemo){
    LEARNER.file = {name:"Data_Analytics_Fundamentals.pdf", type:"PDF", size:"4.2 MB"};
  } else {
    LEARNER.file = null;
  }

  // Real, session-based learning streak — 0 for a brand-new learner, and
  // never recalculated just because the dashboard loaded (see computeStreak
  // / recordLearningActivity, which are the only writers of activityDates).
  LEARNER.activityDates = Array.isArray(session.activityDates) ? session.activityDates : [];
  LEARNER.streak = typeof session.streak === "number" ? session.streak : computeStreak(LEARNER.activityDates);

  // Rewards / XP — mirrors session.rewards the same way every other real,
  // session-derived field on LEARNER does (see rewardsOf/applyXPPatches).
  // A brand-new learner simply has no history yet — never fabricated.
  LEARNER.rewards = rewardsOf(session);

  LEARNER.competency = computeCompetencyView(session);
  // Resource catalog: the fixed iGOT-aligned Data Analysis catalog for demo
  // sessions, or a catalog generated from THIS learner's real extracted
  // topics — never a mix of the two (see RESOURCE_DEFS vs
  // buildResourceDefsForSession).
  LEARNER.resourceDefs = buildResourceDefsForSession(session);
}
// Persists assessment results onto the learner's stored account (not just the
// live session) so results survive logout/login, not only page refresh.
function updateAccountFields(email, fields){
  if(!email) return;
  const accounts = loadAccounts();
  const idx = accounts.findIndex(a=>a.email===email);
  if(idx>=0){
    accounts[idx] = {...accounts[idx], ...fields};
    saveAccounts(accounts);
  }
}

/* ============================= LEARNING STREAK (REAL, SESSION-BASED) =============================
   activityDates is a plain array of "YYYY-MM-DD" strings (local calendar
   days on which the learner did qualifying learning activity: completed a
   learning resource/module, or completed a reassessment). It is written
   ONLY by recordLearningActivity()/completeResourceNow()-style call sites —
   never by a page simply rendering — so a refresh cannot create activity,
   and the streak survives logout/login because it's persisted both on the
   session and on the stored account (see updateAccountFields).
*/
// Returns d's calendar date, in the LEARNER'S LOCAL timezone, as a
// "YYYY-MM-DD" string. Used (instead of toISOString(), which is always UTC)
// anywhere a date boundary must match what the learner actually sees on
// their own clock — daily XP, streak activity days, and the Weekly
// Challenge/Leaderboard week key all key off this same local-date label.
function localDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
function todayStr(){ return localDateStr(new Date()); }
function computeStreak(dates){
  if(!Array.isArray(dates) || !dates.length) return 0;
  const uniq = [...new Set(dates)].sort();
  const dayMs = 86400000;
  const toMs = s => new Date(s+"T00:00:00Z").getTime();
  const lastMs = toMs(uniq[uniq.length-1]);
  const todayMs = toMs(todayStr());
  // If the most recent activity is more than a day old, the streak is broken.
  if(Math.round((todayMs-lastMs)/dayMs) > 1) return 0;
  let streak = 1;
  for(let i=uniq.length-1;i>0;i--){
    const diff = Math.round((toMs(uniq[i])-toMs(uniq[i-1]))/dayMs);
    if(diff===1) streak++;
    else if(diff===0) continue;
    else break;
  }
  return streak;
}
// Returns the {activityDates, streak} patch to merge into a session object
// whenever the learner performs qualifying learning activity. Idempotent
// for repeated calls on the same calendar day.
function activityPatch(session){
  const existingDates = Array.isArray(session && session.activityDates) ? session.activityDates.slice() : [];
  const today = todayStr();
  if(existingDates.includes(today)){
    return {activityDates:existingDates, streak:computeStreak(existingDates)};
  }
  // Before recording today, give the Streak Shield a chance to bridge
  // exactly one missed calendar day so a single missed day doesn't reset
  // the streak — see maybeUseStreakShield. This is still the SAME
  // activityDates/computeStreak streak system, just made shield-aware; no
  // second streak tracker is created.
  const shieldResult = maybeUseStreakShield(session, existingDates, today);
  const dates = [...shieldResult.dates, today];
  const patch = {activityDates:dates, streak:computeStreak(dates)};
  if(shieldResult.used) patch.rewards = shieldResult.rewards;
  return patch;
}
// Checks whether exactly one calendar day was missed between the learner's
// last recorded activity and today, and — if the learner's one Streak
// Shield is still available — spends it to backfill that missed day so the
// streak continues instead of resetting. Never creates a second streak
// system: it only ever adds one more date into the SAME activityDates
// array that computeStreak already reads. Usage is recorded as a zero-XP
// entry in the same rewards.history used by applyXPPatches, keyed per
// missed date so the same gap can never consume the shield twice.
function maybeUseStreakShield(session, dates, today){
  const rewards = rewardsOf(session);
  if(!rewards.shieldAvailable || !dates.length) return {dates, used:false};
  const uniq = [...new Set(dates)].sort();
  const dayMs = 86400000;
  const toMs = s => new Date(s+"T00:00:00Z").getTime();
  const lastMs = toMs(uniq[uniq.length-1]);
  const gapDays = Math.round((toMs(today)-lastMs)/dayMs);
  // A gap of exactly 2 calendar days means exactly one day in between was
  // missed — that's the one day the shield protects. A longer gap means
  // the streak is genuinely broken and the shield can't bridge it.
  if(gapDays!==2) return {dates, used:false};
  const missedDate = new Date(lastMs+dayMs).toISOString().slice(0,10);
  const key = "shield_used_"+missedDate;
  if(rewards.awarded[key]) return {dates, used:false}; // never consume twice for the same gap
  const entry = {key, type:"shield_used", xp:0, at:new Date().toISOString(), meta:{missedDate}};
  const newRewards = {
    history: [...rewards.history, entry],
    awarded: {...rewards.awarded, [key]:true},
    shieldAvailable: false,
  };
  return {dates:[...dates, missedDate], used:true, rewards:newRewards};
}

/* ============================= REWARDS / XP SYSTEM (REAL, SESSION-BASED) =============================
   Session-persisted gamification layer that sits on top of the EXISTING
   assessment / reassessment / resource-completion / streak logic above —
   it never recomputes or changes any of that, it only reads the outcomes
   those systems already produce (assessmentCompleted, a resource moving to
   "completed", a fresh streak from activityPatch, a real before/after
   competency comparison) and turns each qualifying event into an XP award.

   Storage shape (session.rewards, persisted the same way as
   learningHistory — see writeLearningHistory/updateAccountFields):
     { history: [{key, type, xp, at, meta}], awarded: {[key]: true} }
   `awarded` is a set of dedupe keys — every call site below builds a
   deterministic key for the specific action/resource/milestone it is
   awarding, and xpPatch()/applyXPPatches() refuse to award the same key
   twice, which is what prevents duplicate XP for the same action, the same
   resource, or the same streak milestone.
*/
const XP_VALUES = {
  assessment_complete: 50,       // Baseline assessment submitted
  module_complete: 100,          // A learning resource/module marked completed
  reassessment_complete: 75,     // A re-assessment submitted
  daily_activity: 20,            // Qualifying learning activity on a NEW calendar day
  competency_improvement: 200,   // A tracked competency's score improved after reassessment
  streak_3: 50,                  // 3-day learning streak reached
  streak_7: 150,                 // 7-day learning streak reached
  streak_14: 300,                // 14-day learning streak reached
};
// Per-level XP requirement for the simple, linear Level/Progress display on
// the Rewards page (Level 1 = 0-499 XP, Level 2 = 500-999 XP, ...).
const XP_PER_LEVEL = 500;

// shieldAvailable defaults to true: every learner starts with exactly one
// Streak Shield (see maybeUseStreakShield below) until it is consumed once,
// at which point it is persisted as false permanently — no second shield
// is ever granted.
function rewardsOf(session){
  const r = (session && session.rewards) || {};
  return {
    history: Array.isArray(r.history) ? r.history : [],
    awarded: (r.awarded && typeof r.awarded==="object") ? r.awarded : {},
    shieldAvailable: typeof r.shieldAvailable === "boolean" ? r.shieldAvailable : true,
  };
}
function totalXPOf(history){
  return (history||[]).reduce((sum,h)=> sum + (typeof h.xp==="number" ? h.xp : 0), 0);
}
function levelInfoOf(xp){
  const level = Math.floor(xp / XP_PER_LEVEL) + 1;
  const intoLevel = xp % XP_PER_LEVEL;
  return {level, intoLevel, perLevel: XP_PER_LEVEL, pct: Math.round((intoLevel/XP_PER_LEVEL)*100), xpToNext: XP_PER_LEVEL-intoLevel};
}
// Applies a list of CANDIDATE {type, key, meta} awards against the CURRENT
// session.rewards state, skipping any whose key has already been awarded
// (duplicate protection). Returns null if nothing new was awarded, so
// call sites can cheaply no-op instead of writing an unchanged session.
// Does NOT call applySession itself — callers merge the returned `rewards`
// patch into the SAME nextSession object they're already assembling, so
// every XP award rides along on the existing single applySession/
// updateAccountFields write for that action (same pattern as streakPatch).
function applyXPPatches(session, candidates){
  let {history, awarded, shieldAvailable} = rewardsOf(session);
  const awardedEntries = [];
  (candidates||[]).forEach(c=>{
    if(!c || !c.key || !c.type) return;
    if(awarded[c.key]) return; // duplicate protection: same action/resource/milestone
    const xp = XP_VALUES[c.type];
    if(!xp) return;
    const entry = {key:c.key, type:c.type, xp, at:new Date().toISOString(), meta:c.meta||null};
    history = [...history, entry];
    awarded = {...awarded, [c.key]:true};
    awardedEntries.push(entry);
  });
  if(!awardedEntries.length) return null;
  // shieldAvailable rides along unchanged — applyXPPatches never touches the
  // shield itself (see maybeUseStreakShield), it just must not drop the
  // field when merging XP-only updates into session.rewards.
  return {rewards:{history, awarded, shieldAvailable}, awardedEntries};
}
// Candidate streak-milestone awards for a just-updated streak value — only
// returns milestones the learner has actually reached AND not already been
// awarded for (each streak length is a one-time milestone, so rebuilding
// the same streak length later never re-awards it).
function streakMilestoneCandidates(streak){
  const out = [];
  if(streak>=3) out.push({type:"streak_3", key:"streak_3"});
  if(streak>=7) out.push({type:"streak_7", key:"streak_7"});
  if(streak>=14) out.push({type:"streak_14", key:"streak_14"});
  return out;
}
// Candidate "daily learning activity" award — one-time per real calendar
// day, keyed on that day's date string so visiting/completing several
// things on the same day only ever grants the +20 once.
function dailyActivityCandidate(){
  return {type:"daily_activity", key:"daily_"+todayStr()};
}
// Compares the learner's baseline competencyScores against a fresh set of
// reassessment scores and returns one candidate award per competency that
// genuinely improved (after > before). Keyed per-competency-per-cycle so a
// later re-assessment cycle can earn it again for real further improvement,
// while an identical resubmission of the same cycle never double-awards.
function competencyImprovementCandidates(baselineScores, newScores, cycleNum){
  const out = [];
  if(!baselineScores || !newScores) return out;
  Object.keys(newScores).forEach(name=>{
    const before = baselineScores[name], after = newScores[name];
    if(typeof before==="number" && typeof after==="number" && after>before){
      out.push({type:"competency_improvement", key:"competency_"+name+"_cycle"+cycleNum, meta:{name, before, after}});
    }
  });
  return out;
}
// Builds a short, translated toast summarizing everything just awarded in
// one action (e.g. completing a module can simultaneously trigger module
// XP + daily-activity XP + a streak milestone).
function xpToastMessage(t, awardedEntries){
  const total = awardedEntries.reduce((s,e)=>s+e.xp,0);
  if(awardedEntries.length===1){
    return t("rewards.xpToastSingle",{xp:total, label:t("rewards.type."+awardedEntries[0].type)});
  }
  return t("rewards.xpToastMultiple",{xp:total, count:awardedEntries.length});
}

/* ============================= SCRATCH CARDS (REAL, SESSION-BASED) =============================
   A small set of scratch-off reward cards on the Rewards page. This is NOT a
   second XP/streak/shield system — every card is just another entry point
   into the SAME rewards.history/rewards.awarded/rewards.shieldAvailable
   state that applyXPPatches/maybeUseStreakShield already read and write
   (see rewardsOf above), so total XP, level, and the Streak Shield badge
   all update from a scratch-card claim exactly the way they do for any
   other reward.

   Each card unlocks from a real, already-tracked milestone/event — a
   completed baseline assessment, a streak milestone already recorded in
   rewards.awarded, or a completed learning module in the existing
   learningHistory map — never a new tracker of its own. A card's own
   dedupe key (scratch_<id>) is recorded in the SAME rewards.awarded map
   used everywhere else, which is what makes "claim once" work: it's the
   exact duplicate-protection mechanism applyXPPatches already relies on,
   just checked directly here since a scratch card's reward is fixed per
   card rather than computed from XP_VALUES.
*/
const SCRATCH_CARDS = [
  {
    id:"baseline",
    unlockedBy: session => !!(session && session.assessmentCompleted),
    reward: {kind:"xp", type:"scratch_xp_50", xp:50},
  },
  {
    id:"streak3",
    unlockedBy: session => !!(rewardsOf(session).awarded.streak_3),
    reward: {kind:"xp", type:"scratch_xp_100", xp:100},
  },
  {
    id:"module",
    unlockedBy: session => Object.values(learningHistoryMapOf(session)).some(h=>h && h.status==="completed"),
    reward: {kind:"xp", type:"scratch_xp_200", xp:200},
  },
  {
    id:"streak7",
    unlockedBy: session => !!(rewardsOf(session).awarded.streak_7),
    reward: {kind:"shield", type:"scratch_shield", xp:0},
  },
];
function scratchCardKey(cardId){ return "scratch_"+cardId; }
// Read-only snapshot of one card's current state — used by the UI to decide
// whether to show it locked, revealable, or already-claimed. Never mutates
// anything, so it's safe to call on every render.
function scratchCardStateOf(session, card){
  const rewards = rewardsOf(session);
  const key = scratchCardKey(card.id);
  return {
    unlocked: card.unlockedBy(session),
    claimed: !!rewards.awarded[key],
    entry: rewards.history.find(h=>h.key===key) || null,
  };
}
// Reveals + claims exactly one scratch card. Returns null (no-op) if the
// card is still locked OR already claimed — this is the single guard that
// makes duplicate claiming impossible, checked against the SAME
// rewards.awarded map that is persisted to session + account, so it holds
// even across a refresh or a second click fired before state settles.
// Returns a {rewards, awardedEntry} patch for the caller to merge into the
// same single session write every other reward call site uses.
function claimScratchCard(session, card){
  const rewards = rewardsOf(session);
  const key = scratchCardKey(card.id);
  if(rewards.awarded[key]) return null;       // already claimed — never twice
  if(!card.unlockedBy(session)) return null;  // still locked — nothing to reveal
  const entry = {key, type:card.reward.type, xp:card.reward.xp||0, at:new Date().toISOString(), meta:{cardId:card.id, kind:card.reward.kind}};
  const newRewards = {
    history:[...rewards.history, entry],
    awarded:{...rewards.awarded, [key]:true},
    // IMPORTANT: never write a new value into shieldAvailable here, even for
    // the "streak7" shield-kind card. shieldAvailable is the SAME single
    // lifetime flag Prompt 1's maybeUseStreakShield owns (default true once,
    // permanently false the moment it's consumed — see rewardsOf/
    // maybeUseStreakShield above). Claiming this card only records the win
    // (history + awarded key, still shown as "You won a Streak Shield!" in
    // the UI) — it must NOT touch the actual flag:
    //   - if a shield is already available (true), we must not "create
    //     another" — passing the existing value through is a no-op, exactly
    //     as required.
    //   - if the one shield was already consumed (false), we must not
    //     silently reset/revive it — passing the existing value through
    //     keeps it false.
    // This is what makes claiming the card side-effect-free on the shield
    // state in both cases, while leaving XP-kind cards (the other branch,
    // unchanged) exactly as before.
    shieldAvailable: rewards.shieldAvailable,
  };
  return {rewards:newRewards, awardedEntry:entry};
}

/* ============================= WEEKLY CHALLENGES (REAL, SESSION-BASED) =============================
   Three fixed weekly goals layered on top of the SAME rewards.history/
   rewards.awarded state as everything else above (see rewardsOf) — this is
   NOT a second XP/streak/competency system. Each challenge's progress is
   read straight off data that already exists and is already persisted
   elsewhere, never recomputed or tracked separately:
     - "modules"    reads session.learningHistory — the SAME map
                    completeResourceNow already writes and module_complete
                    XP already reads (see learningHistoryMapOf above).
     - "streak"     reads the SAME real streak (session.streak, falling back
                    to the SAME computeStreak() the real streak system uses)
                    every streak milestone and the Streak Shield already read.
     - "competency" reads the SAME rewards.history "competency_improvement"
                    entries competencyImprovementCandidates already records
                    after a real reassessment — it just counts how many of
                    THOSE entries fall in the current week; it never
                    re-compares scores itself.
   A challenge's own dedupe key is scoped to the CURRENT calendar week
   (weeklyChallengeKey), recorded in the SAME rewards.awarded map used
   everywhere else — exactly the same duplicate-protection mechanism
   claimScratchCard already relies on — so a claim can never happen twice in
   one week, while a brand-new key next week makes the SAME challenge a
   fresh, independently-claimable goal without touching how/when it was
   completed or claimed in any previous week.
*/
// Returns the Monday that starts the calendar week containing dateInput, in
// the LEARNER'S LOCAL timezone, as a "YYYY-MM-DD" string — the SAME
// local-day convention now used by todayStr above. This is purely a
// grouping key for Weekly Challenges/Leaderboard; it is never written into
// activityDates, streak, or any other existing date field.
// dateInput may be: a Date, a plain "YYYY-MM-DD" local-date label (e.g. from
// todayStr/currentWeekKey), or a full ISO timestamp (e.g. an "at"/
// "completedAt" field, always UTC per new Date().toISOString()). In every
// case this resolves to the LOCAL calendar date that instant/label
// represents before computing the week's Monday, so an entry timestamped
// near local midnight is grouped into the correct local week even when its
// UTC date differs.
function weekKeyOf(dateInput){
  let d;
  if(dateInput instanceof Date){
    d = new Date(dateInput.getFullYear(), dateInput.getMonth(), dateInput.getDate());
  } else {
    const s = String(dateInput);
    const plainLocalDate = /^\d{4}-\d{2}-\d{2}$/.test(s);
    const parsed = plainLocalDate
      ? new Date(Number(s.slice(0,4)), Number(s.slice(5,7))-1, Number(s.slice(8,10)))
      : new Date(s); // full ISO timestamp — resolved to local calendar date below
    d = new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
  }
  const dayNum = (d.getDay()+6)%7; // Mon=0 ... Sun=6 (ISO week starts Monday), LOCAL day-of-week
  const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate()-dayNum);
  return localDateStr(monday);
}

/* ============================= REAL FILE PARSING (NORMAL USER MODE) =============================
   Extracts actual text from a learner-uploaded file, entirely client-side.
   Throws on anything this single-file prototype cannot reliably parse
   (legacy binary .doc/.ppt, corrupt files, scanned/image-only PDFs with no
   text layer) — callers must surface a clear error, never silently fall
   back to demo content.

if(typeof pdfjsLib !== "undefined"){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// Decodes the handful of XML/HTML entities that show up in raw
// PPTX/DOCX XML text runs (there's no DOM available for the zip-internal
// XML, so this is done by hand rather than flattening the entities away).
function decodeXmlEntities(s){
  return (s||"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(parseInt(n,10)));
}
// Turns one slide's raw XML into "## <title>" / "- <bullet>" lines, using
// the placeholder type (title/ctrTitle vs body/other) declared in the
// slide's own markup — not a text-content guess — to tell a slide's title
// apart from its bullet points. This is what lets downstream analysis
// treat "slide title", "bullet point" and "short text block" as separate
// semantic units instead of flattening a whole slide into one sentence.
function pptxSlideToStructuredText(xml){
  const shapeBlocks = xml.match(/<p:sp>[\s\S]*?<\/p:sp>/g) || [];
  const lines = [];
  let sawTitle = false;
  shapeBlocks.forEach(sp=>{
    const isTitle = /<p:ph[^>]*type="(title|ctrTitle)"/.test(sp);
    const paraBlocks = sp.match(/<a:p>[\s\S]*?<\/a:p>/g) || [];
    paraBlocks.forEach(p=>{
      const runs = p.match(/<a:t>([\s\S]*?)<\/a:t>/g) || [];
      const line = decodeXmlEntities(runs.map(r=>r.replace(/<a:t>/,"").replace(/<\/a:t>/,"")).join("")).replace(/\s+/g," ").trim();
      if(!line) return;
      if(isTitle && !sawTitle){ lines.push("## "+line); sawTitle = true; }
      else lines.push("- "+line);
    });
  });
  // No explicit title placeholder on this slide — treat its first line as
  // the slide title so the slide still gets a heading rather than being
  // reduced to an undifferentiated bullet list.
  if(!sawTitle && lines.length){
    lines[0] = lines[0].replace(/^- /, "## ");
  }
  return lines.join("\n");
}
// Converts mammoth's HTML output into the same lightweight "## "/"- "
// markup used for PPTX/PDF, using the real DOM so headings, list items and
// paragraphs are told apart structurally instead of by guesswork — this is
// what mammoth's plain extractRawText() throws away.
function docxHtmlToStructuredText(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const lines = [];
  const pushText = (el, prefix)=>{
    const t = (el.textContent||"").replace(/\s+/g," ").trim();
    if(t) lines.push(prefix+t);
  };
  doc.body.childNodes.forEach(node=>{
    if(node.nodeType!==1) return;
    const tag = node.tagName.toLowerCase();
    if(/^h[1-6]$/.test(tag)) pushText(node, "## ");
    else if(tag==="ul" || tag==="ol"){
      node.querySelectorAll("li").forEach(li=>pushText(li, "- "));
    } else if(tag==="li") pushText(node, "- ");
    else pushText(node, "");
  });
  return lines.join("\n");
}
async function extractTextFromFile(file, extOverride){
  const ext = (extOverride || file.name.split(".").pop() || "").toLowerCase();
  if(ext==="txt"){
    return await file.text();
  }
  if(ext==="pdf"){
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    let text = "";
    for(let p=1;p<=pdf.numPages;p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      const items = content.items || [];
      // Group text items into lines by their vertical position (instead of
      // flattening the whole page into one run-on string), so real line
      // breaks — and therefore headings vs body text — survive extraction.
      const lines = [];
      items.forEach(it=>{
        const y = Math.round(it.transform[5]);
        const h = Math.abs(it.transform[3]) || Math.abs(it.transform[0]) || 10;
        let line = lines.find(l=>Math.abs(l.y-y)<3);
        if(!line){ line = {y, h, parts:[]}; lines.push(line); }
        line.h = Math.max(line.h, h);
        line.parts.push({x:it.transform[4], str:it.str});
      });
      lines.sort((a,b)=> b.y-a.y);
      const heights = lines.map(l=>l.h).filter(h=>h>0).sort((a,b)=>a-b);
      const modalH = heights.length ? heights[Math.floor(heights.length/2)] : 10;
      lines.forEach(l=>{
        const lineText = l.parts.sort((a,b)=>a.x-b.x).map(pt=>pt.str).join(" ").replace(/\s+/g," ").trim();
        if(!lineText) return;
        // A line rendered notably taller than the page's typical line
        // (its most common text height) reads like a heading/title.
        const isHeading = l.h > modalH*1.18 && lineText.length<90 && lineText.length>=3;
        text += (isHeading ? "## "+lineText : lineText) + "\n";
      });
      text += "\n";
    }
    return text;
  }
  if(ext==="docx"){
    const buf = await file.arrayBuffer();
    try{
      const result = await mammoth.convertToHtml({arrayBuffer:buf});
      const structured = docxHtmlToStructuredText(result.value || "");
      if(structured.trim()) return structured;
    }catch(e){ /* fall through to plain-text extraction below */ }
    const raw = await mammoth.extractRawText({arrayBuffer:buf});
    return raw.value || "";
  }
  if(ext==="pptx"){
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const slideFiles = Object.keys(zip.files)
      .filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n))
      .sort((a,b)=> (parseInt(a.match(/\d+/)[0],10) - parseInt(b.match(/\d+/)[0],10)));
    let text = "";
    for(const f of slideFiles){
      const xml = await zip.files[f].async("string");
      text += pptxSlideToStructuredText(xml) + "\n\n";
    }
    return text;
  }
  // Legacy binary .doc / .ppt (pre-2007 Office formats) cannot be parsed
  // reliably client-side in this prototype.
  throw new Error("UNSUPPORTED_FORMAT");
}

function stripLeadingMarker(line){
  return line.replace(/^##\s+/,"").replace(/^[-*•‣▪]\s+/,"").replace(/^\d+[.)]\s+/,"").trim();
}
function classifyLine(line){
  const trimmed = (line||"").trim();
  if(!trimmed) return {type:"blank"};
  if(/^##\s+/.test(trimmed)) return {type:"heading", text: stripLeadingMarker(trimmed)};
  if(/^[-*•‣▪]\s+/.test(trimmed) || /^\d+[.)]\s+/.test(trimmed)) return {type:"bullet", text: stripLeadingMarker(trimmed)};
  return {type:"body", text: trimmed};
}
function looksLikeHeadingLine(line){
  if(line.length<3 || line.length>70) return false;
  if(/[.?!,;:]$/.test(line)) return false;
  if(line.split(/\s+/).length>8) return false;
  return true;
}
// Builds {title, sections:[{heading, bullets, content}]} from marked-up
// (or plain) extracted text. Works for all four supported file types: PPTX/
// DOCX/most PDFs arrive with explicit "## "/"- " markers from
// extractTextFromFile; a plain TXT (or a PDF page where the height cue
// never fired) falls back to a short-line/blank-line heading heuristic.
function buildStructuredContent(text){
  const rawLines = (text||"").split(/\n/);
  const classified = rawLines.map(classifyLine);
  const explicitHeadingCount = classified.filter(c=>c.type==="heading").length;
  if(explicitHeadingCount<2){
    for(let i=0;i<classified.length;i++){
      if(classified[i].type!=="body") continue;
      const line = classified[i].text;
      const next = classified.slice(i+1).find(c=>c.type!=="blank");
      if(looksLikeHeadingLine(line) && next && next.text && next.text.length>line.length){
        classified[i] = {type:"heading", text:line};
      }
    }
  }
  const sections = [];
  let current = {heading:"Document", bullets:[], bodyLines:[]};
  let title = null;
  let started = false;
  classified.forEach(c=>{
    if(c.type==="blank") return;
    if(c.type==="heading"){
      if(started) sections.push(current);
      if(!title) title = c.text;
      current = {heading:c.text, bullets:[], bodyLines:[]};
      started = true;
    } else if(c.type==="bullet"){
      current.bullets.push(c.text);
      started = true;
    } else {
      current.bodyLines.push(c.text);
      started = true;
    }
  });
  if(started) sections.push(current);
  const finalSections = sections.filter(s=> s.bullets.length || s.bodyLines.length);
  if(!title && finalSections.length) title = finalSections[0].heading;
  finalSections.forEach(s=>{ s.content = s.bodyLines.join(" "); });
  const sectionsOut = finalSections.length ? finalSections : [{heading:"Document", bullets:[], bodyLines:[], content:(text||"").replace(/\s+/g," ").trim()}];
  // Internal-only derived model per section (never rendered directly to the
  // learner) — lets question templates reason about a section's
  // technologies/example/relationship language instead of re-scanning raw
  // text every time a question is built. Deterministic heuristics only; a
  // field is left empty rather than guessed when it can't be reliably
  // derived from the actual uploaded content. Does not change the UI.
  sectionsOut.forEach(s=>{
    const lineSet = [s.heading, ...s.bullets, s.content||""].filter(Boolean);
    s.technologies = detectTechTerms(lineSet.join(" "));
    s.concepts = Object.keys(extractPhraseCandidates(lineSet));
    s.examples = s.bullets.filter(b=> /\be\.g\.|for example|such as\b/i.test(b));
    s.relationships = s.bullets.filter(b=> /\b(then|after|based on|leads to|results in|triggers|identifies|recommends|enables|addresses)\b/i.test(b));
    // "Process-like" = the heading/content itself signals an ordered
    // process/workflow — never inferred from an arbitrary bullet list.
    s.isProcessLike = /\b(process|workflow|steps?|pipeline|method|architecture|sequence)\b/i.test(s.heading);
  });
  return {title: title || "Uploaded Material", sections: sectionsOut};
}

// Formats one word for display in a topic/phrase: an ALL-CAPS acronym
// (AI, NLP, SQL — 4 letters or fewer) is left as-is; a longer ALL-CAPS
// word (from a slide/heading written in caps) is Title-cased; anything
// already mixed-case is left untouched.
function formatWord(w){
  if(w===w.toUpperCase() && w.length>4) return w.charAt(0)+w.slice(1).toLowerCase();
  return w;
}
const isFillerWord = (w)=> GENERIC_TOPIC_WORDS.has(w.toLowerCase()) || STOPWORDS.has(w.toLowerCase());
// Multi-word Title-Case/ALL-CAPS phrase candidates (2-3 words) from a set
// of heading/bullet strings — these read like the real named concepts of
// a document far more reliably than single-word frequency ever could.
function extractPhraseCandidates(lines){
  const freq = {};
  lines.forEach(line=>{
    const words = line.split(/\s+/).map(cleanToken).filter(Boolean);
    for(let n=3;n>=2;n--){
      for(let i=0;i+n<=words.length;i++){
        const slice = words.slice(i,i+n);
        if(slice.some(w=>w.length<3)) continue;
        if(!slice.every(w=>/^[A-Z][a-zA-Z]*$/.test(w))) continue;
        if(isFillerWord(slice[0]) || isFillerWord(slice[slice.length-1])) continue;
        const phrase = slice.map(formatWord).join(" ");
        freq[phrase] = (freq[phrase]||0)+1;
      }
    }
  });
  return freq;
}
// Cleans a raw section heading into a standalone topic candidate by
// stripping trailing/leading generic filler/stopwords (e.g. "Technologies
// Used" -> "Technologies"; "Impact and Benefits" -> nothing, correctly
// rejected as fully generic). Returns null if nothing meaningful remains,
// only a bare leftover connector word survives, or the heading is a
// generic document label (Introduction/Conclusion/Thank You/etc).
function headingToTopicCandidate(heading){
  const lower = heading.toLowerCase().trim();
  if(GENERIC_HEADING_LABELS.has(lower)) return null;
  let words = heading.split(/\s+/).map(cleanToken).filter(Boolean);
  while(words.length && isFillerWord(words[words.length-1])) words.pop();
  while(words.length && isFillerWord(words[0])) words.shift();
  if(!words.length) return null;
  // A single short word is usually a leftover connector, not a real topic
  // — except a short ALL-CAPS acronym (CPU, ALU, RAM...), which genuinely
  // is a standalone testable term even at 2-3 letters.
  const isAcronymWord = words.length===1 && words[0].length>=2 && words[0].length<=4 && words[0]===words[0].toUpperCase();
  if(words.length===1 && words[0].length<=3 && !isAcronymWord) return null;
  words = words.slice(0,4);
  return words.map(formatWord).join(" ");
}
// Ranks and selects the most meaningful topics from the structured
// document: cleaned section headings, multi-word concept phrases from
// headings/bullets, known technology terms, then (only to fill remaining
// slots) frequent meaningful single words — never generic filler words
// like "Solution"/"Approach"/"Impact"/"Data" unless real context supports
// them as part of a longer, more specific phrase.
function extractTopicsFromText(text, maxTopics){
  maxTopics = maxTopics || 8;
  const cleaned = (text||"").replace(/\s+/g," ").trim();
  if(!cleaned) return [];
  const structured = buildStructuredContent(text);
  const weights = {}; // lowercase key -> {label, weight}
  const bump = (label, w)=>{
    const key = label.toLowerCase();
    if(!weights[key]) weights[key] = {label, weight:0};
    weights[key].weight += w;
  };
  structured.sections.forEach(sec=>{
    const cand = headingToTopicCandidate(sec.heading);
    if(cand) bump(cand, 6);
    const lineSet = [sec.heading, ...sec.bullets];
    const phraseFreq = extractPhraseCandidates(lineSet);
    Object.entries(phraseFreq).forEach(([phrase,count])=> bump(phrase, 4*count));
  });
  detectTechTerms(cleaned).forEach(term=> bump(term, 5));
  // Fill remaining slots with frequent meaningful single words, but only
  // if we don't already have enough stronger (heading/phrase/tech) topics.
  const strongCount = Object.keys(weights).length;
  if(strongCount < maxTopics){
    const words = cleaned.split(" ");
    const freq = {};
    const acronymSeen = new Set();
    words.forEach(raw=>{
      const w = cleanToken(raw);
      // Short ALL-CAPS acronyms (CPU, ALU, RAM...) are real, testable
      // terms even at 2-3 letters — only plain short lowercase words (of,
      // for, etc.) need the length-4 floor, since those are almost always
      // filler rather than a genuine standalone topic. KNOWN_TECH_TERMS
      // already catches the common ones directly; this is just a defensive
      // net for acronyms that aren't in that list.
      const isAcronym = w.length>=2 && w.length<=4 && w===w.toUpperCase() && /[A-Z]/.test(w);
      if((w.length<4 && !isAcronym) || /^\d+$/.test(w)) return;
      const lower = w.toLowerCase();
      if(STOPWORDS.has(lower) || GENERIC_TOPIC_WORDS.has(lower) || weights[lower]) return;
      if(isAcronym) acronymSeen.add(lower);
      freq[lower] = (freq[lower]||0)+1;
    });
    Object.entries(freq).filter(([w,c])=> c>=3 || (acronymSeen.has(w) && c>=2)).forEach(([w,c])=>{
      bump(w.toUpperCase().length<=4 && acronymSeen.has(w) ? w.toUpperCase() : w.charAt(0).toUpperCase()+w.slice(1), Math.min(c,3));
    });
  }
  // Drop shorter candidates that are just a substring of a longer, already
  // -selected candidate (e.g. drop "Learning" once "Machine Learning" is
  // in the list) so topics stay specific rather than redundant.
  const ranked = Object.values(weights).sort((a,b)=>b.weight-a.weight);
  const out = [];
  for(const cand of ranked){
    const lower = cand.label.toLowerCase();
    if(out.some(o=> o.toLowerCase()===lower)) continue;
    if(out.some(o=> o.toLowerCase().includes(lower) || lower.includes(o.toLowerCase()))) continue;
    out.push(cand.label);
    if(out.length>=maxTopics) break;
  }
  return out;
}

const TOPIC_WORD_HI_TO_EN = Object.fromEntries(Object.entries(TOPIC_WORD_HI).map(([en,hi])=>[hi,en.charAt(0).toUpperCase()+en.slice(1)]));
const isDevanagariText = (s)=> /[\u0900-\u097F]/.test(s||"");
const stripWordPunct = (w)=> (w||"").replace(/^[^A-Za-z\u0900-\u097F0-9]+|[^A-Za-z\u0900-\u097F0-9]+$/g,"");
function translateTopicWordToHindi(word){
  const stripped = stripWordPunct(word).toLowerCase();
  if(!stripped) return word;
  const hi = TOPIC_WORD_HI[stripped];
  return hi || word;
}
// Approximate Devanagari -> Roman transliteration (ITRANS/Hunterian style)
// used only for a Hindi-language SOURCE topic being displayed in Hinglish —
// never applied to already-Latin text.
const DEVANAGARI_CONSONANTS = {"क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"ng","च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"ny","ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"f","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h","क़":"q","ख़":"kh","ग़":"g","ज़":"z","ड़":"r","ढ़":"rh","फ़":"f"};
const DEVANAGARI_VOWELS = {"अ":"a","आ":"aa","इ":"i","ई":"ee","उ":"u","ऊ":"oo","ऋ":"ri","ए":"e","ऐ":"ai","ओ":"o","औ":"au"};
const DEVANAGARI_MATRAS = {"ा":"aa","ि":"i","ी":"ee","ु":"u","ू":"oo","ृ":"ri","े":"e","ै":"ai","ो":"o","ौ":"au","ं":"n","ः":"h","ँ":"n"};
function transliterateDevanagariWord(word){
  let out = "";
  for(let i=0;i<word.length;i++){
    const ch = word[i], next = word[i+1];
    if(ch==="्") continue; // halant already handled by suppressing the inherent vowel below
    if(DEVANAGARI_CONSONANTS[ch]){
      out += DEVANAGARI_CONSONANTS[ch];
      if(next!=="्" && !(next && DEVANAGARI_MATRAS[next])) out += "a"; // inherent "a"
      continue;
    }
    if(DEVANAGARI_MATRAS[ch]){ out += DEVANAGARI_MATRAS[ch]; continue; }
    if(DEVANAGARI_VOWELS[ch]){ out += DEVANAGARI_VOWELS[ch]; continue; }
    out += ch; // punctuation/digits/already-Latin characters pass through
  }
  return out ? out.charAt(0).toUpperCase()+out.slice(1) : out;
}
// Translates one extracted topic LABEL for display in `language`
// ("en" | "hi" | "hinglish"). Never mutates or re-derives the topic used
// for grounding/matching elsewhere — callers pass the original string in
// and only use the return value for what's rendered on screen.
function translateTopicLabel(label, language){
  if(!label || !language || language==="en"){
    if(!label) return label;
    if(!isDevanagariText(label)) return label;
    // Hindi-sourced topic shown in English: best-effort reverse lookup per
    // word; anything unrecognized is left in its original Hindi form
    // rather than guessed.
    return label.split(" ").map(w=> TOPIC_WORD_HI_TO_EN[stripWordPunct(w)] || w).join(" ");
  }
  if(language==="hi"){
    if(isDevanagariText(label)) return label; // already Hindi
    return label.split(" ").map(translateTopicWordToHindi).join(" ");
  }
  if(language==="hinglish"){
    if(isDevanagariText(label)) return label.split(" ").map(w=> isDevanagariText(w) ? transliterateDevanagariWord(w) : w).join(" ");
    // Latin-script technical noun phrases are written unchanged in
    // Hinglish throughout this app (see TRANSLATIONS.hinglish, e.g.
    // common.topic:"Topic", common.competency:"Competency") — Hinglish
    // Romanizes Hindi grammar/connectors, it doesn't translate English
    // nouns, so an already-Latin topic label needs no change here.
    return label;
  }
  return label;
}
