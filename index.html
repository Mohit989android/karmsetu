// The interactive "simulated learning experience" opened when a learner
// starts or continues a real (non-fixture) resource. Progress advances as
// the learner actually moves through the content sections; "Mark as
// Completed" is a separate, explicit action.
function LearningSessionView({resource, entry, session, applySession, notify, onExit}){
  const {t, language} = useLanguage();
  // Demo Mode keeps its existing fixed-fixture content (RESOURCE_CONTENT /
  // genericResourceContent). Normal users get the real, subtopic-specific
  // content built from their actual competency/gap/evidence data — never the
  // fixture and never the same generic fallback for every resource.
  const isDemo = !!(session && session.isDemo);
  const content = isDemo
    ? (RESOURCE_CONTENT[resource.title] || genericResourceContent(resource, language))
    : buildSubtopicLearningContent(resource, language);
  // Session-context values for the "why am I learning this" panel below —
  // read-only use of the existing gapPriority engine, never a second scoring
  // system. Prefers the real per-subtopic path values already attached to
  // the resource (see buildResourceDefsForSession) and falls back to a fresh
  // gapPriority lookup only if those aren't present.
  const byName = {};
  (LEARNER.competency && LEARNER.competency.list || []).forEach(l=>{ byName[l.name]=l.before; });
  const g = !isDemo ? gapPriority(resource.competency, byName[resource.competency]) : null;
  const currentScore = !isDemo ? (typeof resource.pathCompetencyCurrent==="number" ? resource.pathCompetencyCurrent : g.before) : null;
  const targetScore = !isDemo ? (typeof resource.pathCompetencyTarget==="number" ? resource.pathCompetencyTarget : g.target) : null;
  const gapScore = !isDemo ? (typeof resource.pathCompetencyGap==="number" ? resource.pathCompetencyGap : g.gapScore) : null;
  const subtopicLabel = !isDemo && resource.subtopic && resource.subtopic!==resource.competency ? resource.subtopic : null;
  const total = content.sections.length;
  const startProgress = (entry && entry.progress) || 0;
  const [idx, setIdx] = useState(()=> Math.max(0, Math.min(total-1, Math.floor((startProgress/95)*total))));
  const isCompleted = entry && entry.status==="completed";
  const section = content.sections[idx];
  const progressNow = isCompleted ? 100 : Math.round(((idx+1)/total)*95);

  const goNext = ()=>{
    if(isCompleted) return;
    const nextIdx = Math.min(total-1, idx+1);
    setIdx(nextIdx);
    setResourceProgress(session, applySession, resource, Math.round(((nextIdx+1)/total)*95));
  };
  const goPrev = ()=> setIdx(i=>Math.max(0, i-1));
  // Synchronous in-memory guard against a rapid double-click/repeated-click
  // firing completeResourceNow twice before the isCompleted-driven re-render
  // (which disables this button) lands. This is purely a click-level lock —
  // rewards.awarded in completeResourceNow/applyXPPatches remains the real,
  // persisted dedupe guard; this ref just stops a second synchronous
  // invocation from reaching it while state hasn't caught up yet.
  const completeLockRef = useRef(false);
  const markCompleted = ()=>{
    if(isCompleted || completeLockRef.current) return;
    completeLockRef.current = true;
    completeResourceNow(session, applySession, notify, resource, t);
  };

  return (
    <div className="card card-pad" style={{marginBottom:24}}>
      <div className="flex-between" style={{flexWrap:"wrap",gap:10}}>
        <div>
          <button className="btn btn-ghost btn-sm" onClick={onExit}><IconChevronLeft size={14}/> {t("learning.backToMyLearning")}</button>
          <h3 style={{fontSize:19,marginTop:10}}>{resource.title}</h3>
          <div className="rec-meta" style={{marginTop:6}}>
            <span><IconGap size={13}/>{resource.competency}</span>
            <span><IconTarget size={13}/>{difficultyLabel(t, resource.difficulty)}</span>
            <span><IconClock size={13}/>{resource.duration}</span>
          </div>
        </div>
        <span className={"badge "+(isCompleted?"badge-status-green":"badge-neutral")}>{isCompleted?t("common.completed"):t("common.inProgress")}</span>
      </div>

      {!isDemo && (
        <div className="card-pad" style={{background:"var(--paper-dim)",borderRadius:12,marginTop:16}}>
          <div className="flex-row gap-8" style={{alignItems:"center",flexWrap:"wrap"}}>
            {subtopicLabel && <span className="fs-14 fw-600">{t("learning.subtopicLabel",{subtopic:subtopicLabel})}</span>}
            {content.fromMaterial && (content.fromMaterial.found
              ? <span className="badge badge-neutral" style={{fontSize:10.5}}>{t("learning.basedOnMaterial")}</span>
              : <span className="badge badge-neutral" style={{fontSize:10.5}}>{t("learning.aiInferredNoEvidence")}</span>)}
          </div>
          <div className="rec-meta" style={{marginTop:8}}>
            <span><IconGap size={13}/>{t("common.competency")}: <b>{resource.competency}</b></span>
            <span>{t("common.current")}: <b>{currentScore}%</b></span>
            <span>{t("common.target")}: <b>{targetScore}%</b></span>
            <span>{t("common.gap")}: <b>{gapScore}%</b></span>
          </div>
          {content.whyLearning && (
            <p className="text-dim fs-13 mt-10" style={{lineHeight:1.6}}>{content.whyLearning}</p>
          )}
        </div>
      )}

      <div className="mt-16" style={{marginBottom:6}}>
        <div className="flex-between fs-12 text-dim" style={{marginBottom:6}}><span>{t("learning.progress")}</span><span className="fw-600">{progressNow}%</span></div>
        <ProgressBar value={progressNow}/>
      </div>

      {resource.youtube && (
        <div className="card-pad" style={{background:"#ECEBFB",border:"1px solid #CFCBF2",borderRadius:12,marginTop:16}}>
          <span className="badge badge-youtube" style={{marginBottom:10}}>{t("recommendations.learningResource")}</span>
          {resource.youtube.kind==="video" ? (
            <>
              <div className="fs-11 fw-700 text-faint" style={{textTransform:"uppercase",letterSpacing:".04em",marginTop:8,marginBottom:4}}>{t("learning.recommendedYoutube")}</div>
              <h4 style={{fontSize:16,marginBottom:6}}>{resource.youtube.title}</h4>
              <div className="rec-meta" style={{marginBottom:12}}>
                <span><IconBuilding size={13}/>{resource.youtube.channel}</span>
                {resource.youtube.level && <span><IconTarget size={13}/>{resource.youtube.level}</span>}
                <span><IconClock size={13}/>{resource.youtube.duration}</span>
              </div>
              <div style={{position:"relative",paddingTop:"56.25%",borderRadius:10,overflow:"hidden",background:"#000"}}>
                <iframe
                  src={resource.youtube.embedUrl}
                  title={resource.youtube.title}
                  style={{position:"absolute",top:0,left:0,width:"100%",height:"100%",border:0}}
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowFullScreen
                />
              </div>
              <div className="flex-between mt-12" style={{flexWrap:"wrap",gap:10}}>
                <a href={resource.youtube.url} target="_blank" rel="noopener noreferrer" className="fs-12 fw-600" style={{color:"var(--indigo-600)"}}>{t("common.openOnYoutube")}</a>
                <button className="btn btn-primary btn-sm" disabled={isCompleted} onClick={markCompleted}><IconCheckCircle size={14}/> {isCompleted ? t("common.completed") : t("learning.markCompleted")}</button>
              </div>
            </>
          ) : (
            <>
              <div className="fs-14 fw-600" style={{marginTop:8,marginBottom:6}}>{t("learning.searchYoutubeTopic")}</div>
              <p className="fs-12 text-faint" style={{marginBottom:12,lineHeight:1.5}}>{resource.youtube.description}</p>
              <a href={resource.youtube.url} target="_blank" rel="noopener noreferrer" className="btn btn-secondary btn-sm" style={{display:"inline-flex",width:"fit-content"}}>{t("common.searchOnYoutube")}</a>
            </>
          )}
        </div>
      )}

      <div className="card-pad" style={{background:"var(--paper-dim)",borderRadius:12,marginTop:16}}>
        <div className="fs-12 text-faint fw-600" style={{marginBottom:6}}>{t("learning.sectionOf",{i:idx+1,n:total})}</div>
        <h4 style={{fontSize:16}}>{section.title}</h4>
        <p className="text-dim fs-14 mt-10" style={{lineHeight:1.65}}>{section.body}</p>
      </div>

      <div className="mt-16">
        <div className="fs-12 text-faint fw-600" style={{marginBottom:8}}>{t("learning.keyConcepts")}</div>
        <ul style={{margin:0,paddingLeft:20,display:"flex",flexDirection:"column",gap:6}}>
          {content.objectives.map((o,i)=>(<li key={i} className="fs-13 text-dim">{o}</li>))}
        </ul>
      </div>

      <div className="flex-between mt-20" style={{flexWrap:"wrap",gap:10}}>
        <div className="flex-row gap-8">
          <button className="btn btn-secondary btn-sm" disabled={idx===0} onClick={goPrev}><IconChevronLeft size={14}/> {t("common.previous")}</button>
          <button className="btn btn-secondary btn-sm" disabled={isCompleted || idx===total-1} onClick={goNext}>{t("learning.nextSection")} <IconChevronRight size={14}/></button>
        </div>
        <button className="btn btn-primary btn-sm" disabled={isCompleted} onClick={markCompleted}><IconCheckCircle size={14}/> {isCompleted ? t("common.completed") : t("learning.markCompleted")}</button>
      </div>
    </div>
  );
}
// Status-label + CTA rules shared by the personalized-path view and the
// Recommendations page, per the four learning-session states a subtopic can
// be in (see buildLearningPaths): completed / in_progress / next / locked.
function subtopicStatusMeta(status, t){
  if(status==="completed") return {label:t("learning.statusCompleted"), cta:t("common.review"), badgeClass:"badge badge-status-green", disabled:false};
  if(status==="in_progress") return {label:t("learning.statusInProgress"), cta:t("common.continueLearning"), badgeClass:"badge badge-status-yellow", disabled:false};
  if(status==="next") return {label:t("learning.statusNext"), cta:t("common.startLearning"), badgeClass:"badge badge-status-orange", disabled:false};
  return {label:t("learning.statusLocked"), cta:t("common.locked"), badgeClass:"badge badge-neutral", disabled:true};
}
// Grouped-by-competency personalized path view (My Learning enhancement) —
// current/target/gap per competency, then the ordered, sequentially-unlocked
// subtopic list underneath, each with its own status/progress/evidence.
// Purely additive: does not replace the existing tabbed My Learning UI.
function PersonalizedPathView({session, applySession, notify, onOpen}){
  const {t, language} = useLanguage();
  const paths = useMemo(()=> buildLearningPaths(session, language), [session, language]);
  const findResource = (title)=> (LEARNER.resourceDefs||[]).find(r=>r.title===title);
  if(!paths.length){
    return <p className="text-faint fs-14">{t("learning.pathEmptyNote")}</p>;
  }
  return (
    <div style={{display:"flex",flexDirection:"column",gap:24}}>
      {paths.map((p,pi)=>(
        <div key={pi} className="card card-pad">
          <div className="flex-between" style={{flexWrap:"wrap",gap:10,marginBottom:10}}>
            <h3 style={{fontSize:16.5}}>{p.competency}</h3>
            <span className={"badge badge-status-"+priorityCls(p.priority)}>{t(SEVERITY_LABEL_KEYS[p.priority] || "common.severityLow")}</span>
          </div>
          <div className="rec-meta" style={{marginBottom:14}}>
            <span>{t("common.current")}: <b>{p.currentScore}%</b></span>
            <span>{t("common.target")}: <b>{p.targetScore}%</b></span>
            <span>{t("common.gap")}: <b>{p.gap}%</b></span>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {p.subtopics.map((s,si)=>{
              const meta = subtopicStatusMeta(s.status, t);
              return (
                <div key={si} className="flex-between" style={{flexWrap:"wrap",gap:10,padding:"12px 14px",background:"var(--paper-dim)",borderRadius:12}}>
                  <div style={{minWidth:0,flex:1}}>
                    <div className="flex-row gap-8" style={{alignItems:"center",flexWrap:"wrap"}}>
                      <span className="fs-12 fw-700 text-faint">{String(si+1).padStart(2,"0")}</span>
                      <span className="fs-14 fw-600">{translateTopicLabel(s.title, language)}</span>
                      {s.inferred ? <span className="badge badge-neutral" style={{fontSize:10.5}}>{t("learning.aiInferredFoundational")}</span> : (s.evidence ? <span className="badge badge-neutral" style={{fontSize:10.5}}>{t("learning.basedOnMaterial")}</span> : null)}
                    </div>
                    <p className="fs-12 text-faint" style={{marginTop:4,marginBottom:0}}>{s.description}</p>
                    {s.status==="in_progress" && <div className="mt-8" style={{maxWidth:220}}><ProgressBar value={s.progress||0} thin/></div>}
                  </div>
                  <div className="flex-row gap-8" style={{alignItems:"center"}}>
                    <span className={meta.badgeClass}>{meta.label}</span>
                    <button className={"btn btn-sm "+(meta.disabled?"btn-secondary":"btn-primary")} disabled={meta.disabled} onClick={()=>{
                      const resource = findResource(s.title);
                      if(!resource) return;
                      if(s.status==="next"){
                        const byName = {}; (LEARNER.competency && LEARNER.competency.list||[]).forEach(l=>{byName[l.name]=l.before;});
                        startResource(session, applySession, notify, resource, byName[p.competency], t);
                      }
                      onOpen(s.title);
                    }}>{meta.cta}</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}
function LearningPage({go, notify, session, applySession, initialOpenTitle}){
  const {t} = useLanguage();
  const [tab, setTab] = useState("learning");
  // Deep-linked in from Recommendations (Start/Continue Learning) via
  // go("learning", {openTitle}) — opens straight into that exact session
  // instead of the generic My Learning list. Falls back to the normal
  // browse-and-pick behavior when nothing was passed in.
  const [openTitle, setOpenTitle] = useState(initialOpenTitle || null);
  const myLearning = buildMyLearning();
  const isDemoFixture = LEARNER.competency && LEARNER.competency.mode==="demo";
  const tabs = [
    {id:"learning", label:t("learning.tabLearning"), data:myLearning.learning, cta:t("common.continueLearning"), primary:true},
    {id:"next", label:t("learning.tabNext"), data:myLearning.next, cta:t("common.startLearning"), primary:true},
    {id:"completed", label:t("learning.tabCompleted"), data:myLearning.completed, cta:t("common.review"), primary:false},
    {id:"saved", label:t("learning.tabSaved"), data:myLearning.saved, cta:t("common.startLearning"), primary:true},
    ...(isDemoFixture ? [] : [{id:"path", label:t("learning.tabPath"), data:null, cta:null, primary:false}]),
  ];
  const active = tabs.find(t=>t.id===tab);
  const findResource = (title)=> (LEARNER.resourceDefs||[]).find(r=>r.title===title);
  const currentScoreFor = (competency)=>{
    const c = LEARNER.competency;
    if(!c || !c.ready) return null;
    const row = c.list.find(l=>l.name===competency);
    return row ? row.before : null;
  };

  if(openTitle && !isDemoFixture){
    const resource = findResource(openTitle);
    const entry = learningHistoryMapOf(session)[openTitle];
    if(resource){
      return (
        <WorkspaceShell page="learning" go={go} title={t("learning.title")}>
          <SectionHead title={t("learning.sessionHeading")} sub={t("learning.sessionSub")} />
          <LearningSessionView resource={resource} entry={entry} session={session} applySession={applySession} notify={notify} onExit={()=>setOpenTitle(null)}/>
        </WorkspaceShell>
      );
    }
  }

  return (
    <WorkspaceShell page="learning" go={go} title={t("learning.title")}>
      <SectionHead title={t("learning.heading")} sub={t("learning.sub")} />
      <div className="pill-tab" style={{marginBottom:22,flexWrap:"wrap"}}>
        {tabs.map(t=>(<button key={t.id} className={tab===t.id?"active":""} onClick={()=>setTab(t.id)}>{t.label}{t.data ? " ("+t.data.length+")" : ""}</button>))}
      </div>
      {tab==="path" ? (
        <PersonalizedPathView session={session} applySession={applySession} notify={notify} onOpen={setOpenTitle}/>
      ) : active.data.length===0 ? (
        <p className="text-faint fs-14">{t("learning.nothingHere")}</p>
      ) : (
        <div className="grid-3">
          {active.data.map((c,i)=>(
            <LearningCard key={i} c={c} cta={active.cta} primary={active.primary} onClick={()=>{
              if(isDemoFixture){
                if(tab==="learning") notify(t("learning.greatProgress"));
                else if(tab==="completed") notify(t("learning.reviewingNotify",{title:c.title}));
                else notify(t("learning.startedNotify",{title:c.title}));
                return;
              }
              const resource = findResource(c.title);
              if(!resource) { notify(tab==="completed" ? t("learning.reviewingNotify",{title:c.title}) : t("learning.startedNotify",{title:c.title})); return; }
              if(tab==="learning"){
                setOpenTitle(c.title);
              } else if(tab==="completed"){
                setOpenTitle(c.title);
              } else {
                startResource(session, applySession, notify, resource, currentScoreFor(resource.competency), t);
                setOpenTitle(c.title);
              }
            }}/>
          ))}
        </div>
      )}
      {tab==="learning" && (
        <div className="center mt-32">
          <button className="btn btn-primary" onClick={()=>go("reassessment")}>{t("learning.readyToMeasure")} <IconArrowRight size={16}/></button>
        </div>
      )}
    </WorkspaceShell>
  );
}

function ProgressPage({go}){
  const {t} = useLanguage();
  const comp = LEARNER.competency;
  const isPureDemo = comp && comp.mode==="demo";

  if(isPureDemo){
    // Pure "Launch Demo Journey" session with no real assessment taken —

      return {...b, improvement: b.after-b.before, target, remaining: Math.max(0, target-b.after)};

          <div className="card card-pad">
            <h3 style={{fontSize:16,marginBottom:16}}>{t("progress.beforeAfter")}</h3>

            <div className="flex-row gap-16 mt-14 fs-13 text-dim">

            </div>
          </div>
          <div className="card card-pad center">
            <h3 style={{fontSize:16,alignSelf:"flex-start",marginBottom:10}}>{t("progress.competencyRadar")}</h3>
            <RadarChart data={DEMO_BASELINE} size={270}/>
          </div>
        </div>
        <div className="card card-pad mt-24">
          <h3 style={{fontSize:16,marginBottom:16}}>{t("progress.beforeAfterAnalysis")}</h3>
          {improvements.map((b,i)=>(
            <div key={i} style={{padding:"14px 0",borderBottom: i<improvements.length-1?"1px solid var(--line)":"none"}}>

                <span>{b.before}%</span><IconArrowRight size={13}/><span style={{color:"var(--indigo-600)",fontWeight:700}}>{b.after}%</span>
                <span className="text-faint">{t("progress.targetLabel",{target:b.target,remaining:b.remaining})}</span>
              </div>
            </div>
          ))}
        </div>
        <div className="card card-pad mt-24">
          <h3 style={{fontSize:16,marginBottom:6}}>{t("progress.resourceEffectiveness")}</h3>
          <p className="text-dim fs-14" style={{marginBottom:16}}>{t("progress.resourceEffectivenessDesc")}</p>
          <div className="grid-2">
            {RESOURCE_EFFECTIVENESS.map((r,i)=>(
              <div key={i} className="gap-card">
                <div className="flex-between"><span className="fw-700 fs-14">{r.resource}</span><span className={"badge badge-status-"+r.cls}>{r.label}</span></div>
                <p className="fs-12 text-faint mt-8">{r.competency}</p>
                <div className="gap-arrow-row mt-10"><span>{r.before}%</span><IconArrowRight size={13}/><span style={{color:"var(--indigo-600)",fontWeight:700}}>{r.after}%</span>
                  <span style={{color:"var(--green)",fontWeight:700}}>+{r.improvement}%</span>

  if(!LEARNER.reassessCompleted || !LEARNER.reassessScores){

  const chartData = (LEARNER.extractedTopics && LEARNER.extractedTopics.length ? LEARNER.extractedTopics : COMPETENCY_NAMES)

    .map(name=>({name, before:LEARNER.competencyScores[name], after:LEARNER.reassessScores[name]}));
  const improvements = chartData.map(b=>{
    const target = Math.min(95, b.before+45);
    return {...b, improvement: b.after-b.before, target, remaining: Math.max(0, target-b.after)};
  });
  const nextFocus = improvements.length ? [...improvements].sort((a,b)=>b.remaining-a.remaining)[0] : null;
  const effectiveness = LEARNER.resourceEffectiveness || [];
  const strongest = improvements.filter(b=>b.remaining===0 || b.improvement>0).sort((a,b)=>b.improvement-a.improvement).slice(0,2);
  return (

          <BeforeAfterChart data={chartData}/>
          <div className="flex-row gap-16 mt-14 fs-13 text-dim">
            <span className="flex-row gap-8"><span style={{width:10,height:10,borderRadius:2,background:"var(--line-strong)"}}></span>{t("progress.before")}</span>
            <span className="flex-row gap-8"><span style={{width:10,height:10,borderRadius:2,background:"var(--indigo-600)"}}></span>{t("progress.after")}</span>
          </div>
        </div>
        <div className="card card-pad center">
          <h3 style={{fontSize:16,alignSelf:"flex-start",marginBottom:10}}>{t("progress.competencyRadar")}</h3>
          <RadarChart data={chartData} size={270}/>
        </div>
      </div>

      <div className="card card-pad mt-24">
        <h3 style={{fontSize:16,marginBottom:16}}>{t("progress.beforeAfterAnalysis")}</h3>
        {improvements.map((b,i)=>(
          <div key={i} style={{padding:"14px 0",borderBottom: i<improvements.length-1?"1px solid var(--line)":"none"}}>
            <div className="flex-between" style={{flexWrap:"wrap",gap:8}}>
              <span className="fw-700 fs-15">{b.name}</span>
              <span className={"badge badge-status-"+(b.improvement>=0?"green":"red")}>{b.improvement>=0?"+":""}{b.improvement}%</span>
            </div>
            <div className="gap-arrow-row mt-8">
              <span>{b.before}%</span><IconArrowRight size={13}/><span style={{color:"var(--indigo-600)",fontWeight:700}}>{b.after}%</span>
              <span className="text-faint">{t("progress.targetLabel",{target:b.target,remaining:b.remaining})}</span>
            </div>
          </div>
        ))}
      </div>

      <div className="card card-pad mt-24">
        <h3 style={{fontSize:16,marginBottom:6}}>{t("progress.resourceEffectiveness")}</h3>
        <p className="text-dim fs-14" style={{marginBottom:16}}>{t("progress.resourceEffectivenessDesc")}</p>
        {effectiveness.length===0 ? (
          <p className="text-faint fs-14">{t("progress.noEffectivenessData")}</p>
        ) : (
          <div className="grid-2">
            {effectiveness.map((r,i)=>(
              <div key={i} className="gap-card">
                <div className="flex-between"><span className="fw-700 fs-14">{r.resource}</span><span className={"badge badge-status-"+r.cls}>{r.label}</span></div>
                <p className="fs-12 text-faint mt-8">{r.competency}</p>
                <div className="gap-arrow-row mt-10"><span>{r.before}%</span><IconArrowRight size={13}/><span style={{color:"var(--indigo-600)",fontWeight:700}}>{r.after}%</span>
                  <span style={{color: r.improvement>=0 ? "var(--green)" : "var(--red)",fontWeight:700}}>{r.improvement>=0?"+":""}{r.improvement}%</span>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {nextFocus && (
        <div className="card card-pad mt-24" style={{background:"linear-gradient(120deg,#EDEBFB,#E3F3FA)",border:"none"}}>
          <div className="badge badge-ai" style={{marginBottom:12}}><span className="dot"></span>{t("progress.aiInsight")}</div>
          <p style={{fontSize:15,lineHeight:1.6}}>
            {strongest.length ? t("progress.progressRecorded",{names:strongest.map(s=>s.name).join(" and ")}) : null}
            {t("progress.highestPriority",{name:nextFocus.name,remaining:nextFocus.remaining})}
          </p>
          <p className="fs-13 text-dim mt-8"><b>{t("progress.whatsNext")}</b> {t("progress.whatsNextText",{name:nextFocus.name})}</p>
        </div>
      )}

      <div className="center mt-24">
        <button className="btn btn-primary" onClick={()=>go("recommendations")}>{t("progress.seeNextPath")} <IconArrowRight size={16}/></button>
      </div>
    </WorkspaceShell>
  );
}

/* ============================= REWARDS PAGE ============================= */
// Pure display layer over the existing, real, session-based rewards state —
// LEARNER.rewards (mirroring session.rewards, see applyLearnerFromSession/
// rewardsOf) and LEARNER.streak (see computeStreak/activityPatch). This
// page reads that state with the SAME totalXPOf/levelInfoOf helpers the XP
// engine already exposes; it never recomputes XP or streak itself.
function RewardsPage({go, session, notify, applySession}){
  const {t} = useLanguage();
  const rewards = LEARNER.rewards || {history:[], awarded:{}, shieldAvailable:true};
  const history = Array.isArray(rewards.history) ? rewards.history : [];
  const totalXP = totalXPOf(history);
  const level = levelInfoOf(totalXP);
  const streak = LEARNER.streak || 0;
  const shieldAvailable = rewards.shieldAvailable !== false;
  const shieldEntry = [...history].reverse().find(h=>h.type==="shield_used");
  const milestones = [
    {n:3, xp:XP_VALUES.streak_3},
    {n:7, xp:XP_VALUES.streak_7},
    {n:14, xp:XP_VALUES.streak_14},
  ];
  const sortedHistory = [...history].sort((a,b)=> new Date(b.at)-new Date(a.at));
  // Scoped to the CURRENT calendar week only — see weekKeyOf/currentWeekKey
  // above. Recomputing this on every render is cheap and always correct: it
  // naturally rolls over to a fresh key (and therefore fresh, unclaimed
  // challenges) the moment a new week starts, with no separate reset logic.
  const weekKey = currentWeekKey();

  // Reveals + claims one scratch card. Guarded by claimScratchCard itself
  // (locked or already-claimed => null => no-op), so a stray double-click
  // or a click on a card that's actually still locked can never award
  // twice or bypass its unlock condition. On success, the SAME single
  // session write pattern used by every other reward call site (e.g.
  // completeResourceNow) persists the result to both the live session
  // (applySession, survives refresh) and the stored account
  // (updateAccountFields, survives logout/login).
  // Synchronous in-memory guard against a rapid double-click/repeated-click
  // on the SAME card firing claimScratchCard twice before the claimed-driven
  // re-render (which swaps the button for the claimed badge) lands. Keyed
  // per-card so locking one card never blocks clicking a different one.
  // rewards.awarded inside claimScratchCard remains the real, persisted
  // dedupe guard; this ref only stops a second synchronous call from
  // reaching it while state hasn't caught up yet.
  const scratchLockRef = useRef({});
  const revealScratchCard = (card)=>{
    const lockKey = scratchCardKey(card.id);
    if(scratchLockRef.current[lockKey]) return;
    scratchLockRef.current[lockKey] = true;
    const result = claimScratchCard(session, card);
    if(!result) return;
    const nextSession = {...(session||{}), rewards: result.rewards};
    if(applySession) applySession(nextSession);
    if(nextSession.email) updateAccountFields(nextSession.email, {rewards: result.rewards});
    if(notify){
      notify(card.reward.kind==="shield"
        ? t("rewards.scratchWonShield")
        : t("rewards.xpToastSingle", {xp:result.awardedEntry.xp, label:t("rewards.type."+result.awardedEntry.type)}));
    }
  };

  // Claims exactly one Weekly Challenge's reward for the CURRENT week.
  // Guarded by claimWeeklyChallenge itself (not yet completed this week OR
  // already claimed this week => null => no-op) — the same duplicate-claim
  // protection pattern as revealScratchCard above, just keyed per-week. On
  // success, the SAME single session write pattern used by every other
  // reward call site persists the result to both the live session
  // (applySession, survives refresh) and the stored account
  // (updateAccountFields, survives logout/login).
  // Synchronous in-memory guard against a rapid double-click/repeated-click
  // on the SAME challenge firing claimWeeklyChallenge twice before the
  // claimed-driven re-render lands. Keyed per-challenge-per-week (same
  // scoping as weeklyChallengeKey) so a new week's fresh instance is never
  // affected by a prior week's lock. rewards.awarded inside
  // claimWeeklyChallenge remains the real, persisted dedupe guard; this ref
  // only stops a second synchronous call from reaching it while state
  // hasn't caught up yet.
  const weeklyLockRef = useRef({});
  const claimWeekly = (challenge)=>{
    const lockKey = weeklyChallengeKey(challenge.id, weekKey);
    if(weeklyLockRef.current[lockKey]) return;
    weeklyLockRef.current[lockKey] = true;
    const result = claimWeeklyChallenge(session, challenge, weekKey);
    if(!result) return;
    const nextSession = {...(session||{}), rewards: result.rewards};
    if(applySession) applySession(nextSession);
    if(nextSession.email) updateAccountFields(nextSession.email, {rewards: result.rewards});
    if(notify) notify(t("rewards.xpToastSingle", {xp:result.awardedEntry.xp, label:t("rewards.type."+result.awardedEntry.type)}));
  };

  return (
    <WorkspaceShell page="rewards" go={go} title={t("rewards.heading")}>

function LeaderboardPage({go, session}){
  const {t} = useLanguage();

  // never cached/stale across a refresh, a claim on the Rewards page, or a
  // logout/login (session is reloaded from the stored account either way).
  const rows = useMemo(()=> leaderboardRowsOf(session, learnerName), [session, learnerName]);

  const podiumOrder = top3.length===3 ? [top3[1], top3[0], top3[2]] : top3;

    <WorkspaceShell page="leaderboard" go={go} title={t("leaderboard.heading")}>

        </div>

      <div className="card card-pad mt-24">

/* ============================= APP ROOT ============================= */
function App(){
  const {t} = useLanguage();
  // Lazy-init: read any existing prototype session once on first mount and
  // sync LEARNER + initial page from it, so a refresh doesn't drop the user
  // back into a protected page with stale/demo data or bounce them out.
  const [session, setSessionState] = useState(()=> loadSession());
  const [page, setPage] = useState(()=>{
    const s = loadSession();
    if(isSessionActive(s)){
      applySessionToLearner(s);
      return "dashboard";
    }
    return "landing";
  });
  const [toasts, setToasts] = useState([]);
  const idRef = useRef(0);
  // Which exact resource/subtopic title the Learning page should open
  // straight into — set by go("learning", {openTitle}) so Recommendations
  // (and anywhere else) can deep-link into an exact Learning Session instead
  // of landing on the generic My Learning list.
  const [openLearningTitle, setOpenLearningTitle] = useState(null);

  const notify = useCallback((msg)=>{
    const id = ++idRef.current;
    setToasts(t=>[...t, {id, msg}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 3200);
  },[]);

  // Creates/updates the active session: persists it to localStorage, mutates
  // the shared LEARNER object so every page reflects it immediately, and
  // updates React state so components can react to auth status changing.
  const applySession = useCallback((next)=>{
    saveSession(next);
    applySessionToLearner(next);
    setSessionState(next);
  },[]);

  const go = useCallback((p, opts)=>{
    if(p==="logout"){
      clearStoredSession();
      setSessionState(null);
      notify(t("auth.loggedOut"));
      setPage("auth");
      window.scrollTo({top:0, behavior:"instant"});
      return;
    }
    if(PROTECTED_PAGES.includes(p) && !isSessionActive(session)){
      notify(t("auth.pleaseLogin"));
      setPage("auth");
      window.scrollTo({top:0, behavior:"instant"});
      return;
    }
    // Deep-link support: go("learning", {openTitle:"Exact Subtopic"}) opens
    // that exact Learning Session on arrival instead of the generic list.
    // Any other navigation to "learning" (e.g. a plain nav-link click)
    // clears it so a stale deep link can't reopen on an unrelated visit.
    if(p==="learning") setOpenLearningTitle(opts && opts.openTitle ? opts.openTitle : null);
    setPage(p);
    window.scrollTo({top:0, behavior:"instant"});
  },[session, notify, t]);

  let content;
  switch(page){
    case "landing": content = <LandingPage go={go} notify={notify} applySession={applySession} session={session}/>; break;
    case "how": content = <HowPage go={go} session={session}/>; break;
    case "architecture": content = <ArchitecturePage go={go} session={session}/>; break;
    case "auth": content = <AuthPage go={go} notify={notify} applySession={applySession} session={session}/>; break;
    case "onboarding": content = <OnboardingPage go={go} notify={notify} applySession={applySession} session={session}/>; break;
    case "dashboard": content = <DashboardPage go={go} session={session}/>; break;
    case "upload": content = <UploadPage go={go} notify={notify} session={session} applySession={applySession}/>; break;
    case "processing": content = <ProcessingPage go={go}/>; break;
    case "topics": content = <TopicsPage go={go} session={session}/>; break;
    case "assessment": content = <AssessmentPage go={go} notify={notify} mode="initial" session={session} applySession={applySession}/>; break;
    case "results": content = <ResultsPage go={go}/>; break;
    case "gaps": content = <GapsPage go={go}/>; break;
    case "competencies": content = <CompetenciesPage go={go}/>; break;
    case "recommendations": content = <RecommendationsPage go={go} notify={notify} session={session} applySession={applySession}/>; break;
    case "learning": content = <LearningPage go={go} notify={notify} session={session} applySession={applySession} initialOpenTitle={openLearningTitle}/>; break;
    case "reassessment": content = <ReassessmentIntroPage go={go}/>; break;
    case "reassessment-quiz": content = <AssessmentPage go={go} notify={notify} mode="reassess" session={session} applySession={applySession}/>; break;
    case "progress": content = <ProgressPage go={go}/>; break;
    case "rewards": content = <RewardsPage go={go} session={session} notify={notify} applySession={applySession}/>; break;
    case "leaderboard": content = <LeaderboardPage go={go} session={session}/>; break;
    case "loop": content = <LoopPage go={go} session={session}/>; break;
    case "admin": content = <AdminPage go={go}/>; break;
    default: content = <LandingPage go={go} notify={notify} applySession={applySession} session={session}/>;
  }

  return (
    <React.Fragment>
      {content}
      <ToastHost toasts={toasts}/>
    </React.Fragment>
  );
}

// Catches runtime (not parse-time) errors thrown while rendering any page
// and shows a recoverable message instead of unmounting the whole app to a
// blank screen. Parse/transform errors are handled separately by the
// plain-JS safety net above (they happen before this component ever runs).
// RootErrorBoundary sits ABOVE LanguageProvider in the tree (see root.render
// below), so if it ever has to render its fallback, the LanguageProvider
// (and its context) may be unmounted along with everything else — a class
// component here can't call useLanguage() anyway. Instead it reads the
// persisted language choice directly (same localStorage key the provider
// itself reads on init) and looks the string up from the same TRANSLATIONS
// table, falling back to English exactly like t() does, so this stays
// multilingual without depending on React context surviving the crash.
function tErrorBoundary(key){
  const lang = loadLanguage();
  let str = getPath(TRANSLATIONS[lang], key);
  if(str===undefined) str = getPath(TRANSLATIONS.en, key);
  return str===undefined ? key : str;
}
class RootErrorBoundary extends React.Component{
  constructor(props){ super(props); this.state = {error:null}; }
  static getDerivedStateFromError(error){ return {error}; }
  componentDidCatch(error, info){ console.error("KarmSetu runtime error:", error, info); }
  render(){
    if(this.state.error){
      return (
        <div style={{maxWidth:640,margin:"64px auto",padding:"28px 30px",fontFamily:"Inter,system-ui,sans-serif",background:"#FBE4E4",border:"1px solid #E8A9A9",borderRadius:14,color:"#7A2020"}}>
          <div style={{fontWeight:700,fontSize:17,marginBottom:8}}>{tErrorBoundary("errorBoundary.title")}</div>
          <div style={{fontSize:14,lineHeight:1.5,marginBottom:14}}>{tErrorBoundary("errorBoundary.description")}</div>
          <button
            onClick={()=>{ this.setState({error:null}); window.location.reload(); }}
            style={{background:"#7A2020",color:"#fff",border:"none",borderRadius:8,padding:"9px 16px",fontSize:13.5,fontWeight:600,cursor:"pointer"}}
          >{tErrorBoundary("errorBoundary.reloadButton")}</button>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<RootErrorBoundary><LanguageProvider><App/></LanguageProvider></RootErrorBoundary>);
window.__karmsetuMounted = true;
var __karmsetuFatalEl = document.getElementById("karmsetu-fatal");
if(__karmsetuFatalEl) __karmsetuFatalEl.remove();
</script>
