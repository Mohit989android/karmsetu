const EVIDENCE_WORD_HI = {}, EVIDENCE_WORD_HINGLISH = {};
EVIDENCE_WORD_TRIPLES.forEach(([en,hi,hg])=>{ EVIDENCE_WORD_HI[en]=hi; EVIDENCE_WORD_HINGLISH[en]=hg; });

// The one centralized helper — see the block comment above for the full
// contract. `text` is the ORIGINAL English generated phrase; the return
// value is the DISPLAY string for `language` and is never fed back into
// grounding/matching/scoring.
function translateEvidenceText(text, language){
  if(!text || !language || language==="en") return text;
  const dict = language==="hi" ? EVIDENCE_WORD_HI : (language==="hinglish" ? EVIDENCE_WORD_HINGLISH : null);
  if(!dict) return text;
  const vaulted = [];
  const vault = (s)=>{ vaulted.push(s); return "\u0001"+(vaulted.length-1)+"\u0002"; };
  // Protect quoted spans (an embedded "${topic}") exactly as written.
  let working = text.replace(/"[^"]*"/g, vault);
  // Protect known technology/tool names — longest first so multi-word
  // terms (e.g. "Machine Learning") are captured whole before their
  // component words could be matched individually.
  KNOWN_TECH_TERMS.slice().sort((a,b)=>b.length-a.length).forEach(term=>{
    const re = new RegExp("(^|[^A-Za-z0-9])("+term.replace(/[-/\\^$*+?.()|[\]{}]/g,"\\$&")+")($|[^A-Za-z0-9])","g");
    working = working.replace(re, (m,p1,p2,p3)=> p1+vault(p2)+p3);
  });
  // Word-level dictionary pass over everything that's left. Any word not
  // in the dictionary (numbers, proper nouns, domain jargon the document
  // introduces) is left exactly as written — never guessed.
  let translated = working.replace(/[A-Za-z]+(?:['’][A-Za-z]+)?/g, (word)=>{
    const lower = word.toLowerCase();
    if(!(lower in dict)) return word;
    return dict[lower];
  });
  // Restore vaulted (quoted / technical) segments verbatim.
  translated = translated.replace(/\u0001(\d+)\u0002/g, (m,i)=> vaulted[Number(i)]);
  // Tidy whitespace/punctuation left behind by dropped words (e.g. "the").
  translated = translated.replace(/[ \t]{2,}/g," ").replace(/\s+([.,;:!?])/g,"$1").trim();
  if(!translated) return text; // safety net: never show an empty option
  return translated.charAt(0).toUpperCase()+translated.slice(1);
}

/* ============================= ASSESSMENT GENERATION FROM UPLOADED MATERIAL =============================
   Builds real, understanding-based multiple-choice questions FROM THE
   LEARNER'S ACTUAL UPLOADED TEXT — never the fixed Data Analysis question
   bank, and never a raw "fill in the blank from this text dump" question.
   Each question carries the metadata required for NORMAL USER MODE:
   question, options, correct answer, topic, competency (same as topic in
   this prototype — see COMPETENCY_NAMES/topicScores comments), difficulty,
   and a source caption — plus internal-only explainability metadata
   (questionType, sourceSection) that the quiz UI does not render.

   Every distractor is chosen to be semantically comparable to the correct
   answer (getRelatedDistractors) — never an unrelated document topic or an
   unrelated global term pulled in just to fill a fourth option. If a
   question can't be genuinely grounded in the uploaded material with real,
   comparable options, the template returns null and it is skipped rather
   than padded or fabricated (quality over a fixed question count).
*/
function splitSentences(text){
  return (text||"").replace(/\s+/g," ").split(/(?<=[.?!])\s+/).map(s=>s.trim()).filter(s=>s.length>=20 && s.length<=280);
}
function truncateText(s, n){ return s.length>n ? s.slice(0,n-1).trim()+"…" : s; }
// Shuffles option order while tracking where the correct option ended up.
function shuffleOptions(options, correctIndex){
  const arr = options.map((o,idx)=>({o, correct:idx===correctIndex}));
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return {options:arr.map(x=>x.o), answer:arr.findIndex(x=>x.correct)};
}
// Same Fisher-Yates shuffle as shuffleOptions(), but carries a second,
// PARALLEL "canonical" (pre-translation) array through the identical
// permutation so the two stay index-aligned. Used so a generated
// question's options can be re-displayed in a different language later —
// via optionsCanonical — without re-shuffling (which would change which
// letter maps to which content and invalidate an in-progress answer).
function shuffleOptionsWithCanonical(options, canonicalOptions, correctIndex){
  const arr = options.map((o,idx)=>({o, c: canonicalOptions ? canonicalOptions[idx] : null, correct:idx===correctIndex}));
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return {
    options: arr.map(x=>x.o),
    optionsCanonical: canonicalOptions ? arr.map(x=>x.c) : null,
    answer: arr.findIndex(x=>x.correct),
  };
}
// Generic Fisher-Yates shuffle of a plain array — used to pick a varied,
// non-deterministic subset of candidate distractors (never for the final
// option order, which goes through shuffleOptions above).
function shuffleArray(arr){
  const a = (arr||[]).slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
// Cleans a bullet/sentence fragment into a short, standalone descriptive
// phrase suitable as an MCQ option — never a huge raw text dump.
function cleanPhrase(s, maxLen){
  maxLen = maxLen || 68;
  let t = (s||"").replace(/\s+/g," ").trim();
  t = t.replace(/^[-•*]\s*/,"").replace(/^[A-Z0-9 ]{3,}:\s*/,"");
  if(t.length>maxLen){
    let cut = t.slice(0,maxLen);
    const lastSpace = cut.lastIndexOf(" ");
    if(lastSpace>maxLen*0.5) cut = cut.slice(0,lastSpace);
    t = cut.trim()+"…";
  }
  if(t) t = t.charAt(0).toUpperCase()+t.slice(1);
  return t;
}
// Deterministic, no-API helper that turns a raw evidence sentence into a
// concise MCQ answer phrase that reads like an answer rather than a
// shortened copy of the source sentence. It only trims/restructures
// wording that is already in the source — it never invents facts and
// never changes the meaning. The original sentence is still kept
// separately as sourceSnippet for explainability; this is only used for
// the visible option/answer text.
function summarizeEvidencePhrase(text, topic, maxLen){
  maxLen = maxLen || 72;
  let t = (text||"").replace(/\s+/g," ").trim();
  // strip heading-style prefixes / bullet markers (same as cleanPhrase)
  t = t.replace(/^[-•*]\s*/,"").replace(/^[A-Z0-9][A-Z0-9 ]{2,}:\s*/,"");
  // strip generic "pointing back at the document" wording that adds
  // length without adding meaning to the answer
  t = t.replace(/^(according to (the )?(uploaded )?(material|document|text)[,:]?\s*)/i,"");
  t = t.replace(/^(the (uploaded )?material (states|explains|shows|indicates|notes)\s*that\s*)/i,"");
  t = t.replace(/^(as (mentioned|described|noted|shown) in the (uploaded )?material[,:]?\s*)/i,"");
  t = t.replace(/^(this (section|part|process)\s+)/i,"");
  // prefer the key action/meaning: if the sentence is "<subject> <action
  // verb> ...", drop the subject clause and lead with the action, so
  // "Competency analysis identifies learner skill gaps..." becomes
  // "Identifies learner skill gaps...". Falls back to stripping a plain
  // "<subject> is/are/refers to/means <predicate>" copula clause.
  const actionMatch = t.match(/^[A-Z][A-Za-z0-9 /&-]{1,45}?\s+((?:identifies|provides|supports|helps?|enables?|allows?|includes?|involves?|represents?|uses?|analyzes?|generates?|produces?|creates?|manages?|tracks?|measures?|calculates?|recommends?|delivers?|combines?|converts?|processes?|extracts?)\b.*)$/);
  if(actionMatch && actionMatch[1] && actionMatch[1].length>8){
    t = actionMatch[1];
  } else {
    const copulaMatch = t.match(/^[A-Z][A-Za-z0-9 /&-]{1,45}?\s+(?:is|are|refers to|means)\s+(.*)$/i);
    if(copulaMatch && copulaMatch[1] && copulaMatch[1].length>8) t = copulaMatch[1];
  }
  // light filler trim — never removes factual content, only hedge words
  t = t.replace(/\bhelps? to\b/gi,"supports").replace(/\bhelps?\b/gi,"supports");
  t = t.replace(/^(that|which|it)\s+/i,"");
  t = t.replace(/\s+/g," ").trim().replace(/[.;,]+$/,"");
  if(!t) return cleanPhrase(text, maxLen); // safety net: never return empty
  if(t.length>maxLen){
    let cut = t.slice(0,maxLen);
    const lastSpace = cut.lastIndexOf(" ");
    if(lastSpace>maxLen*0.5) cut = cut.slice(0,lastSpace);
    t = cut.trim()+"…";
  }
  t = t.charAt(0).toUpperCase()+t.slice(1);
  return t;
}
// Normalizes text for near-duplicate comparison: lowercase, strip
// punctuation, collapse whitespace, drop very short filler words.
function normalizeForCompare(s){
  return (s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()
    .split(" ").filter(w=>w.length>2).join(" ");
}
// Word-overlap ratio (0..1) between two strings — used both to catch two
// MCQ options that are effectively equivalent, and to catch a
// reassessment question that is really just baseline wording with a few
// connector words changed.
function textOverlapRatio(a,b){
  const wa = new Set(normalizeForCompare(a).split(" ").filter(Boolean));
  const wb = new Set(normalizeForCompare(b).split(" ").filter(Boolean));
  if(!wa.size || !wb.size) return 0;
  let shared = 0;
  wa.forEach(w=>{ if(wb.has(w)) shared++; });
  return shared / Math.min(wa.size, wb.size);
}
// Builds every generated question with source-grounding metadata retained
// internally (questionType/sourceSection/sourceSnippet) for explainability
// — never rendered as a raw dump on the quiz UI, which still just shows
// q.q / q.options / q.source. Returns null (rather than padding with a
// placeholder like "Not covered in the material") whenever there aren't at
// least three genuine, distinct distractors — the caller simply skips it.
// Small, deterministic, evidence-based difficulty classifier. Difficulty
// is derived from the question TYPE (what kind of reasoning it actually
// requires) plus a light look at the grounding evidence/question text,
// rather than being a fixed label handed in by whichever template
// happened to build the question. Always resolves to one of the three
// values the rest of the app (competency scoring, badges, resource

function inferQuestionDifficulty(questionType, evidence, questionText){

      return /\b(and|which in turn|so that|because)\b.*\b(and|which in turn|so that|because)\b/i.test(evText)

    case "comparison":

      // two concepts from each other

//    render recipe (qKey/qArgs/qPool/qSeed/optionKind/optionsCanonical)

      options: (q.optionsByLang && (q.optionsByLang[language] || q.optionsByLang.en)) || q.options,
      source: q.source || null,
    };
  }
  if(q.qKey){
    let qText;
    if(q.qPool){
      const pool = qgt(language, q.qKey);
      const entry = pool[(q.qSeed||0) % pool.length];

// question that fails is simply skipped in favour of the next
// template/topic rather than patched into something misleading.
function isAcceptableQuestion(q, existingQuestions){

      splitSentences(sec.content).forEach(s=> units.push({text:s, heading:sec.heading, kind:"sentence"}));

// Evidence for a topic is NOT just units whose own sentence literally
// contains the topic string — a heading-derived topic like "Memory
// Hierarchy" is the SUBJECT of every bullet under that section even
// though none of those bullets repeat the words "memory hierarchy"
// ("RAM provides fast, volatile storage..." IS evidence for "Memory
// Hierarchy", it just doesn't say so by name). Without this, any topic
// that came from a section heading rather than an inline term got ZERO
// evidence units and silently produced no questions at all — the single
// biggest cause of the "only 1 question generated" bug. So evidence is
// the union of (a) any unit whose text literally mentions the topic
// (works for inline terms/acronyms like RAM, CPU, ALU across the WHOLE
// document) and (b) every unit belonging to a section whose heading is
// (or reduces to, via headingToTopicCandidate) this exact topic.

  const direct = units.filter(u=>u.text.toLowerCase().includes(t));
  if(!structured) return direct;
  const matchingHeadings = new Set();
  structured.sections.forEach(s=>{
    const hLower = s.heading.toLowerCase();
    const cand = headingToTopicCandidate(s.heading);
    if(hLower===t || (cand && cand.toLowerCase()===t)) matchingHeadings.add(s.heading);

// Reusable helper for building distractors that are semantically

// and never a global term unless the material genuinely doesn't offer
// enough alternatives. Preference order: (1) same category, explicitly
// present in the uploaded material and from the same section; (2) same
// category elsewhere in the material; (3) same topic family (handled by
// the caller pre-gathering "candidates" from related evidence); (4) only
// as a last resort, a plausible alternative from a fixed reference pool.
// Picks ONE evidence unit from another topic's evidence list, preferring
// a unit matching `preferMarker` (e.g. a real definition/purpose
// sentence), then any bullet, then anything — but always skipping a unit
// whose cleaned phrase is already in `excludeSet`. Without this, several
// topics that are only ever mentioned together in one shared sentence
// (e.g. "Technologies used include Python, NLP, Flask and MySQL") would
// all contribute the SAME sentence as their "distractor", collapsing to a
// single duplicate option instead of three distinct, comparable ones.

function getRelatedDistractors(correctAnswer, opts){
  opts = opts || {};

    const key = String(val).toLowerCase().trim();
    if(!key || exclude.has(key)) return;
    out.push(val); exclude.add(key);

    // detected in the learner's own uploaded material — same section
    // first, then elsewhere in the material. KNOWN_TECH_TERMS is never
    // used as a distractor pool (it's only used elsewhere to DETECT

// Looks up a GEN_TRANSLATIONS entry for `language`, falling back to English
// if the language or key is missing, then calls it with the given args.
function gt(language, key, ...args){
  const dict = GEN_TRANSLATIONS[language] || GEN_TRANSLATIONS.en;
  const entry = (key in dict) ? dict[key] : GEN_TRANSLATIONS.en[key];
  return typeof entry === "function" ? entry(...args) : entry;
}

// --- Question templates. Each returns a question object or null when the
// topic doesn't have enough real evidence to support that style — quality
// over forcing a fixed template to fit. ---

// Concept/definition — asks what something IS or its primary purpose,
// grounded in an actual definitional sentence/bullet about the topic.
function tplConceptDefinition(topic, evidence, allTopicEvidence, difficulty, variant, seed, language){
  const def = pickBestEvidenceForTopic(evidence, DEFINITION_MARKERS, topic, 15);
  if(!def) return null;
  const correct = summarizeEvidencePhrase(def.text, topic);
  if(correct.length<8) return null;
  const sameSectionCandidates = [], candidates = [];
  const usedPhrases = new Set([correct.toLowerCase()]);
  for(const [otherTopic, otherEv] of allTopicEvidence){
    if(otherTopic===topic) continue;
    const otherDef = pickCandidatePhrase(otherEv, usedPhrases, DEFINITION_MARKERS) || pickAnyCandidatePhrase(otherEv, usedPhrases);
    if(!otherDef) continue;
    const phrase = summarizeEvidencePhrase(otherDef.text, otherTopic);
    if(!phrase) continue;
    usedPhrases.add(phrase.toLowerCase());
    (otherDef.heading===def.heading ? sameSectionCandidates : candidates).push(phrase);
  }
  if(sameSectionCandidates.length + candidates.length < 3){
    candidates.push(...topUpCandidatePhrases(allTopicEvidence, new Set([topic]), usedPhrases, 3-(sameSectionCandidates.length+candidates.length)));
  }
  const distractors = getRelatedDistractors(correct, {category:"concept", sameSectionCandidates, candidates});
  if(distractors.length<3) return null;
  const qKey = variant==="reassess" ? "concept_reassess" : "concept_initial";
  const qSeed = seed||0;
  const phrasingFns = qgt(language, qKey);
  const qText = phrasingFns[qSeed % phrasingFns.length](topic);
  // Evidence-derived option text is localized here, at the very last step,
  // via the single centralized helper — sourceSnippet below still carries
  // the ORIGINAL English text (def.text) for grounding/explainability.
  return makeQuestion(qText, translateEvidenceText(correct, language), distractors.map(d=>translateEvidenceText(d, language)), {topic, difficulty, questionType:"concept", sourceSection:def.heading, sourceSnippet:def.text,
    qKey, qArgs:[topic], qPool:true, qSeed, optionKind:"evidence", correctCanonical:correct, distractorsCanonical:distractors}, language);
}

// Technology recognition — distractors are other technologies actually
// present in the material (same section first), never unrelated global
// tools unless the material truly doesn't offer enough alternatives.
function tplTechFact(topic, heading, techInMaterial, sectionTechMap, difficulty, language){
  const otherTechInMaterial = (techInMaterial||[]).filter(t=>t.toLowerCase()!==topic.toLowerCase());
  const sameSectionTechs = heading ? (sectionTechMap[heading]||[]).filter(t=>t.toLowerCase()!==topic.toLowerCase()) : [];
  const distractors = getRelatedDistractors(topic, {category:"technology", materialTechs:otherTechInMaterial, sameSectionTechs});
  if(distractors.length<3) return null;
  const qKey = heading ? "techfact_heading" : "techfact_noheading";
  const qArgs = heading ? [heading] : [];
  const qText = qgt(language, qKey, ...qArgs);
  // Technology/tool names are never translated (raw), so the canonical
  // form IS the display form in every language.
  return makeQuestion(qText, topic, distractors, {topic, difficulty, questionType:"tech-fact", sourceSection:heading,
    qKey, qArgs, qPool:false, qSeed:0, optionKind:"raw", correctCanonical:topic, distractorsCanonical:distractors}, language);
}

// Purpose/function — only fires when the material actually explains a
// role (via PURPOSE_MARKERS), not merely lists the term. If the material
// only lists it, the caller falls back to plain recognition instead.
function tplPurposeFunction(topic, evidence, allTopicEvidence, isTech, difficulty, variant, language){
  const unit = pickBestEvidenceForTopic(evidence, PURPOSE_MARKERS, topic, 20);
  if(!unit) return null;
  const correct = summarizeEvidencePhrase(unit.text, topic);
  if(correct.length<10) return null;
  const sameSectionCandidates = [], candidates = [];
  const usedPhrases = new Set([correct.toLowerCase()]);
  for(const [otherTopic, otherEv] of allTopicEvidence){
    if(otherTopic===topic) continue;
    const u2 = pickCandidatePhrase(otherEv, usedPhrases, PURPOSE_MARKERS) || pickAnyCandidatePhrase(otherEv, usedPhrases);
    if(!u2) continue;
    const phrase = summarizeEvidencePhrase(u2.text, otherTopic);
    if(!phrase) continue;
    usedPhrases.add(phrase.toLowerCase());
    (u2.heading===unit.heading ? sameSectionCandidates : candidates).push(phrase);
  }
  if(sameSectionCandidates.length + candidates.length < 3){
    candidates.push(...topUpCandidatePhrases(allTopicEvidence, new Set([topic]), usedPhrases, 3-(sameSectionCandidates.length+candidates.length)));
  }
  const distractors = getRelatedDistractors(correct, {category:"concept", sameSectionCandidates, candidates});
  if(distractors.length<3) return null;
  const qKey = variant==="reassess"
    ? (isTech ? "purpose_reassess_tech" : "purpose_reassess_nontech")
    : (isTech ? "purpose_initial_tech" : "purpose_initial_nontech");
  const qText = qgt(language, qKey, topic);
  return makeQuestion(qText, translateEvidenceText(correct, language), distractors.map(d=>translateEvidenceText(d, language)), {topic, difficulty, questionType:"purpose", sourceSection:unit.heading, sourceSnippet:unit.text,
    qKey, qArgs:[topic], qPool:false, qSeed:0, optionKind:"evidence", correctCanonical:correct, distractorsCanonical:distractors}, language);
}

// Comparison — only generated when TWO distinct topics both have real
// definitional evidence. The "difference" is never invented: the correct
// option is topic A's actual description, and topic B's actual
// description is deliberately included as a plausible, comparable
// distractor (plus other topics' real descriptions to fill the option set).
function tplComparison(topicA, evidenceA, topicB, evidenceB, allTopicEvidence, difficulty, variant, language){
  const defA = pickBestEvidenceForTopic(evidenceA, DEFINITION_MARKERS, topicA, 15);
  const defB = pickBestEvidenceForTopic(evidenceB, DEFINITION_MARKERS, topicB, 15);
  if(!defA || !defB) return null;
  const correct = summarizeEvidencePhrase(defA.text, topicA);
  const wrongB = summarizeEvidencePhrase(defB.text, topicB);
  if(!correct || !wrongB || correct===wrongB || correct.length<8 || wrongB.length<8) return null;
  const candidates = [wrongB];
  const usedPhrases = new Set([correct.toLowerCase(), wrongB.toLowerCase()]);
  for(const [otherTopic, otherEv] of allTopicEvidence){
    if(otherTopic===topicA || otherTopic===topicB || candidates.length>=3) continue;
    const u2 = pickCandidatePhrase(otherEv, usedPhrases, DEFINITION_MARKERS) || pickAnyCandidatePhrase(otherEv, usedPhrases);
    if(u2){ const phrase = summarizeEvidencePhrase(u2.text, otherTopic); if(phrase){ candidates.push(phrase); usedPhrases.add(phrase.toLowerCase()); } }
  }
  if(candidates.length < 3){
    candidates.push(...topUpCandidatePhrases(allTopicEvidence, new Set([topicA, topicB]), usedPhrases, 3-candidates.length));
  }
  const distractors = getRelatedDistractors(correct, {category:"concept", candidates});
  if(distractors.length<3) return null;
  const qKey = variant==="reassess" ? "comparison_reassess" : "comparison_initial";
  const qText = qgt(language, qKey, topicA, topicB);
  return makeQuestion(qText, translateEvidenceText(correct, language), distractors.map(d=>translateEvidenceText(d, language)), {topic:topicA, difficulty, questionType:"comparison", sourceSection:defA.heading, sourceSnippet:defA.text,
    qKey, qArgs:[topicA, topicB], qPool:false, qSeed:0, optionKind:"evidence", correctCanonical:correct, distractorsCanonical:distractors}, language);
}

// Scenario/application — grounded in an evidence unit that itself
// describes an action/outcome/next-step (SCENARIO_MARKERS), not a generic
// "what is X used for" restatement. Skipped if no such evidence exists.
function tplScenarioApplication(topic, evidence, allTopicEvidence, difficulty, variant, language){
  const unit = pickBestEvidenceForTopic(evidence, SCENARIO_MARKERS, topic, 25);
  if(!unit) return null;
  const correct = summarizeEvidencePhrase(unit.text, topic);
  if(correct.length<10) return null;
  const sameSectionCandidates = [], candidates = [];
  const usedPhrases = new Set([correct.toLowerCase()]);
  for(const [otherTopic, otherEv] of allTopicEvidence){
    if(otherTopic===topic) continue;
    const u2 = pickCandidatePhrase(otherEv, usedPhrases, SCENARIO_MARKERS) || pickAnyCandidatePhrase(otherEv, usedPhrases);
    if(!u2) continue;
    const phrase = summarizeEvidencePhrase(u2.text, otherTopic);
    if(!phrase) continue;
    usedPhrases.add(phrase.toLowerCase());
    (u2.heading===unit.heading ? sameSectionCandidates : candidates).push(phrase);
  }
  if(sameSectionCandidates.length + candidates.length < 3){
    candidates.push(...topUpCandidatePhrases(allTopicEvidence, new Set([topic]), usedPhrases, 3-(sameSectionCandidates.length+candidates.length)));
  }
  const distractors = getRelatedDistractors(correct, {category:"concept", sameSectionCandidates, candidates});
  if(distractors.length<3) return null;
  const qKey = variant==="reassess" ? "scenario_reassess" : "scenario_initial";
  const qText = qgt(language, qKey, topic);
  return makeQuestion(qText, translateEvidenceText(correct, language), distractors.map(d=>translateEvidenceText(d, language)), {topic, difficulty, questionType:"scenario", sourceSection:unit.heading, sourceSnippet:unit.text,
    qKey, qArgs:[topic], qPool:false, qSeed:0, optionKind:"evidence", correctCanonical:correct, distractorsCanonical:distractors}, language);
}

// Plain topic recognition — the always-available fallback template, used
// only when nothing stronger can be grounded for a topic. Never leaks the
// correct answer inside the question text itself.
//
// A fixed single stem here would mean every topic that falls back to this
// template produces the EXACT SAME question text (only the correct answer
// differs) — and isAcceptableQuestion correctly rejects that as an exact
// duplicate, silently capping the whole assessment at just one recognition
// question no matter how many topics needed one. `seed` cycles through a
// small pool of equally honest, answer-free phrasings so multiple distinct
// topics can each get their own valid recognition question instead of
// collapsing to one.
function tplRecognition(topic, otherTopics, difficulty, variant, seed, language){
  const distractors = shuffleArray(otherTopics.filter(t=>t!==topic)).slice(0,3);
  if(distractors.length<3) return null;
  const qKey = variant==="reassess" ? "recognition_reassess" : "recognition_initial";
  const qSeed = seed||0;
  const pool = qgt(language, qKey);
  const qText = pool[qSeed % pool.length];
  // The correct answer and distractors here ARE the extracted topic labels
  // themselves (same ones shown on the Topics page) — not quoted evidence
  // sentences — so they get the same display-only translateTopicLabel
  // treatment as the Topics page, for a consistent multilingual experience.
  // `meta.topic` below stays the original, untranslated label so scoring/
  // grounding (topicStats, question.topic) is completely unaffected.
  const correctDisplay = translateTopicLabel(topic, language);
  const distractorsDisplay = distractors.map(d=> translateTopicLabel(d, language));
  return makeQuestion(qText, correctDisplay, distractorsDisplay, {topic, difficulty, questionType:"recognition",
    qKey, qArgs:[], qPool:true, qSeed, optionKind:"topic", correctCanonical:topic, distractorsCanonical:distractors}, language);
}

// Process: "what comes next" after a given step.
function tplProcessNext(section, difficulty, language){
  if(!section || section.bullets.length<2) return null;
  const idx = Math.floor(Math.random()*(section.bullets.length-1));
  const current = cleanPhrase(section.bullets[idx]);
  const next = cleanPhrase(section.bullets[idx+1]);
  if(!current || !next || current===next) return null;
  const candidates = section.bullets.filter((b,i)=> i!==idx+1).map(b=>cleanPhrase(b)).filter(Boolean);
  const distractors = getRelatedDistractors(next, {category:"process", candidates});
  if(distractors.length<3) return null;
  const qKey = "process_next";
  const qArgs = [current, section.heading];
  const qText = qgt(language, qKey, ...qArgs);
  return makeQuestion(qText, translateEvidenceText(next, language), distractors.map(d=>translateEvidenceText(d, language)), {topic:section.heading, difficulty, questionType:"process", sourceSection:section.heading,
    qKey, qArgs, qPool:false, qSeed:0, optionKind:"evidence", correctCanonical:next, distractorsCanonical:distractors}, language);
}
// Process: which step happens first.
function tplProcessFirstStep(section, difficulty, language){
  if(!section || section.bullets.length<3) return null;
  const first = cleanPhrase(section.bullets[0]);
  if(!first) return null;
  const candidates = section.bullets.slice(1).map(b=>cleanPhrase(b)).filter(Boolean);
  const distractors = getRelatedDistractors(first, {category:"process", candidates});
  if(distractors.length<3) return null;
  const qKey = "process_firststep";
  const qArgs = [section.heading];
  const qText = qgt(language, qKey, ...qArgs);
  return makeQuestion(qText, translateEvidenceText(first, language), distractors.map(d=>translateEvidenceText(d, language)), {topic:section.heading, difficulty, questionType:"process", sourceSection:section.heading,
    qKey, qArgs, qPool:false, qSeed:0, optionKind:"evidence", correctCanonical:first, distractorsCanonical:distractors}, language);
}
// Process: which sequence correctly represents the process (uses the
// actual first three real steps in their real order as the correct
// answer; distractors are genuine re-orderings of those same real steps,
// never invented steps).
function tplProcessSequence(section, difficulty, language){
  if(!section || section.bullets.length<3) return null;
  const steps = section.bullets.slice(0,3).map(b=>cleanPhrase(b));
  if(steps.some(s=>!s) || new Set(steps).size<3) return null;
  const correct = steps.join(" → ");
  const perms = [
    [steps[1],steps[0],steps[2]].join(" → "),
    [steps[0],steps[2],steps[1]].join(" → "),
    [steps[2],steps[1],steps[0]].join(" → "),
  ].filter(p=>p!==correct);
  const distractors = shuffleArray(perms).slice(0,3);
  if(distractors.length<3) return null;
  const qKey = "process_sequence";
  const qArgs = [section.heading];
  const qText = qgt(language, qKey, ...qArgs);
  // Each "→"-joined option is really 3 short step phrases — translate each
  // step individually (never the joined string, so the "→" separators
  // never get fed through the word-level translator) and reuse the same
  // per-step translation across every permutation via a lookup map. The
  // canonical (pre-translation) joined strings — `correct` and `distractors`
  // below — are what optionKind:"evidence_sequence" replays this same
  // per-step split/translate/join against for any later language switch.
  const displaySteps = steps.map(s=>translateEvidenceText(s, language));
  const stepDisplayMap = new Map(steps.map((s,i)=>[s, displaySteps[i]]));
  const translateSeq = (seq)=> seq.split(" → ").map(s=> stepDisplayMap.get(s) || translateEvidenceText(s, language)).join(" → ");
  const correctDisplay = displaySteps.join(" → ");
  const distractorsDisplay = distractors.map(translateSeq);
  return makeQuestion(qText, correctDisplay, distractorsDisplay, {topic:section.heading, difficulty, questionType:"process", sourceSection:section.heading,
    qKey, qArgs, qPool:false, qSeed:0, optionKind:"evidence_sequence", correctCanonical:correct, distractorsCanonical:distractors}, language);
}

function generateQuestionsFromMaterial(text, topics, variant, siblingQuestions, language){
  variant = variant || "initial";
  language = (language && QGEN_TRANSLATIONS[language]) ? language : "en";
  if(!topics || !topics.length) return [];
  const structured = buildStructuredContent(text);
  const units = collectEvidenceUnits(structured);
  const evidenceByTopic = topics.map(t=> [t, unitsForTopic(units, t, structured)]);
  const techInMaterial = detectTechTerms(text);
  const sectionTechMap = {};
  structured.sections.forEach(s=>{ sectionTechMap[s.heading] = s.technologies || []; });
  // Only sections whose heading/content actually signals an ordered
  // process (see isProcessLike) are ever treated as a workflow.
  const processSections = structured.sections.filter(s=> s.isProcessLike && s.bullets.length>=2);

  // Reassessment offsets which template is tried first per topic so it
  // favours a different question style than the baseline for the same
  // competency, on top of each template's own reassess-specific wording.
  const offset = variant==="reassess" ? 1 : 0;

  // Dynamic target: minimum 5, preferred 8, maximum 12 — scaled to how
  // much usable material there actually is (more distinct topics means
  // more genuinely grounded questions are usually possible). This is a
  // target/ceiling for distribution across topics, never a guarantee:
  // topics without enough real evidence still contribute fewer questions
  // rather than being padded to hit it (see the topic loop below and the
  // final top-up pass, which only ever reuses real, already-grounded
  // material — never invents content to reach a number).
  const target = Math.max(5, Math.min(12, topics.length + Math.ceil(topics.length/2)));
  const counts = topics.map(()=>1);
  let extra = Math.max(0, target - topics.length);
  let gi = 0;
  while(extra>0 && topics.length){
    const idx = gi % topics.length;
    if(counts[idx] < 3){ counts[idx]++; extra--; }
    gi++;
    if(gi > topics.length*6) break; // safety valve against an infinite loop
  }

  const questions = [];
  const usedQTexts = new Set();

  const tryAdd = (q)=>{
    if(!q || usedQTexts.has(q.q)) return false;
    if(!isAcceptableQuestion(q, [...questions, ...(siblingQuestions||[])])) return false;
    questions.push(q);
    usedQTexts.add(q.q);
    return true;
  };

  // A small number of dedicated process/workflow questions for the whole
  // assessment (not per topic), only when the material genuinely
  // describes an ordered process. Reassessment tries a different process
  // question style first so it isn't just the baseline with new options.
  if(processSections.length){
    const sec = processSections[0];
    const procAttempts = variant==="reassess"
      ? [()=>tplProcessFirstStep(sec,"Beginner",language), ()=>tplProcessSequence(sec,"Advanced",language), ()=>tplProcessNext(sec,"Intermediate",language)]
      : [()=>tplProcessNext(sec,"Intermediate",language), ()=>tplProcessFirstStep(sec,"Beginner",language), ()=>tplProcessSequence(sec,"Advanced",language)];
    let procProduced = 0;
    for(const attempt of procAttempts){
      if(procProduced>=2) break;
      if(tryAdd(attempt())) procProduced++;
    }
  }

  // A small number of comparison questions when two distinct topics both
  // carry real definitional evidence — never fabricated from unrelated
  // topics just to hit a question-type quota.
  let comparisonUsed = 0;
  for(let i=0;i<topics.length && comparisonUsed<2;i++){
    for(let j=i+1;j<topics.length && comparisonUsed<2;j++){
      if(tryAdd(tplComparison(topics[i], evidenceByTopic[i][1], topics[j], evidenceByTopic[j][1], evidenceByTopic, "Intermediate", variant, language))) comparisonUsed++;
    }
  }

  const topicProduced = [];
  topics.forEach((topic, ti)=>{
    const evidence = evidenceByTopic[ti][1];
    const isTech = KNOWN_TECH_TERMS.some(t=>t.toLowerCase()===topic.toLowerCase());
    const heading = evidence[0] ? evidence[0].heading : (structured.sections[0] ? structured.sections[0].heading : null);

    // Ordered list of STRONG, grounded template attempts for this topic,
    // in the required priority order (concept → purpose → scenario →
    // technology fact). Recognition is deliberately NOT in this list —
    // it is never used just to reach the per-topic `need` count. A topic
    // simply contributes fewer questions than its target when the
    // material doesn't support more grounded questions about it (quality
    // over a fixed count). Reassessment reorders this list so it tends
    // to land on a different style than the baseline did.
    let attempts = isTech
      ? [
          ()=>tplPurposeFunction(topic, evidence, evidenceByTopic, true, "Intermediate", variant, language),
          ()=>tplConceptDefinition(topic, evidence, evidenceByTopic, "Intermediate", variant, ti, language),
          ()=>tplScenarioApplication(topic, evidence, evidenceByTopic, "Advanced", variant, language),
          ()=>tplTechFact(topic, heading, techInMaterial, sectionTechMap, "Beginner", language),
        ]
      : [
          ()=>tplConceptDefinition(topic, evidence, evidenceByTopic, "Intermediate", variant, ti, language),
          ()=>tplPurposeFunction(topic, evidence, evidenceByTopic, false, "Intermediate", variant, language),
          ()=>tplScenarioApplication(topic, evidence, evidenceByTopic, "Advanced", variant, language),
        ];
    if(variant==="reassess" && attempts.length>1){
      attempts = [...attempts.slice(offset), ...attempts.slice(0,offset)];
    }

    let produced = 0;
    const need = counts[ti];
    for(const attempt of attempts){
      if(produced>=need) break;
      if(tryAdd(attempt())) produced++;
    }
    topicProduced.push({topic, produced});
  });

  // TRUE LAST RESORT: recognition is only ever used for a topic that
  // ended up with ZERO grounded questions from any stronger template —
  // concept/purpose/scenario/tech-fact from the loop above, AND the
  // earlier process/comparison passes — i.e. the material is genuinely
  // sparse for that topic. It is added at most once per such topic, and
  // it is NEVER used to pad the overall set up toward the ~12 target. If
  // a topic already has grounded coverage (e.g. it was used in a
  // comparison question), this loop does nothing further for it.
  topicProduced.forEach(({topic, produced}, idx)=>{
    if(produced>0) return;
    if(questions.some(q=> q.topic===topic)) return;
    tryAdd(tplRecognition(topic, topics, "Beginner", variant, idx, language));
  });

  // Final safety top-up: only reached if the assessment would otherwise
  // ship with FEWER than the minimum of 5 questions despite the material
  // having enough distinct topics to support recognition-style questions
  // about them. Reuses the same honest recognition template — real topic
  // as the correct answer, real other-topic names as distractors, never
  // fabricated — for topics that already contributed a stronger question,
  // cycling through the phrasing pool so each stays a distinct, valid
  // question rather than colliding as an exact duplicate.
  if(questions.length < 5 && topics.length >= 4){
    let seed = topicProduced.length;
    for(const topic of topics){
      if(questions.length>=5) break;
      if(tryAdd(tplRecognition(topic, topics, "Beginner", variant, seed, language))) seed++;
    }
  }

  // Cap at the maximum of 12: if process/comparison/per-topic generation
  // together produced more than that, trim down by removing extra
  // questions from whichever topic currently has the most, one at a time,
  // so the final set stays spread across topics rather than losing an
  // entire topic's coverage or an entire question type at once.
  while(questions.length > 12){
    const topicCounts = {};
    questions.forEach(q=> topicCounts[q.topic] = (topicCounts[q.topic]||0)+1);
    let worstTopic = null, worstCount = 0;
    Object.entries(topicCounts).forEach(([t,c])=>{ if(c>worstCount){ worstCount=c; worstTopic=t; } });
    let removed = false;
    for(let k=questions.length-1;k>=0;k--){
      if(questions[k].topic===worstTopic){ questions.splice(k,1); removed=true; break; }
    }
    if(!removed) break; // safety valve — should never happen, but never loop forever
  }

  // Honest explanation (never silently shown as if 8-12 were always
  // achievable): if the material genuinely doesn't support at least 5
  // grounded questions without fabricating content, say so plainly rather
  // than padding. Attached as a plain property on the returned array so
  // existing callers that treat this as a bare question list are
  // unaffected — only the upload flow reads this to inform the learner.
  if(questions.length < 5){
    questions.generationNote = questions.length
      ? qgt(language,"genNotePartial",questions.length)
      : qgt(language,"genNoteZero");
  }

  // Internal generation diagnostics — never rendered as raw JSON to the
  // learner, but attached to the returned array (like generationNote
  // above) so the upload flow / admin views can report honestly on how
  // the assessment was actually built instead of just a bare count.
  const topicsCovered = new Set(questions.map(q=>q.topic));
  questions.generatedCount = questions.length;
  questions.usableEvidenceCount = units.length;
  questions.topicCoverage = { coveredTopics: topicsCovered.size, totalTopics: topics.length,
    topics: topics.map(t=>({topic:t, questions: questions.filter(q=>q.topic===t).length})) };

  return questions;
}

/* ============================= DYNAMIC RESOURCE CATALOG (NORMAL USER MODE) =============================
   For a demo session, the fixed iGOT-aligned Data Analysis catalog
   (RESOURCE_DEFS) is used unchanged. For a real learner, the catalog is
   generated from THEIR extracted topics — honestly labelled as a prototype
   catalog rather than a fabricated live iGOT feed (no invented URLs).
*/
const RESOURCE_TYPE_CYCLE = ["Course","Practice Module","Learning Resource"];
const RESOURCE_DURATION_CYCLE = ["30 min","45 min","1h 00m","55 min","20 min","1h 15m"];

/* ============================= PERSONALIZED LEARNING PATH (NORMAL USER MODE) =============================
   Competency Gap -> Subtopics -> Ordered Learning Path -> Resource per
   subtopic -> Topic-specific Learning Session (see buildSubtopicLearningContent
   below) -> Completion -> Re-assessment -> Updated Competency -> Next
   Recommendation. Everything here is derived fresh from session state on
   every call (never cached/fabricated), so it automatically adapts the
   moment competencyScores/reassessScores/learningHistory change.
   Subtopics are derived from the learner's ACTUAL uploaded material
   wherever real evidence exists (buildStructuredContent scoped to the
   sections that actually relate to the competency); only when there isn't
   enough real evidence do we fall back to a small, clearly-labelled set of
   "AI-inferred foundational subtopics" (FOUNDATIONAL_SUBTOPIC_ANGLES) —
   never presented as if they were found in the document. */
// `suffix` feeds the subtopic's `title`/identity (used as a lookup key for
// learning history and resource matching) and is NEVER translated here —
// only `desc`'s rendered text is, via `gt()`, keyed by language.
const FOUNDATIONAL_SUBTOPIC_ANGLES = [
  {suffix:"Core Concepts", genKey:"angleCoreConcepts"},
  {suffix:"Practical Application", genKey:"anglePracticalApplication"},
  {suffix:"Common Pitfalls", genKey:"angleCommonPitfalls"},
  {suffix:"Key Terminology", genKey:"angleKeyTerminology"},
];
function slugifyId(s){
  return (s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40) || "topic";
}
// Sections of the uploaded material that genuinely relate to a competency —
// matched against heading, detected concepts/technologies, and raw
// bullet/body text, never assumed.
// A small, honest topic -> competency label map. Only fires for confident,
// well-known technical families (e.g. "CPU" -> "Computer Architecture
// Fundamentals") — never invents an unrelated competency name. When no
// confident mapping exists, the topic itself remains the competency, exactly
// as required. This is a DISPLAY-ONLY label (Learning Map / mapping view);
// it never changes the internal keys used by scoring, gap-detection or the
// resource catalog, so it can't affect assessment or competency math.
const COMPETENCY_FAMILY_MAP = [
  {test:/\bcpu\b|\bprocessor\b|\balu\b|control unit|\bregisters?\b/i, label:"Computer Architecture Fundamentals"},
  {test:/\bram\b|\brom\b|\bmemory\b|\bcache\b/i, label:"Computer Memory Systems"},
  {test:/operating system|\bkernel\b/i, label:"Operating Systems Fundamentals"},
  {test:/network|protocol|\btcp\b|\bip\b\W|router/i, label:"Computer Networking Fundamentals"},
  {test:/database|\bsql\b|\bdbms\b/i, label:"Database Fundamentals"},
  {test:/python|\bjava\b|javascript|programming|algorithm|data structure/i, label:"Programming Fundamentals"},
  {test:/machine learning|deep learning|neural network|artificial intelligence/i, label:"AI & Machine Learning Fundamentals"},
  {test:/statistic|regression|probability/i, label:"Statistical Analysis"},
  {test:/data cleaning|data visualization|data analysis|pandas|dataframe/i, label:"Data Analysis"},
  {test:/security|encryption|\bcyber/i, label:"Information Security Fundamentals"},
];
function competencyLabelFor(topic){
  const found = COMPETENCY_FAMILY_MAP.find(f=>f.test.test(topic||""));
  return found ? found.label : topic;
}
function sectionsForCompetency(structured, name){
  const t = (name||"").toLowerCase();
  const words = t.split(/\s+/).filter(w=>w.length>=4);
  const matches = (s)=>{
    const hay = [s.heading, ...(s.concepts||[]), ...(s.technologies||[]), ...s.bullets, s.content||""].join(" ").toLowerCase();
    if(hay.includes(t)) return true;
    return words.some(w=>hay.includes(w));
  };
  return (structured.sections||[]).filter(matches);
}
// Builds 3-8 real subtopic candidates for one competency from the sections
// of the uploaded material that relate to it, falling back to clearly
// labelled AI-inferred subtopics only when there isn't enough real evidence.
function generateSubtopicsForCompetency(name, structured, minSub, maxSub, language){
  minSub = minSub||3; maxSub = maxSub||8;
  const related = sectionsForCompetency(structured, name);
  const candidates = [];
  const seenTitles = new Set([name.toLowerCase()]);
  const pushCandidate = (title, description, evidence)=>{
    title = (title||"").trim();
    if(!title) return;
    const key = title.toLowerCase();
    if(seenTitles.has(key)) return;
    seenTitles.add(key);
    candidates.push({title, description, evidence: evidence||null, inferred:false});
  };
  related.forEach(sec=>{
    // A related section whose own heading is a distinct, specific idea —
    // the strongest kind of subtopic evidence.
    const headingCand = headingToTopicCandidate(sec.heading);
    if(headingCand && headingCand.toLowerCase()!==name.toLowerCase()){
      const evidence = sec.bullets[0] || (sec.content||"").split(/(?<=[.?!])\s+/)[0] || "";
      pushCandidate(headingCand, gt(language,"subtopicDescHeading",sec.heading), evidence);
    }
    // Concept phrases found within a related section — real named ideas
    // from the learner's own document, not the competency name repeated.
    (sec.concepts||[]).forEach(c=>{
      if(c.toLowerCase()===name.toLowerCase()) return;
      const evidence = sec.bullets.find(b=>b.toLowerCase().includes(c.toLowerCase()))
        || (sec.content||"").split(/(?<=[.?!])\s+/).find(s=>s.toLowerCase().includes(c.toLowerCase())) || "";
      pushCandidate(c, gt(language,"subtopicDescConcept",sec.heading), evidence);
    });
    // Technology terms mentioned inside a related section.
    (sec.technologies||[]).forEach(tech=>{
      if(tech.toLowerCase()===name.toLowerCase()) return;
      pushCandidate(tech, gt(language,"subtopicDescTech",sec.heading), sec.bullets[0]||"");
    });
  });
  // Real evidence-backed candidates first; among those, more substantive
  // evidence (longer) first — a simple, honest proxy for how much the
  // material actually covers a given candidate.
  candidates.sort((a,b)=> (b.evidence||"").length - (a.evidence||"").length);
  const out = candidates.slice(0, maxSub);
  if(out.length < minSub){
    const need = minSub - out.length;
    FOUNDATIONAL_SUBTOPIC_ANGLES.slice(0, need).forEach(a=>{
      const title = `${name} — ${a.suffix}`;
      if(seenTitles.has(title.toLowerCase())) return;
      seenTitles.add(title.toLowerCase());
      out.push({title, description:gt(language,a.genKey,name), evidence:null, inferred:true});
    });
  }
  return out.map((c,i)=>({
    id: slugifyId(name)+"-"+(i+1),
    title:c.title,
    description:c.description,
    order:i+1,
    evidence: c.evidence ? truncateText(c.evidence.trim(), 220) : null,
    inferred: c.inferred,
  }));
}

// Builds the full personalized learning path: one entry per active
// competency, each with real (or clearly AI-inferred) ordered subtopics.
// Demo sessions keep using the fixed DEMO_BASELINE/MY_LEARNING_DEMO
// fixtures untouched — this only ever runs for a real learner.
function buildLearningPaths(session, language){
  if(!session || session.isDemo) return [];
  const comp = computeCompetencyView(session);
  if(!comp.ready || !session.uploadedMaterial || !session.uploadedMaterial.text) return [];
  const structured = buildStructuredContent(session.uploadedMaterial.text);
  const historyMap = learningHistoryMapOf(session);
  return comp.list.map(row=>{
    const g = gapPriority(row.name, row.before);
    const subtopics = generateSubtopicsForCompetency(row.name, structured, undefined, undefined, language).map(s=>{
      const h = historyMap[s.title];
      const status = h ? h.status : "not_started";
      return {...s, status, progress: h ? (h.progress||0) : 0, resourceTitle: s.title};
    });
    // Sequential unlock within a competency: completed subtopics stay
    // completed regardless of order; the first not-yet-done one is "next";
    // later ones stay "locked" until it's done — this is what makes the
    // recommended next subtopic adapt as resources are completed.
    let nextAssigned = false;
    subtopics.forEach(s=>{
      if(s.status==="completed") return;
      if(s.status==="in_progress"){ nextAssigned = true; return; }
      if(!nextAssigned){ s.status = "next"; nextAssigned = true; }
      else s.status = "locked";
    });
    return {
      competency: row.name, currentScore: row.before, targetScore: row.target,
      gap: Math.max(0, row.target-row.before), priority: g.label,
      recommendationScore: g.recommendationScore, subtopics,
    };
  }).sort((a,b)=> b.recommendationScore - a.recommendationScore);
}

/* ---- Resource provider architecture ----
   igotProvider: there is no authorized live iGOT API in this prototype, so
   this always returns null. It exists as the seam a real integration would
   replace — never a source of fabricated iGOT links/courses.
   trustedResourceProvider: the ONLY source of a real external URL — a
   small fixed table of genuinely existing official docs (see
   KNOWN_TECH_RESOURCE_URLS / trustedUrlForTopic). Never invents a URL.
   prototypeResourceProvider: the default — an honest in-app guided lesson
   with no external link. */
function igotProvider(){ return null; }
function trustedResourceProvider(subtopicTitle, competency){
  const url = trustedUrlForTopic(subtopicTitle) || trustedUrlForTopic(competency);
  return url ? {url, label:"Open source"} : null;
}
function prototypeResourceProvider(){ return {url:null, label:"Start guided lesson"}; }

// ---- Resource source labeling (exactly three honest categories, used
// everywhere a resource's source is shown to the learner) ----
// LIVE iGOT: only ever true if a real, authorized iGOT Karmayogi API call
// actually returned this resource (see igotProvider() above). igotProvider()
// always returns null in this prototype (no authorized live access), so this
// label is never shown right now — it exists so a real integration only has
// to set r.igotLive = true on a resource to surface it honestly.
// VERIFIED EXTERNAL: the resource is backed by a real, already-existing
// external URL (trustedResourceProvider / KNOWN_TECH_RESOURCE_URLS) — never
// a fabricated/guessed link.
// KARMSETU GUIDED LESSON: the honest default — an in-app KarmSetu lesson,
// no external link, no iGOT claim.
function resourceSourceMeta(r){
  if(r && r.igotLive) return {label:"LIVE iGOT", badgeClass:"badge-igot", access:"Open in iGOT Karmayogi"};
  // YouTube (verified video, then honest search fallback) is the preferred
  // prototype learning source whenever there's no live iGOT resource — see
  // the PRIORITY note above buildResourceDefsForSession. It is checked
  // before externalUrl so it's never hidden behind a generic label.
  if(r && r.youtube) return {label:"LEARNING RESOURCE", badgeClass:"badge-youtube", access: r.youtube.kind==="video" ? "Watch Video" : "Search on YouTube"};
  if(r && r.externalUrl) return {label:"VERIFIED EXTERNAL", badgeClass:"badge-external", access:"Open Resource"};
  return {label:"KARMSETU GUIDED LESSON", badgeClass:"badge-guided", access:"Start Guided Lesson"};
}

/* ---- YouTube prototype resource layer ----
   Live iGOT access is not available, so every recommended topic/subtopic
   gets a YouTube-based prototype resource instead — never a fake iGOT URL.
   Two tiers, both honest:
   1) YOUTUBE_VERIFIED_LIBRARY: a small, hand-verified table of real,
      well-known educational videos (title/channel/duration all genuine),
      matched to a topic/competency by keyword — never guessed IDs.
   2) A dynamic YouTube SEARCH deep link built from the learner's actual
      extracted topic/subtopic text, for every topic that isn't in the
      small curated table — this is what makes the system work for ANY
      dynamically extracted subject (Java, HR, medicine, etc.), not just
      the data-analysis demo content, without ever fabricating a specific
      video that may not exist or may not match.
   This whole layer sits in the exact spot a live iGOT integration would
   later occupy (see resourceSourceMeta) — swapping igotProvider() to
   return real data is the only change a live integration would need. */

// Keyword match only — never a guess. Order matters: more specific
// keywords are checked first so a topic isn't mis-matched to a nearby one.
function pickVerifiedYoutubeVideo(subtopicTitle, competency){
  const hay = ((subtopicTitle||"")+" "+(competency||"")).toLowerCase();
  if(/pandas|data clean/.test(hay)) return null; // no verified match yet — honest search fallback below
  if(/statistic/.test(hay)) return YOUTUBE_VERIFIED_LIBRARY.statistics;
  if(/machine learning/.test(hay)) return YOUTUBE_VERIFIED_LIBRARY.machineLearning;
  if(/python/.test(hay)) return YOUTUBE_VERIFIED_LIBRARY.python;
  return null;
}
function youtubeResourceProvider(subtopicTitle, competency){
  const v = pickVerifiedYoutubeVideo(subtopicTitle, competency);
  if(v){
    return {
      kind:"video",
      videoId:v.videoId,
      url:"https://www.youtube.com/watch?v="+v.videoId,
      embedUrl:"https://www.youtube.com/embed/"+v.videoId,
      title:v.title, channel:v.channel, level:v.level, duration:v.duration,
      description:v.description,
      topicLabel: subtopicTitle || competency,
    };
  }
  // Honest fallback for any topic/subtopic without a hand-verified match —
  // a real, working YouTube search built from the learner's actual topic
  // text, never a fabricated or unrelated video.
  const q = [subtopicTitle, competency, "tutorial"].filter(Boolean).join(" ");
  return {
    kind:"search",
    videoId:null,
    url:"https://www.youtube.com/results?search_query="+encodeURIComponent(q),
    embedUrl:null,
    title:`Search YouTube: "${subtopicTitle || competency}"`,
    channel:null, level:null, duration:null,
    description:`No hand-verified video is queued for this exact topic yet, so this opens a live YouTube search for "${subtopicTitle || competency}" so you can pick the best current match yourself.`,
    topicLabel: subtopicTitle || competency,
  };
}

// Builds one real resource object per subtopic: title = the subtopic
// itself, never "<competency> — Foundations". Provider order (PRIORITY):
// igotProvider (currently always null — no live access) -> YouTube verified
// video -> YouTube topic search fallback -> trustedResourceProvider (a real
// external doc, only if one genuinely exists) -> prototypeResourceProvider
// (an in-app guided lesson with no external link, used only if even the
// YouTube layer somehow returns nothing). YouTube is deliberately preferred
// over a generic "verified external" doc so the learner always has a real,
// watchable video (or an honest live search) as the default learning
// source — never a fake iGOT link, and never YouTube mislabeled as iGOT.
function buildResourceDefsForSession(session){
  if(!session || session.isDemo){
    return RESOURCE_DEFS.map(r=>({...r, youtube: youtubeResourceProvider(r.title, r.competency)}));
  }
  // This catalog is cached on the module-level LEARNER object by
  // applySessionToLearner() (not a React component), so it has no live
  // `language` from a hook — it reads whatever language is currently active
  // via loadLanguage() at the moment the session is (re)applied, the same
  // "baked at generation time" pattern already used for generated
  // assessment questions (see UploadPage.analyze).
  const language = loadLanguage();
  const paths = buildLearningPaths(session, language);
  if(!paths.length) return [];
  const defs = [];
  let i = 0;
  paths.forEach(p=>{
    p.subtopics.forEach(s=>{
      // youtubeResourceProvider always returns something (a verified video
      // or an honest search fallback), so it wins whenever there's no live
      // iGOT resource. trustedResourceProvider / prototypeResourceProvider
      // remain as the fallback chain for the rare case the YouTube layer
      // itself returns nothing — existing fallback behavior is preserved.
      const youtube = igotProvider() ? null : youtubeResourceProvider(s.title, p.competency);
      const provider = igotProvider()
        || (youtube ? {url:null, label: youtube.kind==="video" ? "Watch Video" : "Search on YouTube"} : null)
        || trustedResourceProvider(s.title, p.competency)
        || prototypeResourceProvider();
      defs.push({
        id: s.id,
        title: s.title,
        subtopic: s.title,
        subtopicId: s.id,
        subtopicOrder: s.order,
        description: s.description,
        competency: p.competency,
        topic: p.competency,
        source: "Prototype Resource Catalog",
        provider: provider.url ? "External (verified)" : "KarmSetu",
        igotAligned: false, // honest: no live iGOT feed in this prototype
        externalUrl: provider.url,
        accessLabel: provider.label,
        youtube,
        type: RESOURCE_TYPE_CYCLE[i % RESOURCE_TYPE_CYCLE.length],
        difficulty: ["Beginner","Intermediate","Advanced"][i % 3],
        duration: RESOURCE_DURATION_CYCLE[i % RESOURCE_DURATION_CYCLE.length],
        alreadyCompleted: false,
        inferred: s.inferred,
        evidence: s.evidence,
        // Sequential-unlock state from buildLearningPaths — "completed" |
        // "in_progress" | "next" | "locked". This is the single source of
        // truth every page (My Learning, Recommendations, Dashboard,
        // Learning Session) uses to decide whether a subtopic can be
        // started, never a page-local guess.
        pathStatus: s.status,
        pathProgress: s.progress,
        pathCompetencyCurrent: p.currentScore,
        pathCompetencyTarget: p.targetScore,
        pathCompetencyGap: p.gap,
        pathPriority: p.priority,
        pathRecommendationScore: p.recommendationScore,
      });
      i++;
    });
  });
  return defs;
}

// Turns a normal-user (subtopic-based) resource + the learner's real
// competency/goal/gap data into topic-specific learning session content —
// never the fixed RESOURCE_CONTENT fixture, and never the same generic
// "Overview -> Key Concepts -> Applying It" for every resource. Uses the
// subtopic's own real evidence from the uploaded material when it exists;
// otherwise says so honestly rather than fabricating a quotation.
function buildSubtopicLearningContent(resource, language){
  const competency = resource.competency;
  const subtopic = resource.subtopic || resource.title;
  const byName = {};
  (LEARNER.competency && LEARNER.competency.list || []).forEach(l=>{ byName[l.name]=l.before; });
  const g = gapPriority(competency, byName[competency]);
  const goal = LEARNER.goal || "your learning goal";
  // resource.evidence is a raw sentence/bullet lifted verbatim from the
  // learner's uploaded material — an "evidence phrase" surfaced as
  // generated explanation/example content, so it goes through the same
  // centralized translateEvidenceText() helper as question options before
  // being shown, for hi/hinglish. In English it's a pure passthrough.
  const fromMaterial = resource.evidence
    ? {found:true, text: translateEvidenceText(resource.evidence, language)}
    : {found:false, text: gt(language,"noEvidenceInferredText")};
  const objectives = [
    gt(language,"objective1",subtopic,competency),
    gt(language,"objective2",subtopic),
    gt(language,"objective3",subtopic),
  ];
  const sections = [
    {title:gt(language,"sectionConcept"), body: (resource.inferred
      ? gt(language,"conceptInferred",subtopic,competency)
      : gt(language,"conceptMaterial",subtopic,competency)) + (resource.description ? " "+resource.description : "")},
    {title:gt(language,"sectionExplanation"), body: fromMaterial.found
      ? `${gt(language,"explanationFound",subtopic)} ${fromMaterial.text}`
      : gt(language,"explanationNotFound",competency)},
    {title:gt(language,"sectionExample"), body: fromMaterial.text},
    {title:gt(language,"sectionCommonMistake"), body:gt(language,"commonMistake",subtopic,competency)},
    {title:gt(language,"sectionPracticalApplication"), body:gt(language,"practicalApplication",subtopic,goal,g.gapScore,g.before,g.target,competency)},
    {title:gt(language,"sectionQuickTakeaway"), body:gt(language,"quickTakeaway",subtopic,competency)},
  ];
  return {
    objectives, sections,
    whyLearning: gt(language,"whyLearning",competency,g.before,g.target),
    fromMaterial,
  };
}

// Maps a status CSS class to its common.* translation key — shared by
// statusOf() (for embedding the label in generated sentences) and
// StatusBadge (for the on-screen badge), so both stay in sync.
const STATUS_LABEL_KEYS = {green:"common.statusProficient", yellow:"common.statusDeveloping", orange:"common.statusNeedsImprovement", red:"common.statusCriticalGap"};
// Thresholds and CSS classes are unchanged; the label is now looked up in
// `language` (defaulting to English for the many call sites that only use
// `.cls` for coloring and never read `.label`). Uses TRANSLATIONS directly
// (via getPath) rather than the t() hook, since statusOf() is also called
// from plain data-building functions (buildResources/buildMyLearning)
// outside any component.
function statusOf(v, language="en"){
  let cls;
  if(v>=80) cls="green";
  else if(v>=60) cls="yellow";
  else if(v>=40) cls="orange";
  else cls="red";
  const key = STATUS_LABEL_KEYS[cls];
  let label = getPath(TRANSLATIONS[language]||TRANSLATIONS.en, key);
  if(label===undefined) label = getPath(TRANSLATIONS.en, key);
  return {label, cls};
}

// Evaluates a learner's selected answers against the answer key, and
// calculates both an overall score and a per-topic (= per-competency)
// breakdown. Unanswered questions are scored as incorrect.
function scoreAssessment(questions, answers){
  const topicStats = {};
  let correctCount = 0;
  questions.forEach((q,i)=>{
    const isCorrect = answers[i] === q.answer;
    if(isCorrect) correctCount++;
    if(!topicStats[q.topic]) topicStats[q.topic] = {correct:0, total:0};
    topicStats[q.topic].total++;
    if(isCorrect) topicStats[q.topic].correct++;
  });
  const topicScores = {};
  Object.keys(topicStats).forEach(topic=>{
    const t = topicStats[topic];
    topicScores[topic] = Math.round((t.correct/t.total)*100);
  });
  const overallScore = Math.round((correctCount/questions.length)*100);
  const answeredCount = Object.keys(answers).length;
  return {overallScore, topicScores, topicStats, correctCount, totalCount:questions.length, answeredCount};
}

/* ---- Learning history (Not Started / In Progress / Completed) ----
   Stored on the session as session.learningHistory: { [resourceTitle]: {
     competency, status: "in_progress"|"completed", progress (0-100),
     startedAt, completedAt, beforeScore (competency score when started)
   }}. This is real, persisted state — not a static fixture — and feeds
   both "My Learning" and the gap-priority engine's learning-history signal. */
function learningHistoryMapOf(session){
  return (session && session.learningHistory) || {};
}
// Converts a learner's real per-resource history into the 0-1 "learning
// history" signal gapPriority() expects for a given competency. Returns
// null (not 0) when there is no real history yet, so callers can fall back
// to the static prototype default instead of wrongly reporting "0% covered".
function learningHistoryScoreFor(name, historyMap){
  const entries = Object.values(historyMap||{}).filter(h=>h.competency===name);
  if(!entries.length) return null;
  const completed = entries.filter(h=>h.status==="completed").length;
  const inProgress = entries.filter(h=>h.status==="in_progress").length;
  return Math.max(0, Math.min(1, (completed + inProgress*0.5)/entries.length));
}
// Persists a new/updated learning-history entry onto the session (and, for a
// real account, onto the stored account too) via the existing applySession
// pipeline, so "start" and "complete" actions genuinely change state instead
// of only firing a toast.
function writeLearningHistory(session, applySession, nextHistory){
  const nextSession = {...(session||{}), learningHistory: nextHistory};
  if(applySession) applySession(nextSession);
  if(nextSession.email) updateAccountFields(nextSession.email, {learningHistory: nextHistory});
  return nextSession;
}
function startResource(session, applySession, notify, resource, currentScore, t){
  const history = {...learningHistoryMapOf(session)};
  const existing = history[resource.title];
  if(existing && existing.status!=="not_started"){
    notify(existing.status==="completed"
      ? (t ? t("learning.alreadyCompletedNotify",{title:resource.title}) : "Already completed: "+resource.title)
      : (t ? t("learning.alreadyInProgressNotify",{title:resource.title}) : "Already in progress: "+resource.title));
    return;
  }
  history[resource.title] = {
    resourceId: resource.id || null, resourceTitle: resource.title,
    competency: resource.competency, topic: resource.topic || resource.competency,
    subtopicId: resource.subtopicId || null, subtopic: resource.subtopic || resource.title,
    status:"in_progress", progress:20,
    startedAt: new Date().toISOString(),
    beforeScore: typeof currentScore==="number" ? currentScore : null,
  };
  writeLearningHistory(session, applySession, history);
  notify(t ? t("learning.startedHistoryNotify",{title:resource.title}) : "Started: "+resource.title+" — this now counts toward your learning history.");
}
function advanceResource(session, applySession, notify, resource, t){
  const history = {...learningHistoryMapOf(session)};
  const entry = history[resource.title] || {competency:resource.competency, status:"in_progress", progress:0, startedAt:new Date().toISOString(), beforeScore:null};
  const nextProgress = Math.min(100, (entry.progress||0)+25);
  const completed = nextProgress>=100;
  history[resource.title] = {...entry, progress:nextProgress, status: completed?"completed":"in_progress", completedAt: completed ? new Date().toISOString() : entry.completedAt};
  // Completing a resource is qualifying learning activity for the real,
  // session-based streak (see computeStreak/activityPatch) — merely making
  // progress on one is not.
  const streakPatch = completed ? activityPatch(session) : {};
  const nextSession = {...(session||{}), learningHistory: history, ...streakPatch};
  if(applySession) applySession(nextSession);
  if(nextSession.email) updateAccountFields(nextSession.email, {learningHistory: history, ...streakPatch});
  notify(completed
    ? (t ? t("learning.completedRankingNotify",{title:resource.title}) : "Completed: "+resource.title+" — this will factor into your next recommendation ranking.")
    : (t ? t("learning.progressSavedNotify",{title:resource.title,progress:nextProgress}) : "Progress saved: "+resource.title+" ("+nextProgress+"%)"));
}

// Progress is written directly from how far the learner has actually moved
// through the resource's content (see LearningSessionView), not a fixed
// +25% per click. Capped below 100 so "Mark as Completed" is a distinct,
// explicit action rather than something that happens automatically.
function setResourceProgress(session, applySession, resource, progress){
  const history = {...learningHistoryMapOf(session)};
  const existing = history[resource.title];
  if(existing && existing.status==="completed") return; // never downgrade a completed resource
  const base = existing || {
    resourceId: resource.id || null, resourceTitle: resource.title,
    competency:resource.competency, topic: resource.topic || resource.competency,
    subtopicId: resource.subtopicId || null, subtopic: resource.subtopic || resource.title,
    status:"in_progress", progress:0, startedAt:new Date().toISOString(), beforeScore:null,
  };
  history[resource.title] = {...base, status:"in_progress", progress:Math.max(base.progress||0, Math.min(95, progress))};

}
// After persisting a completion, works out the next subtopic that just
// unlocked (if any) under the SAME competency, purely by recomputing the
// personalized path against the updated history — never guessed/hardcoded.
function nextUnlockedAfterCompletion(session, resource){
  if(!session || session.isDemo) return null;
  const paths = buildLearningPaths(session);
  const path = paths.find(p=>p.competency===resource.competency);
  if(!path) return null;
  const nextSub = path.subtopics.find(s=>s.status==="next");
  return nextSub ? nextSub.title : null;
}
function completeResourceNow(session, applySession, notify, resource, t){
  const history = {...learningHistoryMapOf(session)};
  const existing = history[resource.title] || {
    resourceId: resource.id || null, resourceTitle: resource.title,
    competency:resource.competency, topic: resource.topic || resource.competency,
    subtopicId: resource.subtopicId || null, subtopic: resource.subtopic || resource.title,
    status:"in_progress", progress:0, startedAt:new Date().toISOString(), beforeScore:null,
  };
  // Guard: a resource already completed never re-triggers module/daily/
  // streak XP — this is the module-completion half of duplicate protection
  // (the other half is the dedupe key check inside applyXPPatches itself).
  const alreadyCompleted = existing.status==="completed";
  history[resource.title] = {...existing, progress:100, status:"completed", completedAt:new Date().toISOString()};
  // Completing a resource/module is qualifying learning activity for the
  // real, session-based streak.
  const streakPatch = alreadyCompleted ? {} : activityPatch(session);
  let nextSession = {...(session||{}), learningHistory: history, ...streakPatch};
  // XP: +100 for the module itself (keyed per resource — never re-awarded
  // for the same resource), +20 for today's qualifying activity (keyed per
  // calendar day), plus any newly-reached streak milestone. All ride along
  // on this same single session write.
  let awardedEntries = null;
  if(!alreadyCompleted){
    const candidates = [
      {type:"module_complete", key:"module_"+(resource.id || resource.title)},
      dailyActivityCandidate(),
      ...streakMilestoneCandidates(nextSession.streak),
    ];
    const xp = applyXPPatches(nextSession, candidates);
    if(xp){ nextSession = {...nextSession, rewards: xp.rewards}; awardedEntries = xp.awardedEntries; }
  }
  // Recompute the unlocked-next subtopic BEFORE applying, since
  // nextUnlockedAfterCompletion reads session.learningHistory.
  const nextTitle = nextUnlockedAfterCompletion(nextSession, resource);
  if(applySession) applySession(nextSession);
  if(nextSession.email) updateAccountFields(nextSession.email, {learningHistory: history, ...streakPatch, ...(awardedEntries ? {rewards: nextSession.rewards} : {})});
  notify(nextTitle
    ? (t ? t("learning.completedUnlockedNotify",{title:resource.title,nextTitle:nextTitle}) : `Completed: ${resource.title}. ${nextTitle} is now unlocked.`)
    : (t ? t("learning.completedRankingNotify",{title:resource.title}) : "Completed: "+resource.title+" — this will factor into your next recommendation ranking."));
  if(awardedEntries && t) notify(xpToastMessage(t, awardedEntries));
}
// Compares each completed resource's "before" score (captured when the
// learner started it) against the learner's latest re-assessment score for
// that same competency, to show Resource → Competency → Before → After →
// Improvement. Prototype/demo logic, not a validated causal claim.
function computeResourceEffectiveness(session){
  const history = learningHistoryMapOf(session);
  const reassess = (session && session.reassessScores) || null;
  if(!reassess) return [];
  const list = [];
  Object.entries(history).forEach(([title,h])=>{
    if(h.status==="completed" && typeof h.beforeScore==="number" && typeof reassess[h.competency]==="number"){
      const after = reassess[h.competency];
      const improvement = after - h.beforeScore;
      list.push({resource:title, competency:h.competency, before:h.beforeScore, after, improvement, ...effectivenessOf(improvement)});
    }
  });
  return list;
}

function gapPriority(name, beforeOverride, language){
  const b = DEMO_BASELINE.find(x=>x.name===name);
  const before = typeof beforeOverride === "number" ? beforeOverride : (b ? b.before : 0);
  const target = Math.min(95, before+45);
  const gapScore = Math.max(0, target-before);
  const severity = Math.min(1, gapScore/100);
  const cfg = GAP_ENGINE[name] || {topicImportance:0.7, goalRelevance:0.7, learningHistory:0.5, evidence:["No detailed evidence recorded for this competency yet."],
    evidenceByLang:{
      en:["No detailed evidence recorded for this competency yet."],
      hi:["इस दक्षता के लिए अभी तक कोई विस्तृत प्रमाण दर्ज नहीं किया गया है।"],
      hinglish:["Is competency ke liye abhi tak koi detailed evidence record nahi kiya gaya hai."],
    }};
  // Learning history is a REAL signal when the active learner has actual
  // tracked history for this competency (LEARNER.learningHistory, written by
  // startResource/advanceResource) — only falls back to the static
  // prototype default (cfg.learningHistory) when there's no real data yet,
  // e.g. a demo session that hasn't interacted with any resource.
  const realHistoryScore = learningHistoryScoreFor(name, LEARNER.learningHistory);
  const learningHistory = typeof realHistoryScore === "number" ? realHistoryScore : cfg.learningHistory;
  const score = severity*0.55 + cfg.topicImportance*0.20 + cfg.goalRelevance*0.20 + (1-learningHistory)*0.05;
  let label = "LOW";
  if(score>=0.65) label="CRITICAL"; else if(score>=0.45) label="HIGH"; else if(score>=0.28) label="MEDIUM";
  const recommendationScore = Math.max(30, Math.min(99, Math.round(30+70*score)));

  // Explainable evidence: when the active learner has a real per-topic
  // assessment breakdown (LEARNER.topicStats, from scoreAssessment on their
  // actual answers), build genuine evidence from it instead of the static
  // demo bullets — covering the four required categories: questions
  // answered incorrectly, concepts not demonstrated, prior learning
  // evidence, and remaining gap.
  const stat = LEARNER.topicStats && LEARNER.topicStats[name];
  let evidence;
  if(stat){
    // This branch is REAL, per-learner evidence derived from the learner's
    // actual assessment answers and learning history (never the static
    // GAP_ENGINE demo bullets below), so — unlike those fixed demo bullets —
    // it is localized via gt(). Competency/resource-title names stay raw
    // (identifiers, not translated) exactly like everywhere else.
    evidence = [];
    const wrong = stat.total - stat.correct;
    evidence.push(wrong>0
      ? gt(language,"evidenceWrong",wrong,stat.total,name)
      : gt(language,"evidenceAllCorrect",stat.total,name));
    evidence.push(wrong>0
      ? gt(language,"evidenceConceptsNotDemo",name)
      : gt(language,"evidenceConceptsDemo",name));
    const historyEntries = Object.entries(LEARNER.learningHistory||{}).filter(([,h])=>h.competency===name);
    const completedTitles = historyEntries.filter(([,h])=>h.status==="completed").map(([t])=>t);
    const inProgTitles = historyEntries.filter(([,h])=>h.status==="in_progress").map(([t])=>t);
    if(completedTitles.length) evidence.push(gt(language,"evidenceCompleted",completedTitles.join(", ")));
    if(inProgTitles.length) evidence.push(gt(language,"evidenceInProgress",inProgTitles.join(", ")));
    if(!completedTitles.length && !inProgTitles.length) evidence.push(gt(language,"evidenceNoResourceYet"));
    evidence.push(gt(language,"evidenceRemainingGap",before,target,gapScore));
  } else {
    // Static demo evidence (before any real per-answer breakdown exists) —
    // pick the hand-written bullets for the current language, same pattern
    // as QUESTIONS_INITIAL/QUESTIONS_REASSESS's qByLang/optionsByLang, so
    // this "why this priority" feedback switches immediately with the
    // learner's selected language rather than staying fixed in English.
    const byLang = cfg.evidenceByLang || {en: cfg.evidence};
    evidence = byLang[language] || byLang.en || cfg.evidence;
  }
  return {name, before, target, gapScore, severity, score, label, recommendationScore, ...cfg, learningHistory, evidence};
}
