// Ranks the resource catalog using the existing gap-priority architecture
// (gapPriority) against the given competency view (see computeCompetencyView).
function buildResources(comp, language){
  const byName = {};
  (comp.list||[]).forEach(l=>{ byName[l.name] = l.before; });
  return (LEARNER.resourceDefs||[]).map(r=>{
    const g = gapPriority(r.competency, byName[r.competency], language);
    const status = statusOf(g.before, language);
    const learnerStatus = LEARNER.learningHistory && LEARNER.learningHistory[r.title]
      ? LEARNER.learningHistory[r.title].status
      : (r.pathStatus || "not_started");
    const stepPhrase = r.pathStatus==="next" ? gt(language,"pathStepNext") : r.pathStatus==="locked" ? gt(language,"pathStepLocked") : gt(language,"pathStepCurrent");
    const subtopicLine = r.subtopic && r.subtopic!==r.competency
      ? gt(language,"subtopicPathLine", r.subtopic, stepPhrase, r.competency)
      : null;
    const evidenceLine = r.inferred
      ? gt(language,"resourceInferredSubtopic")
      : (r.evidence ? gt(language,"resourceIdentifiedFromMaterial") : null);
    const reason = gt(language,"recommendedBecauseScore", r.competency, g.before, status.label, g.target);
    return {...r, recommendationScore:g.recommendationScore, priority:g.label, learnerStatus, reason, factors:[
      gt(language,"factorGapSeverity", Math.round(g.severity*100), g.before, g.target),
      gt(language,"factorGoalRelevance", Math.round(g.goalRelevance*100), LEARNER.goal),
      gt(language,"factorTopicImportance", Math.round(g.topicImportance*100)),
      g.learningHistory<0.4 ? gt(language,"factorNoResourceYet") : gt(language,"factorBuildsOnStarted"),
      ...(subtopicLine ? [subtopicLine] : []),
      ...(evidenceLine ? [evidenceLine] : []),
    ]};
  });
}
// Ranking used by Recommendations/Dashboard: highest gap/goal/topic/coverage
// score wins as before, but a locked subtopic is never allowed to surface as
// the top pick or an immediate next action — it always sorts after every
// startable (not_started/next/in_progress) resource, regardless of score.
function compareRecommendations(a,b){
  const rank = s => s==="locked" ? 2 : s==="completed" ? 1 : 0;
  const ra = rank(a.learnerStatus), rb = rank(b.learnerStatus);
  if(ra!==rb) return ra-rb;
  return b.recommendationScore - a.recommendationScore;
}

// Learner-facing display cap: the recommendation ENGINE itself (buildResources
// + gapPriority) is untouched and still computes every valid recommendation —
// this constant only limits how many of the already-ranked results are shown
// at once, so ranking/priority/scoring logic never changes, only the final
// output length. Defined once and reused everywhere a ranked recommendation
// list is rendered, rather than hardcoding 8 in multiple places.
const MAX_RECOMMENDATIONS = 8;
// Single source of truth for "the recommendation list a learner sees":
// 1) generate every valid recommendation via the existing buildResources(),
// 2) rank them with the existing compareRecommendations() exactly as before,
// 3) THEN cap to MAX_RECOMMENDATIONS. Any page that renders a ranked
// recommendation list (Recommendations page, and any dashboard/summary use)
// should call this instead of re-deriving its own list, so the cap is never
// bypassed or duplicated. If there are fewer than MAX_RECOMMENDATIONS valid
// recommendations, every one of them is still returned unchanged.
function getRankedRecommendations(comp, language){
  const resources = buildResources(comp, language);
  const ranked = [...resources].sort(compareRecommendations);
  return ranked.slice(0, MAX_RECOMMENDATIONS);
}

// Builds "My Learning" from the active learner's REAL learning history
// (LEARNER.learningHistory, written by startResource/advanceResource) plus
// the resource catalog — never hardcoded. "Recommended Next" is ranked
// through the same gapPriority engine used everywhere else.
function buildMyLearning(language){
  if(LEARNER.competency && LEARNER.competency.mode==="demo") return buildMyLearningDemo(language);
  const history = LEARNER.learningHistory || {};
  const comp = LEARNER.competency;
  const byName = {};
  if(comp && comp.ready) comp.list.forEach(l=>{ byName[l.name]=l.before; });
  // Provider/source and a "why recommended" reason travel with every
  // resource shown in My Learning (not just the Recommendations page) —
  // both are derived from the same resourceDefs + gapPriority data used
  // elsewhere, never hardcoded.
  const reasonFor = (r)=>{
    if(!(comp && comp.ready)) return gt(language,"matchesCompetency", r.competency);
    const g = gapPriority(r.competency, byName[r.competency], language);
    const status = statusOf(g.before, language);
    return gt(language,"recommendedBecauseScore", r.competency, g.before, status.label, g.target);
  };
  const learning = [], completed = [];
  const defs = LEARNER.resourceDefs || [];
  const extra = (r)=>({subtopic:r.subtopic, inferred:r.inferred, evidence:r.evidence, pathStatus:r.pathStatus, externalUrl:r.externalUrl, igotLive:r.igotLive});
  defs.forEach(r=>{
    const h = history[r.title];
    if(h && h.status==="in_progress") learning.push({title:r.title, progress:h.progress||0, duration:r.duration, competency:r.competency, difficulty:r.difficulty, source:r.source, reason:reasonFor(r), ...extra(r)});
    else if(h && h.status==="completed") completed.push({title:r.title, duration:r.duration, competency:r.competency, difficulty:r.difficulty, source:r.source, reason:reasonFor(r), ...extra(r)});
  });
  const notStarted = defs.filter(r=>{
    const h = history[r.title];
    if(h && h.status!=="not_started") return false;
    // Personalized-path resources carry a pathStatus; a "locked" one must
    // never appear as an immediate next action — only its unlocked "next"
    // subtopic (or resources with no path concept, e.g. legacy fixtures).
    return r.pathStatus===undefined || r.pathStatus==="next";
  });
  const ranked = comp && comp.ready
    ? [...notStarted].sort((a,b)=> gapPriority(b.competency, byName[b.competency]).recommendationScore - gapPriority(a.competency, byName[a.competency]).recommendationScore)
    : notStarted;
  const next = ranked.map(r=>({title:r.title, duration:r.duration, competency:r.competency, difficulty:r.difficulty, source:r.source, reason:reasonFor(r), ...extra(r)}));
  return {learning, next, completed, saved:[]};
}

// Turns the real, stored learner state into a Completed / Current / Upcoming
// status + a one-line detail for each of the 9 LOOP_STAGES. This reflects
// actual stored data only — it never marks a stage complete just to fill
// the UI. A pure "Launch Demo Journey" session (comp.mode==="demo") is the
// one deliberate exception, since it's explicitly a populated illustrative
// journey rather than a real learner's progress.
function computeLoopStages(session, language){
  const comp = LEARNER.competency;
  if(comp && comp.mode==="demo"){
    const demoDetails = [
      gt(language,"loopGoalSet", LEARNER.goal),
      gt(language,"loopMaterialUploaded"),
      gt(language,"loopTopicsExtractedDemo", TOPICS.length),
      gt(language,"loopBaselineDone"),
      gt(language,"loopBiggestGapDemo"),
      gt(language,"loopResourcesDemo", LEARNING_HISTORY.completed, LEARNING_HISTORY.inProgress),
      gt(language,"loopReassessDone"),
      gt(language,"loopImprovementDemo", LEARNING_HISTORY.lastCycleAvgImprovement),
      gt(language,"loopReadyToRecommend"),
    ];
    return LOOP_STAGES.map((s,i)=>({...s, status: i<8 ? "completed" : "current", detail: demoDetails[i]}));
  }

  const history = learningHistoryMapOf(session);
  const entries = Object.values(history);
  const completedCount = entries.filter(h=>h.status==="completed").length;
  const inProgressCount = entries.filter(h=>h.status==="in_progress").length;
  const assessmentDone = !!(session && session.assessmentCompleted);
  const reassessDone = !!(session && session.reassessCompleted);
  const goalSet = !!(session && session.goal);
  const materialUploaded = !!(session && session.uploadedMaterial);
  const topicsExtracted = !!(session && Array.isArray(session.extractedTopics) && session.extractedTopics.length>0);
  const gapReady = assessmentDone && !!(comp && comp.ready);
  const progressReady = reassessDone && !!(session && session.reassessScores);

  // One boolean per stage, in order — dependencies are implicit because the
  // walk below stops at the first false value.
  const done = [
    goalSet,
    materialUploaded,    // Learning Material — only once the learner has actually uploaded/stored material.
    topicsExtracted,      // AI Topic Extraction — only once real topics were extracted from that material.
    assessmentDone,       // Baseline Assessment
    gapReady,              // Competency Gap — assessment done AND real competency profile ready
    completedCount>0,     // Personalized Learning — only "done" once a resource is actually completed
    reassessDone,          // Re-assessment
    progressReady,          // Progress Analysis — real reassessment completed AND real reassessment scores exist
    false,                  // Next Recommendation — never marked complete; the loop keeps going
  ];
  let currentSet = false;
  const details = [
    goalSet ? gt(language,"loopGoalSet", session.goal) : gt(language,"loopGoalPending"),
    materialUploaded ? gt(language,"loopMaterialUploaded") : gt(language,"loopMaterialPending"),
    topicsExtracted ? gt(language,"loopTopicsExtracted", (session.extractedTopics||[]).length) : gt(language,"loopTopicsPending"),
    assessmentDone ? gt(language,"loopAssessmentScored", session.assessmentScore, Object.keys(session.topicScores||{}).length) : gt(language,"loopAssessmentPending"),
    (()=>{
      if(!gapReady) return gt(language,"loopGapsPending");
      const worst = [...comp.list].sort((a,b)=>a.before-b.before)[0];
      return worst ? gt(language,"loopGapWorst", worst.name, worst.before) : gt(language,"loopGapsCalculated");
    })(),
    (()=>{
      if(completedCount>0) return gt(language,"loopResourcesCompletedInProgress", completedCount, inProgressCount);
      if(inProgressCount>0) return gt(language,"loopResourcesInProgressOnly", inProgressCount);
      if(assessmentDone) return gt(language,"loopRecsReady");
      return gt(language,"loopRecsPending");
    })(),
    reassessDone ? gt(language,"loopReassessScored", session.reassessScore) : (completedCount>0 ? gt(language,"loopReadyToMeasure") : gt(language,"loopCompleteResourceFirst")),
    progressReady ? gt(language,"loopImprovementMeasured") : gt(language,"loopAvailableAfterReassess"),
    progressReady ? gt(language,"loopNextGapIdentified") : gt(language,"loopUnlocksAfterReassess"),
  ];
  return LOOP_STAGES.map((s,i)=>{
    let status;
    if(done[i]) status = "completed";
    else if(!currentSet){ status = "current"; currentSet = true; }
    else status = "upcoming";
    return {...s, status, detail:details[i]};
  });
}

function RadarChart({data, size=280}){
  const cx = size/2, cy = size/2, R = size*0.36, n = data.length;
  const angle = (i)=> -Math.PI/2 + i*(2*Math.PI/n);
  const pt = (i, val)=>{
    const rad = R*(val/100);
    return [cx+rad*Math.cos(angle(i)), cy+rad*Math.sin(angle(i))];
  };
  const rings = [0.25,0.5,0.75,1];
  const beforePts = data.map((d,i)=>pt(i,d.before)).map(p=>p.join(",")).join(" ");
  const afterPts = data.map((d,i)=>pt(i,d.after)).map(p=>p.join(",")).join(" ");
  return (
    <svg width={size} height={size}>
      {rings.map((r,i)=>(
        <polygon key={i} points={data.map((d,j)=>{const rad=R*r; return [cx+rad*Math.cos(angle(j)), cy+rad*Math.sin(angle(j))].join(",");}).join(" ")}
          fill="none" stroke="var(--line)" strokeWidth="1"/>
      ))}
      {data.map((d,i)=>{
        const [x,y] = pt(i,100);
        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="var(--line)" strokeWidth="1"/>;
      })}
      <polygon points={beforePts} fill="rgba(140,141,160,0.18)" stroke="var(--text-faint)" strokeWidth="1.5"/>
      <polygon points={afterPts} fill="rgba(67,56,202,0.20)" stroke="var(--indigo-600)" strokeWidth="2"/>
      {data.map((d,i)=>{
        const [x,y] = pt(i,100);
        const lx = cx + (R+26)*Math.cos(angle(i));
        const ly = cy + (R+26)*Math.sin(angle(i));
        return <text key={i} x={lx} y={ly} fontSize="10.5" fill="var(--text-dim)" textAnchor="middle" fontFamily="Inter">{d.name.split(" ").slice(0,2).join(" ")}</text>;
      })}
    </svg>
  );
}
function TrendLine({data, height=140, color="var(--indigo-600)"}){
  const w = 560, pad = 10;
  const max = Math.max(...data.map(d=>d.value)), min = Math.min(...data.map(d=>d.value));
  const range = Math.max(1, max-min);
  const pts = data.map((d,i)=>{
    const x = pad + (i/(data.length-1))*(w-pad*2);
    const y = height-pad - ((d.value-min)/range)*(height-pad*2);
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?"M":"L")+p[0]+","+p[1]).join(" ");
  const area = path+` L${pts[pts.length-1][0]},${height} L${pts[0][0]},${height} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${height}`} style={{width:"100%",height}}>
      <path d={area} fill={color} opacity="0.08"/>
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      {pts.map((p,i)=>(<circle key={i} cx={p[0]} cy={p[1]} r="4" fill={color}/>))}
      {data.map((d,i)=>(<text key={i} x={pts[i][0]} y={height-2} textAnchor="middle" fontSize="10" fill="var(--text-faint)">{d.label}</text>))}
    </svg>
  );
}

/* Premium 3D "Competency Intelligence Core": orbital rings, a glowing core,
   thin connecting lines and floating glass cards, with a subtle mouse-parallax
   tilt on desktop. Pure CSS/SVG — no external 3D library. */
function CompetencyCore3D(){
  const {t} = useLanguage();
  const wrapRef = useRef(null);
  const [tilt, setTilt] = useState({rx:58, rz:0});
  const reduceMotion = useMemo(()=> typeof window!=="undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, []);

  const onMove = useCallback((e)=>{
    if(reduceMotion || !wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    const px = (e.clientX - rect.left)/rect.width - 0.5;
    const py = (e.clientY - rect.top)/rect.height - 0.5;
    setTilt({rx: 58 - py*10, rz: px*8});
  }, [reduceMotion]);
  const onLeave = useCallback(()=>{ if(!reduceMotion) setTilt({rx:58, rz:0}); }, [reduceMotion]);

  return (
    <div className="landing-visual">
      <div className="landing-orb-perspective" ref={wrapRef} onMouseMove={onMove} onMouseLeave={onLeave}>
        <div className="landing-orb-stage" style={reduceMotion?undefined:{transform:`rotateX(${tilt.rx}deg) rotateZ(${tilt.rz}deg)`}}>
          <div className="landing-ring r3"><span className="landing-orbit-dot"></span></div>
          <div className="landing-ring r2"><span className="landing-orbit-dot"></span></div>
          <div className="landing-ring r1"><span className="landing-orbit-dot"></span></div>
          <svg className="landing-connections" viewBox="0 0 400 400" aria-hidden="true">
            <path d="M200,200 L216,86"/>
            <path d="M200,200 L60,120"/>
            <path d="M200,200 L36,232"/>
            <path d="M200,200 L210,304"/>
            <path d="M200,200 L332,166"/>
          </svg>
          <div className="landing-core">
            <IconLoop size={26}/>
            <span className="core-label">KarmSetu<br/>{t("journey.intelligence")}</span>
          </div>
        </div>
        {LANDING_FLOAT_CARDS.map((c,i)=>(
          <div className={"landing-float-card "+c.cls} key={i}>
            <span className="fc-icon" style={{background:c.bg}}><c.icon size={13} style={{color:c.fg}}/></span>
            {t(c.labelKey)}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================= LOOP DIAGRAM ============================= */
function LoopDiagram({size=460}){
  const n = LOOP_STAGES.length;
  const cx = size/2, cy = size/2, R = size*0.38;
  const nodeSize = size*0.15;
  return (
    <div className="loop-wrap">
      <div style={{position:"relative", width:size, height:size}}>
        <svg width={size} height={size} style={{position:"absolute",inset:0}}>
          <circle cx={cx} cy={cy} r={R} fill="none" stroke="var(--line-strong)" strokeWidth="2" strokeDasharray="1 10" strokeLinecap="round"/>
        </svg>
        <div style={{position:"absolute", left:cx-size*0.19, top:cy-size*0.19, width:size*0.38, height:size*0.38, borderRadius:"50%",
          background:"linear-gradient(135deg,var(--indigo-600),var(--indigo-900))", display:"flex",alignItems:"center",justifyContent:"center",
          flexDirection:"column", color:"#fff", boxShadow:"var(--shadow-pop)", textAlign:"center", padding:8}}>
          <IconBrain size={size*0.06}/>
          <div style={{fontFamily:"Sora",fontWeight:700,fontSize:size*0.032,marginTop:6}}>KarmSetu AI</div>
        </div>
        {LOOP_STAGES.map((s,i)=>{
          const a = -Math.PI/2 + i*(2*Math.PI/n);
          const x = cx + R*Math.cos(a) - nodeSize/2;
          const y = cy + R*Math.sin(a) - nodeSize/2;
          return (
            <div key={i} style={{position:"absolute", left:x, top:y, width:nodeSize, height:nodeSize, borderRadius:14,
              background:"#fff", border:"1px solid var(--line)", boxShadow:"var(--shadow-card)",
              display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:4, padding:6, textAlign:"center"}}>
              <s.icon size={nodeSize*0.28} style={{color:"var(--indigo-600)"}}/>
              <div style={{fontSize:size*0.021,fontWeight:600,lineHeight:1.15}}>{s.label}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

const GOAL_OPTIONS = ["Data Analysis","Artificial Intelligence","Project Management","Cybersecurity","Leadership","Communication","Digital Governance"];

function PasswordField({label, value, onChange, show, onToggle, placeholder, autoComplete}){
  const {t} = useLanguage();
  return (
    <div className="field">
      <label>{label}</label>
      <div className="field-password-wrap">
        <input required type={show?"text":"password"} value={value} onChange={onChange} placeholder={placeholder} autoComplete={autoComplete}/>

          {show ? <IconEyeOff size={16}/> : <IconEye size={16}/>}
        </button>
      </div>

}

function ForgotPasswordModal({onClose, notify}){
  const {t} = useLanguage();
  // step: "email" -> verify a registered account exists for the entered
  // address, "reset" -> collect + confirm a new password for that account,
  // "success" -> confirmation before returning to the Log In tab.
  const [step, setStep] = useState("email");
  const [resetEmail, setResetEmail] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmNewPassword, setConfirmNewPassword] = useState("");
  const [showPass, setShowPass] = useState(false);
  const [error, setError] = useState("");

  const submitEmail = (e)=>{
    e.preventDefault();
    setError("");
    const email = resetEmail.trim().toLowerCase();
    if(!email){
      setError(t("auth.errEnterCredentials"));
      return;
    }
    const accounts = loadAccounts();
    if(!accounts.some(a=>a.email===email)){
      setError(t("auth.errEmailNotRegistered"));
      return;
    }
    setResetEmail(email);
    setStep("reset");
  };

  const submitReset = (e)=>{
    e.preventDefault();
    setError("");
    if(!newPassword || !confirmNewPassword){
      setError(t("auth.errFillFields"));
      return;
    }
    if(newPassword.length < 6){
      setError(t("auth.errPasswordLength"));
      return;
    }
    if(newPassword !== confirmNewPassword){
      setError(t("auth.errPasswordMismatch"));
      return;
    }
    // Re-check the account still exists (it could have been removed in
    // another tab since step "email") and persist the new password into
    // the SAME accounts array/localStorage key that login reads from, so
    // the old password stops working and the new one takes effect
    // immediately.
    const accounts = loadAccounts();
    const idx = accounts.findIndex(a=>a.email===resetEmail);
    if(idx===-1){
      setError(t("auth.errEmailNotRegistered"));
      setStep("email");
      return;
    }
    accounts[idx] = {...accounts[idx], password: newPassword};
    saveAccounts(accounts);
    setStep("success");
  };

  const finish = ()=>{
    notify(t("auth.resetSuccessTitle"));
    onClose();
  };

  return (
    <Modal title={t("auth.forgotPasswordTitle")} onClose={onClose}>
      {error && <div className="auth-error"><IconInfo size={15} style={{flexShrink:0,marginTop:1}}/>{error}</div>}
      {step==="email" && (
        <form onSubmit={submitEmail}>
          <p className="text-dim fs-14" style={{lineHeight:1.6,marginBottom:16}}>{t("auth.forgotPasswordEmailIntro")}</p>
          <div className="field">
            <label>{t("auth.email")}</label>
            <input required type="email" value={resetEmail} onChange={e=>setResetEmail(e.target.value)} placeholder={t("auth.resetEmailPlaceholder")}/>
          </div>
          <div className="flex-row gap-10 mt-10" style={{flexWrap:"wrap"}}>
            <button className="btn btn-primary" type="submit">{t("auth.continueBtn")} <IconArrowRight size={16}/></button>
            <button type="button" className="btn btn-secondary" onClick={onClose}>{t("common.cancel")}</button>
          </div>
        </form>
      )}
      {step==="reset" && (
        <form onSubmit={submitReset}>
          <p className="text-dim fs-14" style={{lineHeight:1.6,marginBottom:16}}>{t("auth.resetPasswordIntro",{email:resetEmail})}</p>
          <PasswordField label={t("auth.newPassword")} value={newPassword} onChange={e=>setNewPassword(e.target.value)} show={showPass} onToggle={()=>setShowPass(s=>!s)} placeholder={t("auth.newPasswordPlaceholder")} autoComplete="new-password"/>
          <PasswordField label={t("auth.confirmNewPassword")} value={confirmNewPassword} onChange={e=>setConfirmNewPassword(e.target.value)} show={showPass} onToggle={()=>setShowPass(s=>!s)} placeholder={t("auth.confirmNewPasswordPlaceholder")} autoComplete="new-password"/>
          <div className="flex-row gap-10 mt-10" style={{flexWrap:"wrap"}}>
            <button className="btn btn-primary" type="submit">{t("auth.resetPasswordBtn")} <IconArrowRight size={16}/></button>
            <button type="button" className="btn btn-secondary" onClick={onClose}>{t("common.cancel")}</button>
          </div>
        </form>
      )}
      {step==="success" && (
        <div className="center">
          <div style={{width:64,height:64,borderRadius:"50%",background:"var(--green-bg)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 18px"}}>
            <IconCheckCircle size={30} style={{color:"var(--green)"}}/>
          </div>
          <h3 style={{fontSize:19}}>{t("auth.resetSuccessTitle")}</h3>
          <p className="text-dim fs-14 mt-10">{t("auth.resetSuccessMessage")}</p>
          <button className="btn btn-primary btn-block mt-20" type="button" onClick={finish}>{t("auth.backToLoginBtn")}</button>
        </div>
      )}
    </Modal>
  );
}

function AuthPage({go, notify, applySession, session}){
  // Safety net: if an active session already exists (e.g. the user reached
  // /auth via browser back/forward, a stale link, or a race on mount) don't
  // make them log in again — just continue them into the app. Normal
  // navigation already avoids sending an authenticated user here at all.
  useEffect(()=>{
    if(isSessionActive(session)) go("dashboard");
  }, [session]);
  const {t} = useLanguage();
  const [tab, setTab] = useState("register");
  const [goals, setGoals] = useState(["Data Analysis"]);
  const toggleGoal = (g)=> setGoals(prev => prev.includes(g) ? prev.filter(x=>x!==g) : [...prev, g]);
  const [showPass, setShowPass] = useState(false);
  const [error, setError] = useState("");
  const [showForgotPassword, setShowForgotPassword] = useState(false);

  const [regForm, setRegForm] = useState({name:"", email:"", password:"", confirmPassword:"", role:"", organization:"", level:"Intermediate"});
  const [loginForm, setLoginForm] = useState({email:"", password:""});
  const updateReg = (field)=>(e)=>{ const v=e.target.value; setRegForm(f=>({...f,[field]:v})); };
  const updateLogin = (field)=>(e)=>{ const v=e.target.value; setLoginForm(f=>({...f,[field]:v})); };

  const switchTab = (tabName)=>{ setTab(tabName); setError(""); };

  const submitRegister = (e)=>{
    e.preventDefault();
    setError("");
    const name = regForm.name.trim();
    const email = regForm.email.trim().toLowerCase();
    const password = regForm.password;
    if(!name || !email || !password || !regForm.confirmPassword){
      setError(t("auth.errFillFields"));
      return;
    }
    if(password.length < 6){
      setError(t("auth.errPasswordLength"));
      return;
    }
    if(password !== regForm.confirmPassword){
      setError(t("auth.errPasswordMismatch"));
      return;
    }
    if(goals.length===0){
      setError(t("auth.errSelectGoal"));
      return;
    }
    const accounts = loadAccounts();
    if(accounts.some(a=>a.email===email)){
      setError(t("auth.errAccountExists"));
      return;
    }
    const account = {
      name, email, password,
      role: regForm.role.trim(),
      organization: regForm.organization.trim(),
      level: regForm.level,
      goals: goals,
      goal: goals[0],
      createdAt: new Date().toISOString(),
    };
    accounts.push(account);
    saveAccounts(accounts);
    applySession({
      name: account.name, email: account.email, org: account.organization, role: account.role,
      goal: account.goal, level: account.level,
      isAuthenticated: true, isDemo: false, loginAt: new Date().toISOString(),
    });
    notify(t("auth.accountCreated"));
    go("onboarding");
  };

  const submitLogin = (e)=>{
    e.preventDefault();
    setError("");
    const email = loginForm.email.trim().toLowerCase();
    const password = loginForm.password;
    if(!email || !password){
      setError(t("auth.errEnterCredentials"));
      return;
    }
    const accounts = loadAccounts();
    const account = accounts.find(a=>a.email===email && a.password===password);
    if(!account){
      setError(t("auth.errInvalidCredentials"));
      return;
    }
    // Restore the FULL stored account state (uploaded material, extracted
    // topics, generated questions, assessment/reassessment results, learning
    // history, resource effectiveness, and the real activityDates/streak) so
    // everything the learner built up survives logout/login — not just the
    // baseline assessment. `password` is excluded from the live session.
    const {password:_pw, ...accountState} = account;
    applySession({
      ...accountState,
      isAuthenticated: true, isDemo: false, loginAt: new Date().toISOString(),
    });
    notify(t("auth.welcomeBack", {name: account.name.split(" ")[0]}));
    go("dashboard");
  };

  const startDemo = ()=>{
    applySession(buildDemoSession());
    notify(t("auth.demoActivated"));
    go("dashboard");
  };

  return (
    <div className="auth-shell">
      <div className="auth-side">
        <div className="logo" style={{color:"#fff",fontSize:19}}><LogoMark/>KarmSetu</div>
        <div>
          <AIBadge>{t("common.aiPoweredBadge")}</AIBadge>
          <h2 style={{color:"#fff",fontSize:30,marginTop:20,lineHeight:1.25}}>{t("auth.heroTitle")}</h2>
          <p style={{color:"#C9C8E8",marginTop:16,fontSize:15,maxWidth:380,lineHeight:1.6}}>{t("auth.heroDesc")}</p>
        </div>
        <div style={{display:"flex",gap:24}}>
          <div><div style={{fontFamily:"Sora",fontWeight:700,fontSize:22,color:"#fff"}}>4,820+</div><div style={{fontSize:12.5,color:"#9694C4"}}>{t("auth.activeLearners")}</div></div>
          <div><div style={{fontFamily:"Sora",fontWeight:700,fontSize:22,color:"#fff"}}>34%</div><div style={{fontSize:12.5,color:"#9694C4"}}>{t("auth.avgImprovement")}</div></div>
        </div>
      </div>
      <div className="auth-form-side">
        <div className="auth-form-wrap">
          <div className="auth-tabs">
            <button type="button" className={"auth-tab"+(tab==="register"?" active":"")} onClick={()=>switchTab("register")}>{t("auth.registerTab")}</button>
            <button type="button" className={"auth-tab"+(tab==="login"?" active":"")} onClick={()=>switchTab("login")}>{t("auth.loginTab")}</button>
          </div>
          <form onSubmit={tab==="register" ? submitRegister : submitLogin}>
            {error && <div className="auth-error"><IconInfo size={15} style={{flexShrink:0,marginTop:1}}/>{error}</div>}
            {tab==="register" && (
              <>
                <div className="field"><label>{t("auth.fullName")}</label><input required value={regForm.name} onChange={updateReg("name")} placeholder={t("auth.namePlaceholder")}/></div>
                <div className="field"><label>{t("auth.email")}</label><input required type="email" value={regForm.email} onChange={updateReg("email")} placeholder={t("auth.emailPlaceholder")}/></div>
                <PasswordField label={t("auth.password")} value={regForm.password} onChange={updateReg("password")} show={showPass} onToggle={()=>setShowPass(s=>!s)} placeholder={t("auth.passwordPlaceholder")} autoComplete="new-password"/>
                <PasswordField label={t("auth.confirmPassword")} value={regForm.confirmPassword} onChange={updateReg("confirmPassword")} show={showPass} onToggle={()=>setShowPass(s=>!s)} placeholder={t("auth.confirmPasswordPlaceholder")} autoComplete="new-password"/>
                <div className="grid-2">
                  <div className="field"><label>{t("auth.roleDesignation")}</label><input value={regForm.role} onChange={updateReg("role")} placeholder={t("auth.rolePlaceholder")}/></div>
                  <div className="field"><label>{t("auth.organization")}</label><input value={regForm.organization} onChange={updateReg("organization")} placeholder={t("auth.orgPlaceholder")}/></div>
                </div>
                <div className="field">
                  <label>{t("auth.experienceLevel")}</label>
                  <select value={regForm.level} onChange={updateReg("level")}>
                    <option value="Beginner">{t("auth.beginner")}</option>
                    <option value="Intermediate">{t("auth.intermediate")}</option>
                    <option value="Advanced">{t("auth.advanced")}</option>
                  </select>
                </div>
                <div className="field">
                  <label>{t("auth.whatLearnQuestion")}</label>
                  <div className="chip-select">
                    {GOAL_OPTIONS.map(g=>(
                      <button type="button" key={g} className={"chip"+(goals.includes(g)?" selected":"")} onClick={()=>toggleGoal(g)}>{goalLabel(t, g)}</button>
                    ))}
                  </div>
                </div>
              </>
            )}
            {tab==="login" && (
              <>
                <div className="field"><label>{t("auth.email")}</label><input required type="email" value={loginForm.email} onChange={updateLogin("email")} placeholder={t("auth.emailPlaceholder")}/></div>
                <PasswordField label={t("auth.password")} value={loginForm.password} onChange={updateLogin("password")} show={showPass} onToggle={()=>setShowPass(s=>!s)} placeholder={t("auth.loginPasswordPlaceholder")} autoComplete="current-password"/>
                <button type="button" onClick={()=>setShowForgotPassword(true)} style={{background:"none",border:"none",padding:0,margin:"-4px 0 0",cursor:"pointer",fontSize:13.5,fontWeight:600,color:"var(--indigo-600)",alignSelf:"flex-start"}}>{t("auth.forgotPasswordLink")}</button>
              </>
            )}
            <button className="btn btn-primary btn-block mt-10" type="submit">{tab==="register" ? t("auth.createAccount") : t("auth.loginTab")} <IconArrowRight size={17}/></button>
          </form>
          <button type="button" className="btn btn-secondary btn-block mt-10" onClick={startDemo}><IconPlay size={15}/> {t("auth.continueInDemo")}</button>
          <p className="text-faint fs-13 center mt-16">{t("auth.localPrototypeNote")}</p>
        </div>
      </div>
      {showForgotPassword && <ForgotPasswordModal onClose={()=>setShowForgotPassword(false)} notify={notify}/>}
    </div>
  );
}

function OnboardingPage({go, notify, applySession, session}){
  const {t} = useLanguage();
  const [step, setStep] = useState(0);
  const [name, setName] = useState((session && session.name) || LEARNER.name);
  const [organization, setOrganization] = useState((session && session.org) || LEARNER.org);
  const [goal, setGoal] = useState((session && session.goal) || GOAL_OPTIONS[0]);
  const [level, setLevel] = useState((session && session.level) || "Intermediate");
  const [comps, setComps] = useState(["Statistics","Machine Learning Basics"]);
  const total = 4;
  const toggleComp = (c)=> setComps(prev => prev.includes(c) ? prev.filter(x=>x!==c) : [...prev, c]);
  const finish = ()=>{
    applySession({
      ...(session||{}),
      name: name.trim() || LEARNER.name,
      org: organization.trim() || LEARNER.org,
      goal, level,
      isAuthenticated: true,
    });
    notify(t("onboarding.workspaceReady"));
    go("dashboard");
  };
  const next = ()=> step < total ? setStep(step+1) : finish();
  return (
    <div className="onb-shell">
      <div className="onb-progress">{Array.from({length:total}).map((_,i)=>(<span key={i} className={i<step? "done": (i===step && step<total ? "done":"")}></span>))}</div>
      <div className="onb-card card card-pad">
        {step===0 && (
          <>
            <h3 style={{fontSize:22,marginBottom:8}}>{t("onboarding.step0Title")}</h3>

            <p className="text-dim fs-14 mt-10">{t("onboarding.doneSub",{goal,level})}</p>
          </div>
        )}
        <div className="flex-between mt-24">
          {step>0 ? <button className="btn btn-ghost" onClick={()=>setStep(step-1)}><IconChevronLeft size={16}/> {t("common.back")}</button> : <span></span>}
          <button className="btn btn-primary" onClick={next}>{step===total ? t("onboarding.continueToWorkspace") : t("common.continue")} <IconArrowRight size={16}/></button>
        </div>
      </div>
    </div>
  );
}

function DashboardPage({go, session}){

/* ============================= UPLOAD PAGE ============================= */
const UPLOAD_SUPPORTED_EXT = ["pdf","ppt","pptx","doc","docx","txt"];
const UPLOAD_PARSEABLE_EXT = ["pdf","pptx","docx","txt"]; // legacy binary .doc/.ppt cannot be read reliably client-side
function formatFileSize(bytes){
  if(!bytes && bytes!==0) return "";
  if(bytes < 1024*1024) return Math.max(1,Math.round(bytes/1024))+" KB";
  return (bytes/(1024*1024)).toFixed(1)+" MB";
}
// NORMAL USER MODE upload flow: the learner's own file is read and parsed
// in the browser (extractTextFromFile), topics are extracted from THAT
// text (extractTopicsFromText), and both the initial and re-assessment
// question sets are generated from THAT text (generateQuestionsFromMaterial)
// — there is no predefined Data Analysis fallback here.
function UploadPage({go, notify, session, applySession}){
  const {t, language} = useLanguage();
  const [file, setFile] = useState(null); // {name, type, size, status}
  const [drag, setDrag] = useState(false);
  const [progress, setProgress] = useState(0);
  const [error, setError] = useState("");
  const [extracted, setExtracted] = useState(null); // {text, topics}
  const inputRef = useRef(null);

  const processFile = async (rawFile)=>{
    setError("");
    setExtracted(null);
    setProgress(0);
    const ext = (rawFile.name.split(".").pop()||"").toLowerCase();
    if(!UPLOAD_SUPPORTED_EXT.includes(ext)){
      setError(t("upload.errUnsupported",{ext}));
      return;
    }
    setFile({name:rawFile.name, type:ext.toUpperCase(), size:formatFileSize(rawFile.size), status:t("upload.extractingStatus")});
    setProgress(35);
    if(!UPLOAD_PARSEABLE_EXT.includes(ext)){
      setError(t("upload.errLegacy",{ext}));
      setFile(null);
      return;
    }
    try{
      const text = await extractTextFromFile(rawFile, ext);
      if(!text || text.trim().length < 200){
        setError(t("upload.errNotEnoughText"));
        setFile(null);
        return;
      }
      const topics = extractTopicsFromText(text);
      // Every generated question needs 4 distinct real options — the
      // correct answer plus 3 genuine distractors drawn from OTHER topics
      // in this same material (never fabricated). With fewer than 4
      // distinct topics there's no way to build even one such question
      // without inventing content, so this is caught here with a clear
      // explanation rather than letting the learner into an assessment
      // that silently has zero usable questions.
      if(topics.length < 4){
        setError(t("upload.errNotEnoughTopics"));
        setFile(null);
        return;
      }
      setProgress(100);
      setFile(f=>({...f, status:t("upload.readyStatus")}));
      setExtracted({text, topics});
    }catch(e){
      setError(t("upload.errReadFailed"));
      setFile(null);
    }
  };

  const onDrop = (e)=>{ e.preventDefault(); setDrag(false); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if(f) processFile(f); };
  const onPick = (e)=>{ const f = e.target.files && e.target.files[0]; if(f) processFile(f); e.target.value=""; };

  const analyze = ()=>{
    if(!extracted || !file) return;
    const initialQuestions = generateQuestionsFromMaterial(extracted.text, extracted.topics, "initial", null, language);
    const reassessQuestions = generateQuestionsFromMaterial(extracted.text, extracted.topics, "reassess", initialQuestions, language);
    const uploadedMaterial = {
      name: file.name, type: file.type, size: file.size,
      // Capped so a large document doesn't overflow localStorage's quota —
      // still far more than enough for real topic/question generation.
      text: extracted.text.slice(0,30000),
      uploadedAt: new Date().toISOString(),
    };
    const resetFields = {
      assessmentCompleted:false, assessmentScore:null, topicScores:null, topicStats:null, competencyScores:null,
      reassessCompleted:false, reassessScore:null, reassessScores:null, reassessTopicStats:null,
      learningHistory:{}, resourceEffectiveness:[],
    };
    // Diagnostics are captured as plain session fields (not left as extra
    // array properties on generatedQuestions/reassessQuestions) because
    // JSON.stringify — used to persist the session to localStorage — drops
    // non-index properties from arrays. Without this, the honest
    // "N questions / based on your material / M topics covered" status and
    // the low-evidence explanation would disappear after any reload.
    const assessmentDiagnostics = {
      generatedCount: initialQuestions.generatedCount,
      usableEvidenceCount: initialQuestions.usableEvidenceCount,
      topicCoverage: initialQuestions.topicCoverage,
      generationNote: initialQuestions.generationNote || null,
    };
    const reassessDiagnostics = {
      generatedCount: reassessQuestions.generatedCount,
      usableEvidenceCount: reassessQuestions.usableEvidenceCount,
      topicCoverage: reassessQuestions.topicCoverage,
      generationNote: reassessQuestions.generationNote || null,
    };
    const patch = {
      uploadedMaterial, extractedTopics: extracted.topics,
      generatedQuestions: initialQuestions, reassessQuestions,
      assessmentDiagnostics, reassessDiagnostics,
      ...resetFields,
    };
    const nextSession = {...(session||{}), ...patch};
    if(applySession) applySession(nextSession);
    if(nextSession.email) updateAccountFields(nextSession.email, patch);
    notify(t("upload.uploadedNotify",{count:extracted.topics.length})
      + (initialQuestions.generationNote ? ". "+initialQuestions.generationNote : ""));
    go("processing");
  };

  return (
    <WorkspaceShell page="upload" go={go} title={t("upload.title")}>
      <SectionHead title={t("upload.heading")} sub={t("upload.sub")} />
      <input ref={inputRef} type="file" accept=".pdf,.ppt,.pptx,.doc,.docx,.txt" style={{display:"none"}} onChange={onPick}/>
      {error && <div className="auth-error" style={{marginBottom:16,maxWidth:560}}><IconInfo size={15} style={{flexShrink:0,marginTop:1}}/>{error}</div>}
      {!file ? (
        <div className={"upload-zone"+(drag?" drag":"")}
          onDragOver={e=>{e.preventDefault(); setDrag(true);}}
          onDragLeave={()=>setDrag(false)}
          onDrop={onDrop}>
          <div style={{width:56,height:56,borderRadius:14,background:"#EDEBFB",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 18px"}}>
            <IconUpload size={26} style={{color:"var(--indigo-600)"}}/>
          </div>
          <h3 style={{fontSize:18,marginBottom:8}}>{t("upload.dragDrop")}</h3>
          <p className="text-dim fs-14">{t("upload.orClickBrowse")}</p>
          <div className="flex-row gap-10" style={{justifyContent:"center",marginTop:20,flexWrap:"wrap"}}>
            {["PDF","PPT","PPTX","DOC","DOCX","TXT"].map(ftype=>(<span key={ftype} className="badge badge-neutral">{ftype}</span>))}
          </div>
          <button className="btn btn-primary mt-24" onClick={()=>inputRef.current && inputRef.current.click()}><IconUpload size={16}/> {t("common.browseFiles")}</button>
          <p className="text-faint fs-13 mt-16">{t("upload.localNote")}</p>
        </div>
      ) : (
        <div className="card card-pad" style={{maxWidth:560}}>
          <div className="file-card" style={{border:"none",padding:0}}>
            <div style={{width:46,height:46,borderRadius:11,background:"#FBE9DA",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><IconFile size={20} style={{color:"var(--amber-deep)"}}/></div>
            <div style={{flex:1,minWidth:0}}>
              <div className="fw-600 fs-15">{file.name}</div>
              <div className="text-faint fs-13 mt-8">{file.type} · {file.size}</div>
            </div>
          </div>
          <div className="mt-20">
            <div className="flex-between fs-13" style={{marginBottom:8}}><span className="text-dim">{file.status}</span><span className="fw-600">{progress}%</span></div>
            <ProgressBar value={progress} />
          </div>
          {extracted && (
            <p className="fs-13 text-dim mt-16"><IconCheckCircle size={13} style={{verticalAlign:-2,marginRight:4,color:"var(--green)"}}/>{extracted.topics.length} {t("upload.topicsIdentified")}{extracted.topics.map(tp=>translateTopicLabel(tp, language)).join(", ")}</p>
          )}
          <div className="flex-row gap-12 mt-24">
            <button className="btn btn-secondary" onClick={()=>{setFile(null); setExtracted(null); setError("");}}>{t("common.remove")}</button>
            <button className="btn btn-primary btn-block" disabled={progress<100 || !extracted} onClick={analyze}>{t("upload.analyzeMaterial")} <IconArrowRight size={16}/></button>
          </div>
        </div>
      )}
    </WorkspaceShell>
  );
}

/* ============================= AI PROCESSING ============================= */
const PROC_STAGES = [
  "Reading learning material",
  "Extracting concepts",
  "Identifying important topics",
  "Mapping competencies",
  "Designing assessment",
  "Preparing your competency baseline",
];
function ProcessingPage({go}){
  const {t} = useLanguage();
  const PROC_STAGE_KEYS = ["processing.s1","processing.s2","processing.s3","processing.s4","processing.s5","processing.s6"];
  const [idx, setIdx] = useState(0);
  const [pct, setPct] = useState(4);
  useEffect(()=>{
    const iv = setInterval(()=>{
      setIdx(prev=>{
        const nxt = prev+1;
        if(nxt >= PROC_STAGES.length){ clearInterval(iv); setTimeout(()=>go("topics"), 700); return prev; }
        return nxt;
      });
      setPct(p=>Math.min(96, p + Math.round(100/PROC_STAGES.length)));
    }, 900);
    return ()=>clearInterval(iv);
  },[]);
  const done = idx >= PROC_STAGES.length-1 && pct>=96;
  return (
    <div className="proc-shell">
      <div className="proc-card">
        <div className="proc-orb"><IconBrain size={30} style={{color:"var(--indigo-600)"}}/></div>
        <h2 style={{fontSize:22}}>{done ? t("processing.doneTitle") : t("processing.activeTitle")}</h2>
        <div className="card card-pad mt-24" style={{textAlign:"left"}}>
          {PROC_STAGE_KEYS.map((key,i)=>(
            <div key={i} className={"proc-stage"+(i<idx?" done":i===idx?" active":"")}>
              <span className="tick">{i<idx ? <IconCheck size={12} style={{color:"#fff"}}/> : <span style={{width:6,height:6,borderRadius:"50%",background:i===idx?"#fff":"var(--text-faint)"}}></span>}</span>
              {t(key)}
            </div>
          ))}
          <div className="mt-20">
            <div className="flex-between fs-13" style={{marginBottom:8}}><span className="text-dim">{t("processing.aiAnalysis")}</span><span className="fw-600">{Math.min(pct,96)}%</span></div>
            <ProgressBar value={Math.min(pct,96)}/>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================= EXTRACTED TOPICS ============================= */
// NORMAL USER MODE reads the real topics KarmSetu extracted from the
// learner's own uploaded file (LEARNER.extractedTopics); only an explicit
// demo session ever sees the fixed Data Analysis TOPICS list.
function TopicsPage({go}){
  const {t, language} = useLanguage();
  const isDemo = LEARNER.isDemo;
  const realTopics = LEARNER.extractedTopics || [];
  // Real (non-demo) subtopics/evidence are derived from the learner's own
  // uploaded material, reusing the same generator the learning path uses —
  // so this mapping view and the actual path can never disagree.
  const structured = (!isDemo && LEARNER.uploadedMaterial && LEARNER.uploadedMaterial.text)
    ? buildStructuredContent(LEARNER.uploadedMaterial.text) : null;
  const topics = isDemo ? TOPICS : realTopics.map((name,i)=>{
    const competency = competencyLabelFor(name);
    const subtopics = structured ? generateSubtopicsForCompetency(name, structured, 3, 5, language) : [];
    return {
      name, competency,
      importance: i===0 ? "High" : (i<3 ? "Medium" : "Standard"),
      difficulty: ["Beginner","Intermediate","Advanced"][i%3],
      weight: Math.round(100/(realTopics.length||1)),
      subtopics,
    };
  });
  const importanceKey = {High:"topics.importanceHigh", Medium:"topics.importanceMedium", Standard:"topics.importanceStandard"};
  const materialLabel = LEARNER.file ? LEARNER.file.name : "your uploaded material";
  return (
    <WorkspaceShell page="upload" go={go} title={t("topics.title")}>
      <SectionHead title={t("topics.heading")} sub={t("topics.sub",{material:materialLabel})} />
      {topics.length===0 ? (
        <CompetencyEmptyState go={go} note={t("topics.noTopicsNote")}/>
      ) : (
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        {topics.map((tp,i)=>(
          <div key={i} className="card card-pad">
            <div className="flex-between" style={{flexWrap:"wrap",gap:10}}>
              <div className="flex-row gap-12">
                <div style={{width:38,height:38,borderRadius:10,background:"#EDEBFB",display:"flex",alignItems:"center",justifyContent:"center"}}><IconLayers size={17} style={{color:"var(--indigo-600)"}}/></div>
                <div>
                  <h3 style={{fontSize:16}}>{translateTopicLabel(tp.name, language)}</h3>
                  {!isDemo && tp.competency && tp.competency!==tp.name && (
                    <div className="fs-12 text-faint mt-8">{t("topics.competencyLabel")}{tp.competency}</div>
                  )}
                </div>
              </div>
              <span className="badge badge-neutral">{t("topics.assessmentWeight",{weight:tp.weight})}</span>
            </div>
            <div className="flex-row gap-20 mt-16" style={{flexWrap:"wrap"}}>
              <span className="fs-13 text-dim">{t("topics.importance")} <b style={{color:"var(--text)"}}>{t(importanceKey[tp.importance]||"topics.importanceStandard")}</b></span>
              <span className="fs-13 text-dim">{t("topics.difficulty")} <b style={{color:"var(--text)"}}>{difficultyLabel(t, tp.difficulty)}</b></span>
            </div>
            {!isDemo && tp.subtopics && tp.subtopics.length>0 && (
              <div className="mt-14" style={{background:"var(--paper-dim)",borderRadius:12,padding:"10px 14px"}}>
                <p className="fs-11 fw-700 text-faint" style={{textTransform:"uppercase",letterSpacing:".04em",marginBottom:6}}>{t("topics.subtopicsIdentified")}</p>
                <div className="flex-row gap-8" style={{flexWrap:"wrap"}}>
                  {tp.subtopics.map((s,si)=>(
                    <span key={si} className="badge badge-neutral" title={translateEvidenceText(s.evidence||"", language)}>{translateTopicLabel(s.title, language)}{s.inferred ? t("topics.aiInferred") : ""}</span>
                  ))}
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
      )}
      <div className="flex-row gap-12 mt-24">
        <button className="btn btn-secondary" onClick={()=>go("upload")}>{t("topics.reuploadMaterial")}</button>
        <button className="btn btn-primary" disabled={topics.length===0} onClick={()=>go("assessment")}>{t("topics.startAssessment")} <IconArrowRight size={16}/></button>
      </div>
    </WorkspaceShell>
  );
}

/* ============================= ASSESSMENT ============================= */
const TOPIC_DIFFICULTY = {
  "Python Fundamentals":"Beginner",
  "Data Cleaning":"Intermediate",
  "Data Visualization":"Intermediate",
  "Statistics":"Intermediate",
  "Machine Learning Basics":"Advanced",
};
function AssessmentPage({go, notify, mode="initial", session, applySession}){
  const {t, language} = useLanguage();
  // NORMAL USER MODE: questions generated from the learner's own uploaded
  // material (LEARNER.generatedQuestions / LEARNER.reassessQuestions).
  // The fixed Data Analysis question banks are used ONLY for an explicit
  // demo session (or as a last-resort safety net if a real learner somehow
  // reaches this page with no generated questions yet).
  const isDemo = LEARNER.isDemo;
  const QS = mode==="initial"
    ? (isDemo ? QUESTIONS_INITIAL : ((LEARNER.generatedQuestions && LEARNER.generatedQuestions.length) ? LEARNER.generatedQuestions : QUESTIONS_INITIAL))
    : (isDemo ? QUESTIONS_REASSESS : ((LEARNER.reassessQuestions && LEARNER.reassessQuestions.length) ? LEARNER.reassessQuestions : QUESTIONS_REASSESS));
  const [i, setI] = useState(0);
  const [answers, setAnswers] = useState({});
  const [flagged, setFlagged] = useState({});
  // Instructions gate: every fresh visit to this page (new assessment or
  // reassessment attempt) must show the instructions modal first. The quiz
  // itself is unaffected — this only controls whether the modal is shown
  // on top; no question/answer/scoring state is touched by it.
  const [showInstructions, setShowInstructions] = useState(true);
  const q = QS[i];
  // Re-resolves q's learner-facing text (stem/options/source) for the
  // CURRENTLY selected language on every render — so switching language
  // mid-assessment (or after generation) updates existing questions
  // immediately, without touching answers/scoring/topic/answer index.
  const display = getQuestionDisplay(q, language);
  const select = (oi)=> setAnswers(a=>({...a,[i]:oi}));
  // Synchronous in-memory guard against a rapid double-click/repeated-click
  // firing submit() twice (for either Assessment or Reassessment XP) before
  // navigation away from this page happens. rewards.awarded inside
  // applyXPPatches remains the real, persisted dedupe guard — this ref only
  // stops a second synchronous submit from reaching it while this page is
  // still mounted.
  const submitLockRef = useRef(false);
  const submit = ()=>{
    if(submitLockRef.current) return;
    submitLockRef.current = true;
    if(mode==="initial"){
      // Evaluate the learner's actual selected answers — score, topic-wise
      // performance and competency-wise performance — then write the result
      // into the active session (and, if this is a real account, onto the
      // stored account too) before navigating anywhere.
      const result = scoreAssessment(QS, answers);
      const completedAt = new Date().toISOString();
      let nextSession = {
        ...(session||{}),
        assessmentAnswers: answers,
        assessmentScore: result.overallScore,
        topicScores: result.topicScores,
        topicStats: result.topicStats,
        // 1:1 mapping in this prototype: every question's "topic" is one of
        // the five tracked competencies, so competency-wise performance is
        // the same per-name breakdown as topic-wise performance.
        competencyScores: result.topicScores,
        assessmentCompleted: true,
        assessmentCompletedAt: completedAt,
      };
      // XP: +50 for the baseline assessment — a one-time flat award (this
      // prototype models exactly one baseline assessment per learner), so a
      // fixed dedupe key is enough to guarantee it is never awarded twice,
      // including on a refresh or a repeated submit.
      let awardedEntries = null;
      if(!(session && session.assessmentCompleted)){
        const xp = applyXPPatches(nextSession, [{type:"assessment_complete", key:"assessment_baseline"}]);
        if(xp){ nextSession = {...nextSession, rewards: xp.rewards}; awardedEntries = xp.awardedEntries; }
      }
      if(applySession) applySession(nextSession);
      if(nextSession.email){
        updateAccountFields(nextSession.email, {
          assessmentCompleted: true,
          assessmentScore: result.overallScore,
          topicScores: result.topicScores,
          topicStats: result.topicStats,
          competencyScores: result.topicScores,
          assessmentAnswers: answers,
          assessmentCompletedAt: completedAt,
          rewards: nextSession.rewards,
        });
      }
      notify(t("assessment.scoredNotify",{score:result.overallScore}));
      if(awardedEntries) notify(xpToastMessage(t, awardedEntries));
      go("results");
    } else {
      // Re-assessment: score the learner's ACTUAL answers against a fresh
      // question set (QUESTIONS_REASSESS), then write new competency scores,
      // improvement and resource-effectiveness data onto the session — this
      // is what drives Progress, and (via computeCompetencyView) recalculates
      // Gaps/Competencies/Recommendations against the NEW competency state.
      const result = scoreAssessment(QS, answers);
      const completedAt = new Date().toISOString();
      const base = {
        ...(session||{}),
        reassessAnswers: answers,
        reassessScore: result.overallScore,
        reassessTopicScores: result.topicScores,
        reassessTopicStats: result.topicStats,
        reassessScores: result.topicScores,
        reassessCompleted: true,
        reassessCompletedAt: completedAt,
      };
      const resourceEffectiveness = computeResourceEffectiveness(base);
      // Completing a reassessment is qualifying learning activity for the
      // real, session-based streak (see computeStreak/activityPatch) — this
      // is also where a Streak Shield, if available, may get consumed to
      // bridge exactly one missed day (see maybeUseStreakShield).
      const streakPatch = activityPatch(base);
      let nextSession = {...base, resourceEffectiveness, ...streakPatch};
      // XP: +75 for the reassessment itself (one-time flat award — this
      // prototype models exactly one reassessment cycle), +200 for each
      // competency that genuinely improved over the baseline, +20 for
      // today's qualifying activity, plus any newly-reached streak
      // milestone. All ride on this same session write, and every one of
      // these candidates carries its own deterministic dedupe key so
      // applyXPPatches never awards the same thing twice.
      const candidates = [
        {type:"reassessment_complete", key:"reassessment_complete"},
        ...competencyImprovementCandidates(session && session.competencyScores, result.topicScores, 1),
        dailyActivityCandidate(),
        ...streakMilestoneCandidates(nextSession.streak),
      ];
      const xp = applyXPPatches(nextSession, candidates);
      let awardedEntries = null;
      if(xp){ nextSession = {...nextSession, rewards: xp.rewards}; awardedEntries = xp.awardedEntries; }
      if(applySession) applySession(nextSession);
      if(nextSession.email){
        updateAccountFields(nextSession.email, {
          reassessScore: result.overallScore,
          reassessTopicScores: result.topicScores,
          reassessTopicStats: result.topicStats,
          reassessScores: result.topicScores,
          reassessAnswers: answers,
          reassessCompleted: true,
          reassessCompletedAt: completedAt,
          resourceEffectiveness,
          ...streakPatch,
          rewards: nextSession.rewards,
        });
      }
      notify(t("assessment.reassessScoredNotify",{score:result.overallScore}));
      if(awardedEntries) notify(xpToastMessage(t, awardedEntries));
      go("progress");
    }
  };
  // Cancelling out of the instructions modal backs the learner out to
  // wherever they started this attempt from, without touching any
  // question/answer state (a fresh visit re-shows the modal next time).
  const cancelInstructions = ()=> go(mode==="initial" ? "topics" : "reassessment");
  return (
    <WorkspaceShell page="upload" go={go} title={t("assessment.title")}>
      <div className="quiz-shell">
        <div className="flex-between" style={{flexWrap:"wrap",gap:10}}>
          <h2 style={{fontSize:22}}>{mode==="initial" ? t("assessment.baselineTitle") : t("assessment.reassessTitle")}</h2>
          <span className="flex-row gap-8 text-faint fs-13"><IconClock size={15}/> {t("assessment.estMin",{n:QS.length})}</span>
        </div>
        {!isDemo && (()=>{
          const diag = mode==="initial" ? LEARNER.assessmentDiagnostics : LEARNER.reassessDiagnostics;
          const coverage = diag && diag.topicCoverage;
          return (
            <div className="mt-8">
              <div className="flex-row gap-8" style={{flexWrap:"wrap",alignItems:"center"}}>
                <span className="badge badge-ai"><span className="dot"></span>{t("assessment.aiGeneratedBadge")}</span>
                <span className="fs-13 text-faint">
                  {QS.length} question{QS.length===1?"":"s"} • {t("assessment.basedOnContent")}
                  {coverage ? ` • ${coverage.coveredTopics} topic${coverage.coveredTopics===1?"":"s"} ${t("assessment.topicsCovered")}` : ""}
                </span>
              </div>
              {diag && diag.generationNote && (
                <p className="fs-12 text-faint mt-8"><IconInfo size={12} style={{verticalAlign:-1,marginRight:4}}/>{diag.generationNote}</p>
              )}
            </div>
          );
        })()}
        <div className="flex-between mt-16 fs-13 text-dim" style={{flexWrap:"wrap",gap:8}}>
          <span>{t("assessment.questionOf",{i:i+1,n:QS.length})}</span>
          <span className="flex-row gap-8">
            <span className="badge badge-neutral">{t("assessment.competencyLabel")}{q.topic}</span>
            <span className="badge badge-neutral">{difficultyLabel(t, q.difficulty || TOPIC_DIFFICULTY[q.topic] || "Intermediate")}</span>
          </span>
        </div>
        <div className="mt-10"><ProgressBar value={((i+1)/QS.length)*100} /></div>

        <div className="card card-pad mt-24">
          <h3 style={{fontSize:17,marginBottom:20,lineHeight:1.4}}>{display.qText}</h3>
          {display.options.map((opt,oi)=>(
            <div key={oi} className={"quiz-option"+(answers[i]===oi?" selected":"")} onClick={()=>select(oi)}>
              <span className="option-letter">{String.fromCharCode(65+oi)}</span>{opt}
            </div>
          ))}
          <button className={"btn btn-sm mt-10"+(flagged[i]?" btn-primary":" btn-ghost")} onClick={()=>setFlagged(f=>({...f,[i]:!f[i]}))}>
            <IconFlag size={14}/> {flagged[i] ? t("assessment.flagged") : t("assessment.flagQuestion")}
          </button>
          {display.source && <p className="fs-12 text-faint mt-10"><IconInfo size={12} style={{verticalAlign:-1,marginRight:4}}/>{display.source}</p>}
        </div>

        <div className="flex-between mt-24">
          <button className="btn btn-secondary" disabled={i===0} onClick={()=>setI(i-1)}><IconChevronLeft size={16}/> {t("common.previous")}</button>
          {i < QS.length-1 ? (
            <button className="btn btn-primary" onClick={()=>setI(i+1)}>{t("common.next")} <IconChevronRight size={16}/></button>
          ) : (
            <button className="btn btn-primary" onClick={submit}>{t("assessment.submitAssessment")} <IconCheck size={16}/></button>
          )}
        </div>
      </div>
      {showInstructions && (
        <AssessmentInstructionsModal
          mode={mode}
          onStart={()=>setShowInstructions(false)}
          onCancel={cancelInstructions}
        />
      )}
    </WorkspaceShell>
  );
}

/* ============================= COMPETENCY GAP DASHBOARD ============================= */
const SEVERITY_LABEL_KEYS = {LOW:"common.severityLow", MEDIUM:"common.severityMedium", HIGH:"common.severityHigh", CRITICAL:"common.severityCritical"};
// Maps effectivenessOf()'s CSS class to its common.* translation key —
// same pattern as SEVERITY_LABEL_KEYS. The English label stored on the
// effectiveness object itself is kept only as a non-rendered fallback;
// every render site looks the translated label up via this map + t().
const IMPACT_LABEL_KEYS = {green:"common.impactStrong", yellow:"common.impactGood", orange:"common.impactModest"};
function GapsPage({go}){
  const {t:tt, language} = useLanguage();
  const gapExplainForLang = GAP_EXPLAIN[language] || GAP_EXPLAIN.en;
  const comp = LEARNER.competency;
  if(!comp.ready){
    return (
      <WorkspaceShell page="competencies" go={go} title={tt("gaps.title")}>
        <SectionHead title={tt("gaps.heading")} sub={tt("gaps.sub")} />
        <CompetencyEmptyState go={go} note={tt("gaps.emptyNote")}/>
      </WorkspaceShell>
    );
  }
  // Pass the current language through so the demo "why this priority"
  // evidence (see GAP_ENGINE.evidenceByLang / gapPriority) re-renders in the
  // selected language immediately, including mid-session language switches —
  // the same language-switch-aware behavior as qByLang/optionsByLang on the
  // assessment questions themselves.
  const targets = comp.list.map(b=>({...b, ...gapPriority(b.name, b.before, language)}));
  const strengths = targets.filter(t=>t.before>=80);
  const developing = targets.filter(t=>t.before>=55 && t.before<80);
  const critical = targets.filter(t=>t.before<55);
  const Section = ({title, items, accent, note})=>(
    <div className="mt-24">
      <div className="flex-row gap-10" style={{marginBottom:14}}>
        <span style={{width:10,height:10,borderRadius:"50%",background:accent}}></span>
        <h3 style={{fontSize:16}}>{title}</h3>
        <span className="text-faint fs-13">{note}</span>
      </div>
      {items.length===0 && <p className="text-faint fs-14">{tt("gaps.noneInBand")}</p>}
      <div className="grid-2">
        {items.map((t,i)=>(
          <div key={i} className="gap-card">
            <div className="flex-between"><span className="fw-700 fs-15">{t.name}</span><span className={"badge badge-status-"+priorityCls(t.label)}>{tt(SEVERITY_LABEL_KEYS[t.label] || "common.severityLow")}</span></div>
            <div className="gap-arrow-row"><span>{t.before}%</span><IconArrowRight size={13}/><span>{t.target}%</span><span className="text-faint">{tt("gaps.gapSuffix",{gap:t.gapScore})}</span></div>
            {gapExplainForLang[t.name] && (
              <div className="flex-row gap-10 mt-14" style={{alignItems:"flex-start",background:"var(--paper-dim)",padding:"12px 14px",borderRadius:12}}>
                <IconLightbulb size={16} style={{color:"var(--amber-deep)",flexShrink:0,marginTop:2}}/>
                <p className="fs-13 text-dim" style={{lineHeight:1.5}}>{gapExplainForLang[t.name]}</p>
              </div>
            )}
            <div className="flex-row gap-8 mt-10" style={{flexWrap:"wrap"}}>
              <WhyPriority g={t}/>
            </div>
            <EvidencePanel items={t.evidence}/>
          </div>
        ))}
      </div>
    </div>
  );
  return (
    <WorkspaceShell page="competencies" go={go} title={tt("gaps.title")}>
      <SectionHead title={tt("gaps.heading")} sub={tt("gaps.sub")} />
      <Section title={tt("gaps.strengthsTitle")} items={strengths} accent="var(--green)" note={tt("gaps.strengthsNote")} />
      <Section title={tt("gaps.developingTitle")} items={developing} accent="var(--yellow)" note={tt("gaps.developingNote")} />
      <Section title={tt("gaps.criticalTitle")} items={critical} accent="var(--red)" note={tt("gaps.criticalNote")} />
      <div className="center mt-24"><button className="btn btn-primary" onClick={()=>go("recommendations")}>{tt("gaps.viewRecommendations")} <IconArrowRight size={16}/></button></div>
    </WorkspaceShell>
  );
}

/* ============================= RECOMMENDATIONS ============================= */
function RecommendationsPage({go, notify, session, applySession}){
  const {t, language} = useLanguage();
  const comp = LEARNER.competency;
  const [refreshTick, setRefreshTick] = useState(0);
  if(!comp.ready){
    return (
      <WorkspaceShell page="recommendations" go={go} title={t("recommendations.title")}>
        <SectionHead title={t("recommendations.heading")} sub={t("recommendations.sub")} />
        <CompetencyEmptyState go={go} note={t("recommendations.emptyNote")}/>
      </WorkspaceShell>
    );
  }
  // Recomputed on every render (and explicitly on Refresh) from the
  // learner's current competency data via the existing gap-priority engine —
  // never a static/hardcoded list. getRankedRecommendations() runs the
  // existing buildResources() + compareRecommendations() ranking exactly as
  // before, then caps the already-ranked output to MAX_RECOMMENDATIONS — the
  // ranking itself is unchanged, only how many of the ranked results are
  // displayed. If there are fewer than MAX_RECOMMENDATIONS valid
  // recommendations, all of them are still shown.
  const ranked = useMemo(()=> getRankedRecommendations(comp, language), [comp, refreshTick, language]);
  const topPickTitle = ranked.find(r=>r.learnerStatus!=="locked" && r.learnerStatus!=="completed")?.title;
  const refresh = ()=>{ setRefreshTick(t=>t+1); notify(t("recommendations.refreshedNotify")); };
  return (
    <WorkspaceShell page="recommendations" go={go} title={t("recommendations.title")}>
      <div className="flex-between" style={{flexWrap:"wrap",gap:10}}>
        <SectionHead title={t("recommendations.heading")} sub={t("recommendations.sub")} />
        <button className="btn btn-secondary btn-sm" onClick={refresh}><IconRefresh size={14}/> {t("recommendations.refreshResources")}</button>
      </div>
      <p className="fs-12 text-faint" style={{marginBottom:16}}><IconInfo size={12} style={{verticalAlign:-1,marginRight:4}}/>{t("recommendations.scoreDisclaimer")}</p>
      <div className="grid-2">
        {ranked.map((r,i)=>{
          const isDemoMode = LEARNER.competency && LEARNER.competency.mode==="demo";
          const status = isDemoMode ? "not_started" : r.learnerStatus;
          const byName = {}; comp.list.forEach(l=>{byName[l.name]=l.before;});
          const startClick = ()=>{
            if(isDemoMode){ notify(t("recommendations.startedNotify",{title:r.title})); return; }
            // Persist the real learningHistory entry for this exact
            // resource/subtopic first, then deep-link straight into its
            // Learning Session — never the generic My Learning landing page.
            startResource(session, applySession, notify, r, byName[r.competency], t);
            go("learning", {openTitle: r.title});
          };
          const openExactSession = ()=>{
            if(isDemoMode) return;
            go("learning", {openTitle: r.title});
          };
          // Every resource's source is one of exactly three honest labels —
          // see resourceSourceMeta(). Demo-mode fixture resources have no
          // externalUrl/igotLive, so they correctly resolve to "KarmSetu
          // Guided Lesson" rather than any iGOT claim.
          const sm = resourceSourceMeta(r);
          return (
          <div key={i} className="rec-card">
            <div className="flex-between">
              <span className={"badge "+sm.badgeClass}>{sm.label}</span>
              {r.title===topPickTitle ? <span className="badge badge-status-green">{t("recommendations.recommendedForYou")}</span> : <span className={"badge badge-status-"+priorityCls(r.priority)}>{t(SEVERITY_LABEL_KEYS[r.priority] || "common.severityLow")}</span>}
            </div>
            <h3 style={{fontSize:16.5}}>{r.title}</h3>
            {r.subtopic && r.subtopic!==r.competency && (
              <div className="fs-12 text-faint" style={{marginTop:-4,marginBottom:8}}>
                {r.competency} &rsaquo; {r.subtopic}
                {r.inferred ? <span className="badge badge-neutral" style={{marginLeft:8,fontSize:10.5}}>{t("recommendations.aiInferredBadge")}</span> : (r.evidence ? <span className="badge badge-neutral" style={{marginLeft:8,fontSize:10.5}}>{t("recommendations.fromMaterialBadge")}</span> : null)}
              </div>
            )}
            <div className="rec-meta">
              <span><IconLayers size={13}/>{resourceTypeLabel(t, r.type)}</span>
              <span><IconTarget size={13}/>{difficultyLabel(t, r.difficulty)}</span>
              <span><IconClock size={13}/>{r.duration}</span>
              <span><IconGap size={13}/>{r.competency}</span>
            </div>
            {!isDemoMode && typeof r.pathCompetencyCurrent==="number" && (
              <div className="fs-12 text-dim" style={{marginTop:2}}>
                {t("recommendations.currentTargetGap",{current:r.pathCompetencyCurrent, target:r.pathCompetencyTarget, gap:r.pathCompetencyGap})}
              </div>
            )}
            <div style={{background:"var(--paper-dim)",borderRadius:12,padding:"12px 14px",marginTop:10,display:"flex",flexDirection:"column",gap:10}}>
                <div>
                  <p className="fs-11 fw-700 text-faint" style={{textTransform:"uppercase",letterSpacing:".04em",marginBottom:3}}>{t("recommendations.whatToLearn")}</p>
                  <p className="fs-13" style={{margin:0}}>{r.subtopic || r.title}</p>
                </div>
                <div>
                  <p className="fs-11 fw-700 text-faint" style={{textTransform:"uppercase",letterSpacing:".04em",marginBottom:3}}>{t("recommendations.whyNeedIt")}</p>
                  <p className="fs-13" style={{margin:0}}>{r.reason}</p>
                </div>
                <div>
                  <p className="fs-11 fw-700 text-faint" style={{textTransform:"uppercase",letterSpacing:".04em",marginBottom:3}}>{t("recommendations.whereToLearn")}</p>
                  <p className="fs-13" style={{margin:0,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                    <span className={"badge "+sm.badgeClass} style={{fontSize:10,padding:"3px 10px"}}>{sm.label}</span>
                    <span>{resourceTypeLabel(t, r.type)} · {r.duration} · {sm.access}</span>
                  </p>
                  {r.externalUrl && (
                    <a href={r.externalUrl} target="_blank" rel="noopener noreferrer" className="fs-12 fw-600" style={{color:"var(--indigo-600)",marginTop:6,display:"inline-block"}}>{t("common.openVerifiedSource")}</a>
                  )}
                </div>
                {r.youtube && (
                  <div style={{padding:"10px 12px",borderRadius:10,background:"#ECEBFB",border:"1px solid #CFCBF2"}}>
                    <p className="fs-11 fw-700" style={{color:"var(--indigo-700)",textTransform:"uppercase",letterSpacing:".04em",marginBottom:6}}>{t("recommendations.learningResource")}</p>
                    {r.youtube.kind==="video" ? (
                      <>
                        <p className="fs-13 fw-600" style={{margin:0}}>{r.youtube.title}</p>
                        <p className="fs-12 text-dim" style={{margin:"3px 0 10px"}}>{r.youtube.channel} &middot; {r.youtube.duration} &middot; {r.subtopic || r.competency}</p>
                        <button className="btn btn-primary btn-sm" onClick={startClick}><IconPlay size={13}/> {t("common.watchVideo")}</button>
                      </>
                    ) : (
                      <>
                        <p className="fs-13 fw-600" style={{margin:0}}>{t("recommendations.searchQuery",{topic:r.subtopic || r.competency})}</p>
                        <p className="fs-12 text-dim" style={{margin:"3px 0 10px"}}>{t("recommendations.noVideoYet")}</p>
                        <a href={r.youtube.url} target="_blank" rel="noopener noreferrer" className="btn btn-secondary btn-sm" style={{display:"inline-flex",width:"fit-content"}}>{t("common.searchOnYoutube")}</a>
                      </>
                    )}
                  </div>
                )}
                <div>
                  <p className="fs-11 fw-700 text-faint" style={{textTransform:"uppercase",letterSpacing:".04em",marginBottom:3}}>{t("recommendations.whatHappensNext")}</p>
                  <p className="fs-13" style={{margin:0}}>{t("recommendations.nextStepsText")}</p>
                </div>
            </div>
            <div className="flex-row gap-8" style={{alignItems:"center",marginTop:10}}>
              <div style={{flex:1}}><ProgressBar value={r.recommendationScore} color="var(--indigo-600)" thin/></div>
              <span className="fs-13 fw-700" style={{color:"var(--indigo-600)",whiteSpace:"nowrap"}}>{r.recommendationScore}{t("recommendations.relevance")}</span>
            </div>
            <div className="flex-between mt-8">
              {status==="completed" ? (
                <button className="btn btn-secondary btn-sm" onClick={openExactSession}><IconCheck size={13}/> {t("common.review")}</button>
              ) : status==="in_progress" ? (
                <button className="btn btn-secondary btn-sm" onClick={openExactSession}><IconClock size={13}/> {t("common.continueLearning")}</button>
              ) : status==="locked" ? (
                <button className="btn btn-secondary btn-sm" disabled><IconLock size={13}/> {t("common.locked")}</button>
              ) : (
                <button className="btn btn-primary btn-sm" onClick={startClick}><IconPlay size={13}/> {t("common.startLearning")}</button>
              )}
              <div className="flex-row gap-8">
                <button className="btn btn-secondary btn-sm" onClick={()=>go("learning")}>{t("recommendations.viewDetails")}</button>
                <WhyRecommended reason={r.reason} factors={r.factors} score={r.recommendationScore}/>
              </div>
            </div>
          </div>
          );
        })}
      </div>

      {LEARNER.isDemo ? (
      <div className="section" style={{padding:"56px 0 20px"}}>
        <div className="flex-between" style={{flexWrap:"wrap",gap:10,marginBottom:20}}>
          <div>
            <span className="badge badge-guided" style={{marginBottom:10}}>{t("recommendations.igotCatalogBadge")}</span>
            <h2 style={{fontSize:22}}>{t("recommendations.igotCatalogTitle")}</h2>
            <p className="text-dim fs-14 mt-8">{t("recommendations.igotCatalogDesc")}</p>

        <div className="grid-2">
          {IGOT_RESOURCES.map((r,i)=>(
            <div key={i} className="card card-pad">
              <div className="flex-row gap-10" style={{marginBottom:10}}>
                <div style={{width:36,height:36,borderRadius:9,background:"#FFF3E2",display:"flex",alignItems:"center",justifyContent:"center"}}><IconBook size={16} style={{color:"var(--amber-deep)"}}/></div>

                <span><IconBuilding size={13}/>{t("recommendations.karmsetuIgotAligned")}</span>

        <div className="card card-pad mt-20" style={{background:"var(--paper-dim)"}}>

/* ============================= MY LEARNING ============================= */
function LearningCard({c, cta, primary, onClick}){
  // Every card in My Learning shows provider/source, competency, difficulty,
  // duration, why it's recommended, and how it's accessed — not just title
  // + CTA — so a learner can see all of this without leaving the page.
  // pathStatus (completed/in_progress/next/locked, from buildLearningPaths)
  // gets an explicit status badge here too, using the same labels as the
  // Personalized Path tab, so status is clear no matter which tab a
  // resource is being viewed from.
  const {t} = useLanguage();
  const statusMeta = c.pathStatus ? subtopicStatusMeta(c.pathStatus, t) : null;
  const sm = resourceSourceMeta(c);
  return (
    <div className="card card-pad">
      <div className="flex-between" style={{marginBottom:8}}>
        <span className={"badge "+sm.badgeClass}>{sm.label}</span>
        <div className="flex-row gap-8" style={{alignItems:"center"}}>
          {c.inferred ? <span className="badge badge-neutral" style={{fontSize:10.5}}>{t("recommendations.aiInferredBadge")}</span> : (c.evidence ? <span className="badge badge-neutral" style={{fontSize:10.5}}>{t("recommendations.fromMaterialBadge")}</span> : null)}
          {statusMeta && <span className={statusMeta.badgeClass} style={{fontSize:10.5}}>{statusMeta.label}</span>}
        </div>
      </div>
      <h3 style={{fontSize:15.5,marginBottom:10}}>{c.title}</h3>
      <div className="rec-meta" style={{marginBottom:12}}>
        <span><IconClock size={13}/>{c.duration}</span>
        <span><IconGap size={13}/>{c.competency}</span>
        <span><IconTarget size={13}/>{difficultyLabel(t, c.difficulty)}</span>
      </div>
      {typeof c.progress === "number" && (
        <div className="mt-8" style={{marginBottom:14}}>
          <div className="flex-between fs-12 text-dim" style={{marginBottom:6}}><span>{t("learning.progress")}</span><span className="fw-600">{c.progress}%</span></div>
          <ProgressBar value={c.progress}/>
        </div>
      )}
      {c.reason && (
        <p className="fs-12 text-faint" style={{marginBottom:14,lineHeight:1.5}}><IconInfo size={12} style={{verticalAlign:-1,marginRight:4}}/>{c.reason}</p>
      )}
      <button className={"btn btn-sm btn-block "+(primary ? "btn-primary" : "btn-secondary")} onClick={onClick}>{cta}</button>

      )}

  );
